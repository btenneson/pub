name: Verify maintenance repair
on:
  push:
    branches: ['repair/workflow-paths-20260915']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf==1.26.4 pyyaml
      - name: Compare existing overflow repairs and inspect rebuild
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz, difflib, subprocess
          pairs=[
          ('docs/stat.AP_Applications/ads_534_homework_8/ADS_534-tenneson_homework_8_version_1.pdf','ADS/healthcare_biomedical/ADS_534-tenneson_homework_8_version_1.pdf'),
          ('docs/cs.LO_Logic_in_Computer_Science/from_and_to_new_golden_mathematics_reader_version/02_amld_complete_picture.pdf','AMLD_Reading_Wing/02_amld_complete_picture.pdf')]
          for a,b in pairs:
              da,db=fitz.open(a),fitz.open(b)
              print('COMPARE',a,b,len(da),len(db))
              assert len(da)==len(db)
              for i in range(len(da)):
                  ta,tb=da[i].get_text(),db[i].get_text()
                  if ta!=tb:
                      print('TEXT DELTA',i+1)
                      print('\n'.join(difflib.unified_diff(ta.splitlines(),tb.splitlines())))
              print('METADATA',da.metadata,db.metadata)
          subprocess.run(['python','scripts/build_publications_106.py'],check=True)
          subprocess.run(['python','scripts/audit_subject_catalog_106.py'],check=True)
          subprocess.run(['git','diff','--stat','--','docs'],check=True)
          subprocess.run(['git','diff','--','docs/search-index.json'],check=True)
          PY
      - name: Check rebuild stability
        run: git diff --exit-code -- docs
