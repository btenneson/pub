name: Publish House Three Stories four-page PDF
on:
  push:
    branches: [main]
    paths:
      - 'docs/cs.AI_Artificial_Intelligence/house_md_three_stories_diagnoses_as_conjectures/source.tex'
      - 'docs/cs.AI_Artificial_Intelligence/house_md_three_stories_diagnoses_as_conjectures/house_character_illustration.jpg'
      - '.github/workflows/publish_house_three_stories.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publication verification dependency
        run: python -m pip install pymupdf==1.26.4
      - name: Compile and validate four-page PDF
        shell: bash
        run: |
          set -euo pipefail
          d='docs/cs.AI_Artificial_Intelligence/house_md_three_stories_diagnoses_as_conjectures'
          cd "$d"
          pdflatex -interaction=nonstopmode -halt-on-error source.tex
          pdflatex -interaction=nonstopmode -halt-on-error source.tex
          test "$(pdfinfo source.pdf | sed -n 's/^Pages:[[:space:]]*//p')" = "4"
          pdftotext source.pdf - | grep -q 'Leg pain'
          mv source.pdf 'House_Three_Stories_Diagnoses_as_Conjectures.pdf'
          mkdir -p "$GITHUB_WORKSPACE/cs.AI_Artificial_Intelligence/house_md_three_stories_diagnoses_as_conjectures"
          cp 'House_Three_Stories_Diagnoses_as_Conjectures.pdf' "$GITHUB_WORKSPACE/cs.AI_Artificial_Intelligence/house_md_three_stories_diagnoses_as_conjectures/House_Three_Stories_Diagnoses_as_Conjectures.pdf"
          rm -f source.aux source.log source.out
      - name: Rebuild reviewed publication catalog and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_publications_106.py
          python3 scripts/audit_subject_catalog_106.py
          test -s 'cs.AI_Artificial_Intelligence/house_md_three_stories_diagnoses_as_conjectures/House_Three_Stories_Diagnoses_as_Conjectures.pdf'
          test -s 'docs/cs.AI_Artificial_Intelligence/house_md_three_stories_diagnoses_as_conjectures/House_Three_Stories_Diagnoses_as_Conjectures.pdf'
          grep -q 'Do not depth-charge too early' 'docs/index.html'
      - name: Commit validated PDF and links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs scripts/publications.json cs.AI_Artificial_Intelligence/house_md_three_stories_diagnoses_as_conjectures/
          if ! git diff --cached --quiet; then
            git commit -m "Add four-page House Three Stories publication PDF [skip ci]"
            git push
          fi
