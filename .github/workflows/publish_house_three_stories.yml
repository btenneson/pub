name: Publish House Three Stories four-page PDF
on:
  push:
    branches: [main]
    paths:
      - 'docs/cs.AI_Artificial_Intelligence/house_md_three_stories_diagnoses_as_conjectures/source.tex'
      - '.github/workflows/publish_house_three_stories.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Compile and validate four-page PDF
        shell: bash
        run: |
          set -euo pipefail
          d='docs/cs.AI_Artificial_Intelligence/house_md_three_stories_diagnoses_as_conjectures'
          cd "$d"
          pdflatex -interaction=nonstopmode -halt-on-error source.tex
          pdflatex -interaction=nonstopmode -halt-on-error source.tex
          test "$(pdfinfo source.pdf | sed -n 's/^Pages:[[:space:]]*//p')" = "4"
          pdftotext source.pdf - | grep -q 'Leg pain'
          mv source.pdf 'House_Three_Stories_Diagnoses_as_Conjectures.pdf'
          rm -f source.aux source.log source.out
      - name: Connect PDF downloads to reader and slot-one card
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base='cs.AI_Artificial_Intelligence/house_md_three_stories_diagnoses_as_conjectures'
          pdf='House_Three_Stories_Diagnoses_as_Conjectures.pdf'
          reader=Path('docs')/base/'index.html'
          text=reader.read_text()
          href='/pub/'+base+'/'+pdf
          if 'Download PDF' not in text:
              text=text.replace('<p><a href="/pub/'+base+'/source.tex">Download LaTeX source</a></p>', '<p><a href="'+href+'" download>Download PDF</a> · <a href="/pub/'+base+'/source.tex">Download LaTeX source</a></p>')
          text=text.replace('A four-page PDF is generated by the repository publication workflow;', 'The four-page public PDF is available below;')
          reader.write_text(text)
          home=Path('docs/index.html')
          text=home.read_text()
          needle='<a href="/pub/'+base+'/source.tex">LaTeX source</a>'
          if 'href="'+href+'"' not in text:
              assert needle in text, 'Missing House case study source link'
              text=text.replace(needle, '<a href="'+href+'" download>Download PDF</a>'+needle,1)
          home.write_text(text)
          PY
      - name: Commit validated PDF and links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/cs.AI_Artificial_Intelligence/house_md_three_stories_diagnoses_as_conjectures/
          if ! git diff --cached --quiet; then
            git commit -m "Add four-page House Three Stories publication PDF [skip ci]"
            git push
          fi
