name: Publish FAIR-ZIP transcendent theorem search at slot 1
on:
  push:
    branches: [main]
    paths:
      - 'incoming_publications/transcendent_theorem_search_brute_force_vs_delicate_0_1/source.tex'
      - 'scripts/publish_transcendent_theorem_search_brute_force_vs_delicate_0_1_slot1.py'
      - '.github/workflows/publish_transcendent_theorem_search_brute_force_vs_delicate_0_1_slot1.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-fairzip-slot1
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TeX and PDF verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install -q pymupdf==1.26.4
      - name: Compile exact article and rebuild publication catalog
        run: python scripts/publish_transcendent_theorem_search_brute_force_vs_delicate_0_1_slot1.py
      - name: Commit verified document and site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/publications.json docs cs.LO_Logic_in_Computer_Science/transcendent_theorem_search_brute_force_vs_delicate_0_1
          if ! git diff --cached --quiet; then
            git commit -m 'Publish FAIR-ZIP article in slot 1, preserve preceding cards [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
