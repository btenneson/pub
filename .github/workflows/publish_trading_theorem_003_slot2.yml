name: Publish Trading Theorem 003

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_trading_theorem_003_slot2.yml'
      - 'incoming_publications/trading_theorem_003/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and PDF audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install pymupdf==1.26.4

      - name: Reconstruct and compile uploaded source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/trading_theorem_003
          cat incoming_publications/trading_theorem_003/source.tex.gz.b64.part* | base64 -d | gzip -d > .build/trading_theorem_003/source.tex
          test "$(wc -c < .build/trading_theorem_003/source.tex)" -eq 50625
          test "$(sha256sum .build/trading_theorem_003/source.tex | awk '{print $1}')" = "f2739564acef328e12479a40ad121690d98bfaa637caa8239c64727d12d89925"
          grep -q '\\end{document}' .build/trading_theorem_003/source.tex
          cd .build/trading_theorem_003
          for i in 1 2 3 4; do
            pdflatex -interaction=nonstopmode -halt-on-error source.tex
          done
          test -s source.pdf

      - name: Stage PDF and source under cs.LO
        shell: bash
        run: |
          set -euo pipefail
          PUB='cs.LO_Logic_in_Computer_Science/trading_theorem_003'
          mkdir -p "$PUB" "docs/$PUB"
          cp .build/trading_theorem_003/source.pdf "$PUB/Trading_Theorem_003.pdf"
          cp .build/trading_theorem_003/source.tex "docs/$PUB/source.tex"

      - name: Verify paper and add it as the second library card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, fitz

          root = Path('.')
          pub_id = 'cs.LO_Logic_in_Computer_Science/trading_theorem_003'
          pdf_name = 'Trading_Theorem_003.pdf'
          archive = root / pub_id / pdf_name
          source = root / 'docs' / pub_id / 'source.tex'
          assert archive.is_file() and archive.stat().st_size > 0
          assert source.is_file() and source.stat().st_size == 50625
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'f2739564acef328e12479a40ad121690d98bfaa637caa8239c64727d12d89925'

          doc = fitz.open(archive)
          pages = len(doc)
          assert pages == 19, f'Expected 19 pages, got {pages}'
          quote = 'The guiding distinction is between deductive content and deductive presentation'
          page1 = re.sub(r'\s+', ' ', doc[0].get_text()).strip()
          assert quote in page1, 'Card quote not found on PDF page 1'
          assert all(doc[i].get_text().strip() for i in range(pages)), 'Unreadable or empty PDF page'
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()

          card_text = ('A consequence-preserving Trading Theorem for mutually reproducible deductive resources, '
                       'with rule/axiom internalization, verifier-safe checkpoint handoff, quotient search, '
                       'BANK macros, presentation portfolios, and an MIU worked example.')

          cat = root / 'scripts/publications.json'
          data = json.loads(cat.read_text())
          old = [x for x in data['items'] if x.get('id') != pub_id]
          assert old, 'Publication catalog unexpectedly empty'
          first, rest = old[0], old[1:]
          for x in rest:
              if isinstance(x.get('order'), int):
                  x['order'] += 1
          first_order = first.get('order') if isinstance(first.get('order'), int) else -2
          item = {
              'title': 'Trading Theorem 003 — Mutual Reproducibility, Consequence-Preserving Trades, Quotient Hunting, and Verified Settlement Search',
              'kind': 'Core paper',
              'quote': quote,
              'quote_page': 1,
              'card_text': card_text,
              'subject': 'cs.LO_Logic_in_Computer_Science',
              'id': pub_id,
              'href': pub_id + '/',
              'pdf': pub_id + '/' + pdf_name,
              'archive_path': pub_id + '/' + pdf_name,
              'sha256': digest,
              'pages': pages,
              'order': first_order + 1,
              'source': pub_id + '/source.html',
              'authors': 'Brian Tenneson',
              'source_file': pub_id + '/source.tex',
              'classification_note': 'Audited corrected edition, September 17, 2026. Subject classification: cs.LO — Logic in Computer Science.'
          }
          data['items'] = [first, item] + rest
          cat.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          aliases = json.loads((root / 'scripts/publication_aliases.json').read_text())
          expected = len(data['items']) + len(aliases['items'])
          wrapper = root / 'scripts/build_publications_106.py'
          s = wrapper.read_text()
          s2 = re.sub(r'if len\(expanded\["items"\]\) != \d+:', f'if len(expanded["items"]) != {expected}:', s)
          assert s2 != s or f'!= {expected}' in s, 'Could not update expected publication count'
          wrapper.write_text(s2)
          (root / '.build' / 'trading_expected_count.txt').write_text(str(expected))
          PY

      - name: Rebuild catalog and audit every publication reader
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(cat .build/trading_expected_count.txt)"
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py
          python - "$EXPECTED" <<'PY'
          from pathlib import Path
          import json, sys

          expected = int(sys.argv[1])
          docs = Path('docs')
          pub_id = 'cs.LO_Logic_in_Computer_Science/trading_theorem_003'
          search = json.loads((docs / 'search-index.json').read_text())
          assert search['count'] == expected, (search['count'], expected)
          assert search['items'][1]['id'] == pub_id, 'New publication is not the second library card'
          assert search['items'][1]['quote_page'] == 1
          assert 'The guiding distinction is between deductive content and deductive presentation' in search['items'][1]['quote']
          reader = docs / pub_id / 'index.html'
          source = docs / pub_id / 'source.html'
          pdf = docs / pub_id / 'Trading_Theorem_003.pdf'
          assert reader.is_file() and source.is_file() and pdf.is_file()
          homepage = (docs / 'index.html').read_text()
          assert 'Trading Theorem 003' in homepage
          print(f'PASS: {expected} cards; Trading Theorem 003 is card 2 and all publication audits passed.')
          PY

      - name: Remove one-time staging payload
        run: rm -rf incoming_publications/trading_theorem_003

      - name: Commit tested publication and generated library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish Trading Theorem 003 [skip ci]'
            git push
          fi
