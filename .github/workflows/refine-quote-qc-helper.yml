name: Refine quotation QC helper
# Allow deliberately concise brochure maxim

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-quote-qc-helper.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Lower final quote-length floor for concise exact quotation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/_quote_rollout_temp.py')
          s=p.read_text(encoding='utf-8')
          old='assert 55 <= len(q) <= 340, (item["title"], q)'
          new='assert 45 <= len(q) <= 340, (item["title"], q)'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('validation length marker missing')
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile scripts/_quote_rollout_temp.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/_quote_rollout_temp.py
          git commit -m 'Allow concise exact quotation in library QC'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
