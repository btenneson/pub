name: Refine quotation QC helper
# Final brochure cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-quote-qc-helper.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Add clean ALD brochure quotation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/_quote_rollout_temp.py')
          s=p.read_text(encoding='utf-8')
          marker='''MANUAL_OVERRIDES = {\n'''
          entry='''MANUAL_OVERRIDES = {\n    "papers/automated_logical_deciders_brochure/": "program stop ≠ search exhaustion ≠ logical settlement.",\n'''
          if '"papers/automated_logical_deciders_brochure/"' not in s:
              if marker not in s: raise SystemExit('manual override marker missing')
              s=s.replace(marker,entry,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile scripts/_quote_rollout_temp.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/_quote_rollout_temp.py
          git commit -m 'Use clean ALD brochure quotation'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
