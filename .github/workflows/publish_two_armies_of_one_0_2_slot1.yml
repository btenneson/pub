name: Publish Two Armies of One v0.2 in slot 1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_two_armies_of_one_0_2_slot1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare TeX sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/two_armies_of_one_0_2
          cp incoming_publications/two_armies_of_one_0_2/source.tex .build/two_armies_of_one_0_2/source.tex
          cp incoming_publications/two_armies_of_one_0_2/ledger.tex .build/two_armies_of_one_0_2/ledger.tex
      - name: Compile both PDFs with bundled TeXLive
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            source.tex
            ledger.tex
          working_directory: .build/two_armies_of_one_0_2
      - name: Validate compiler output
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pymupdf==1.26.4
          test -s .build/two_armies_of_one_0_2/source.pdf
          test -s .build/two_armies_of_one_0_2/ledger.pdf

      - name: Publish files, add card 1, and rebuild reviewed catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz, hashlib, html, json, re, shutil, sys, zipfile
          root=Path('.')
          build=root/'.build/two_armies_of_one_0_2'
          pub_id='cs.LO_Logic_in_Computer_Science/two_armies_of_one_scout_probe_rendezvous_0_2'
          pdf_name='Two_Armies_of_One_Scout_Probe_Rendezvous_0_2_ATLAS_Repaired.pdf'
          pkg_name='Two_Armies_of_One_0_2_ATLAS_Repaired_Complete.zip'
          quote='There are two armies of one: one Scout and one Probe. Their meeting point need not be specified in advance.'
          candidate=fitz.open(build/'source.pdf')
          text=' '.join(' '.join(p.get_text().split()) for p in candidate)
          assert len(candidate)==9, f'Unexpected page count: {len(candidate)}'
          assert quote in text, 'Card quotation not found in the compiled PDF'
          for phrase in ['Fixed-Scout rendezvous equivalence','Witness-filtered eventual rendezvous','target-free','Not guaranteed']:
              assert phrase.lower() in text.lower(), phrase
          dest=root/'docs'/pub_id
          archive=root/pub_id
          dest.mkdir(parents=True,exist_ok=True)
          archive.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(build/'source.pdf',dest/pdf_name)
          shutil.copyfile(build/'source.pdf',archive/pdf_name)
          shutil.copyfile(build/'source.tex',dest/'source.tex')
          shutil.copyfile(build/'ledger.pdf',dest/'ATLAS_Two_Armies_of_One_0_2_Repair_Ledger.pdf')
          shutil.copyfile(build/'ledger.tex',dest/'ATLAS_Two_Armies_of_One_0_2_Repair_Ledger.tex')
          manifest={
            'title':'Two Armies of One: Certified Scout–Probe Rendezvous in Proof Search',
            'version':'0.2','status':'ATLAS-repaired preliminary release',
            'pages':len(candidate),
            'pdf_sha256':hashlib.sha256((dest/pdf_name).read_bytes()).hexdigest(),
            'tex_sha256':hashlib.sha256((dest/'source.tex').read_bytes()).hexdigest(),
            'formal_machine_checked':False,
            'no_claim_of_speedup':True,
          }
          (dest/'publication_manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          with zipfile.ZipFile(dest/pkg_name,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for name,original in [
                (pdf_name,dest/pdf_name),('source.tex',dest/'source.tex'),
                ('ATLAS_Two_Armies_of_One_0_2_Repair_Ledger.pdf',dest/'ATLAS_Two_Armies_of_One_0_2_Repair_Ledger.pdf'),
                ('ATLAS_Two_Armies_of_One_0_2_Repair_Ledger.tex',dest/'ATLAS_Two_Armies_of_One_0_2_Repair_Ledger.tex'),
                ('publication_manifest.json',dest/'publication_manifest.json')]:
                  z.write(original,arcname=name)

          catalog=root/'scripts/publications.json'
          data=json.loads(catalog.read_text(encoding='utf-8'))
          old=[x for x in data['items'] if x.get('id')!=pub_id]
          minimum=min((x['order'] for x in old if isinstance(x.get('order'),(int,float))),default=0)
          item={
            'id':pub_id, 'href':pub_id+'/',
            'title':'Two Armies of One: Certified Scout–Probe Rendezvous in Proof Search',
            'kind':'Research note','subject':'cs.LO_Logic_in_Computer_Science',
            'authors':'Brian Tenneson (research idea); ChatGPT (mathematical exposition and ATLAS-style repair)',
            'pdf':pub_id+'/'+pdf_name,
            'archive_path':pub_id+'/'+pdf_name,
            'source':pub_id+'/source.html',
            'source_file':pub_id+'/source.tex',
            'source_package':pub_id+'/'+pkg_name,
            'card_text':(
              'Exactly two search agents: a backward Scout carries checked conditional routes '
              'toward a target, while a forward Probe carries proofs from a frozen hypothesis bank. '
              'The note proves sound certificate composition and conditional eventual rendezvous '
              'under fair, exhaustive search; it distinguishes proper proof cuts from genuinely '
              'useful early meetings, which are not guaranteed.'
            ),
            'quote':quote,'quote_page':2,
            'quote_attribution':'Two Armies of One, ATLAS-repaired v0.2 · p. 2',
            'quote_also_on_card':True,
            'status':(
              'PRELIMINARY RELEASE — ATLAS-repaired v0.2 · 26 October 2026. '
              'Paper-level mathematical audit; not formally machine-checked. '
              'No guaranteed early meeting, speedup, or running two-agent implementation is claimed.'
            ),
            'classification_note':(
              'Version 0.2 · 26 October 2026 · 9-page ATLAS-repaired working mathematical paper. '
              'A separate repair ledger accompanies the source package. '
              'Conditional theorems have explicit fairness, persistence, and certificate-compatibility hypotheses.'
            ),
            'publication_date':'26 October 2026',
            'sha256':manifest['pdf_sha256'],
            'pages':len(candidate),'order':minimum-10
          }
          data['items']=[item]+old
          catalog.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          python scripts/build_publications_106.py

          python - <<'PY'
          from pathlib import Path
          import json,re,sys
          sys.path.insert(0,'scripts')
          from build_publications import card, SUBJECTS
          root=Path('.')
          data=json.loads((root/'scripts/publications.json').read_text(encoding='utf-8'))
          pub_id='cs.LO_Logic_in_Computer_Science/two_armies_of_one_scout_probe_rendezvous_0_2'
          assert data['items'][0]['id']==pub_id
          item=dict(data['items'][0])
          code=item['subject'].split('_')[0]
          item['category']=code+' — '+SUBJECTS[code]
          block=card(item)
          for path in [root/'docs/index.html',root/'docs/cs.LO_Logic_in_Computer_Science/index.html']:
              original=path.read_text(encoding='utf-8')
              marker='<div class="grid" id="grid">'
              assert original.count(marker)==1
              if 'data-title="'+item['title']+'"' not in original:
                  original=original.replace(marker,marker+block,1)
              count=len(re.findall(r'<article class="card"',original))
              original,n=re.subn(r'(<p id="count" role="status">)\d+ publications(</p>)',
                                   lambda m:m.group(1)+str(count)+' publications'+m.group(2),
                                   original,count=1)
              assert n==1
              path.write_text(original,encoding='utf-8')
              assert original.index(block)<original.index('</article>')+10
          sitemap=root/'docs/sitemap.xml'
          xml=sitemap.read_text(encoding='utf-8')
          line='<url><loc>https://btenneson.github.io/pub/'+pub_id+'/</loc></url>'
          if line not in xml:
              xml=xml.replace('  <url><loc>https://btenneson.github.io/pub/archive/</loc></url>',
                              '  <url><loc>https://btenneson.github.io/pub/archive/</loc></url>\n  '+line,1)
              sitemap.write_text(xml,encoding='utf-8')
          search=json.loads((root/'docs/search-index.json').read_text())
          assert search['items'][0]['id']==pub_id
          assert (root/'docs'/pub_id/'index.html').is_file()
          assert (root/'docs'/pub_id/'source.html').is_file()
          assert (root/'docs'/pub_id/'source.tex').is_file()
          assert (root/'docs'/pub_id/'Two_Armies_of_One_Scout_Probe_Rendezvous_0_2_ATLAS_Repaired.pdf').is_file()
          print('New publication is card 1, search-index entry 1, PDF verified')
          PY

          python scripts/audit_subject_catalog_106.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs scripts/publications.json cs.LO_Logic_in_Computer_Science/two_armies_of_one_scout_probe_rendezvous_0_2
          git commit -m "Publish Two Armies of One ATLAS-repaired v0.2 as slot 1 [skip ci]"
          git push
