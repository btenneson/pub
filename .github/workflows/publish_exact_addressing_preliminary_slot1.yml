name: Publish Exact Addressing Preliminary Release — slot 1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_exact_addressing_preliminary_slot1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalog PDF dependency
        run: python -m pip install pymupdf==1.26.4
      - name: Build and audit publication library
        run: |
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py
      - name: Commit generated reader and slot-1 card
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Exact Addressing preliminary 3.3.1 in slot 1 [skip ci]'
            git push origin HEAD:main
          fi
