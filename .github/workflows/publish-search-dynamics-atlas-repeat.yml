name: Publish audited Search Dynamics parts I and II
on:
  push:
    branches: [main]
    paths:
      - '.build/search-dynamics-atlas-repeat/**.tex'
      - '.build/search-dynamics-atlas-repeat/publish.py'
      - '.github/workflows/publish-search-dynamics-atlas-repeat.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: search-dynamics-atlas-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install compilation and rendering tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-pictures lmodern poppler-utils
      - name: Build both PDFs and static readers; verify sources and links
        run: python3 .build/search-dynamics-atlas-repeat/publish.py
      - name: Publish validated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs
          if [ -f scripts/publications.json ]; then git add scripts/publications.json; fi
          git add -f .build/search-dynamics-atlas-repeat/publication-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish audited Search Dynamics parts I and II with static readers in slot 1'
          git pull --rebase origin main
          git push origin HEAD:main
