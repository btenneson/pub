name: Publish Personal Formal-Discovery Conjecture in slot 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_personal_formal_discovery_conjecture_slot1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build audited source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern zip >/dev/null
          python -m pip install -q pymupdf==1.26.4

          BUILD='.build/personal_formal_discovery_conjecture'
          STAGE='incoming_publications/personal_formal_discovery_conjecture_final_audited'
          mkdir -p "$BUILD"
          cp "$STAGE/source.tex" "$BUILD/source.tex"
          test "$(sha256sum "$BUILD/source.tex" | awk '{print $1}')" = "ad6790614d70bcaedd31c5440480a0fe0c5d7065f0276229558e9d18a65f4c35"

          cd "$BUILD"
          for i in 1 2 3; do pdflatex -interaction=nonstopmode -halt-on-error source.tex >/dev/null; done
          cd ../..

          python - <<'PY'
          from pathlib import Path
          import fitz
          p=Path('.build/personal_formal_discovery_conjecture/source.pdf')
          d=fitz.open(p)
          assert len(d)==4, len(d)
          text=' '.join(page.get_text() for page in d)
          for s in [
              'A Personal Formal-Discovery Conjecture and Its Settlement',
              'Decision-Region Characterization',
              'strict adaptive improvement',
              'Personal Formal-Discovery Conjecture is settled positively'
          ]:
              assert s in text, s
          PY

          PUB='cs.LO_Logic_in_Computer_Science/personal_formal_discovery_conjecture_and_its_settlement'
          PDF='personal_formal_discovery_conjecture_final_audited.pdf'
          ZIP='personal_formal_discovery_conjecture_final_audited_source_and_pdf.zip'
          mkdir -p "$PUB" "docs/$PUB"
          cp "$BUILD/source.pdf" "$PUB/$PDF"
          cp "$BUILD/source.pdf" "docs/$PUB/$PDF"
          cp "$BUILD/source.tex" "docs/$PUB/source.tex"
          cp "$BUILD/source.pdf" "$BUILD/$PDF"
          (cd "$BUILD" && zip -X -q "$ZIP" source.tex "$PDF")
          cp "$BUILD/$ZIP" "docs/$PUB/$ZIP"

      - name: Put publication in slot 1 and rebuild catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz, hashlib, json, re
          root=Path('.')
          pub_id='cs.LO_Logic_in_Computer_Science/personal_formal_discovery_conjecture_and_its_settlement'
          pdf_name='personal_formal_discovery_conjecture_final_audited.pdf'
          zip_name='personal_formal_discovery_conjecture_final_audited_source_and_pdf.zip'
          pdf=root/pub_id/pdf_name
          source=root/'docs'/pub_id/'source.tex'
          source_package=root/'docs'/pub_id/zip_name
          pages=len(fitz.open(pdf))
          assert pages == 4
          digest=hashlib.sha256(pdf.read_bytes()).hexdigest()
          source_digest=hashlib.sha256(source.read_bytes()).hexdigest()
          zip_digest=hashlib.sha256(source_package.read_bytes()).hexdigest()

          title='A Personal Formal-Discovery Conjecture and Its Settlement'
          card_text=('A settlement experiment was carried out by ChatGPT operating under a Tenneson AMLD/Board protocol '
                     '(as in chess board), with role-separated Prover, Refuter, Dependence, Independence, and '
                     'Contradiction channels and Hilbert/Board search controls. It was not, in this instance, '
                     'executed by a separate external ATP engine.')
          status=('The CONJECTURE that was settled by being PROVED was the following:\n'
                  '“I will make a formalized discovery pertaining to the necessary and sufficient conditions under '
                  'which a Board-controlled AMLD can use certified pre-outcome self-state to identify a decision '
                  'region where switching from its default verifier-safe proof policy to an alternate safe policy '
                  'strictly lowers expected verified settlement cost without sacrificing soundness or eventual '
                  'complete fallback.”')
          quote=('I will make a formalized discovery pertaining to the necessary and sufficient conditions under '
                 'which a Board-controlled AMLD can use certified pre-outcome self-state to identify a decision '
                 'region where switching from its default verifier-safe proof policy to an alternate safe policy '
                 'strictly lowers expected verified settlement cost without sacrificing soundness or eventual '
                 'complete fallback.')

          cat=root/'scripts/publications.json'
          data=json.loads(cat.read_text())
          existed=any(x.get('id')==pub_id for x in data['items'])
          old=[x for x in data['items'] if x.get('id')!=pub_id]
          orders=[x.get('order') for x in old if isinstance(x.get('order'),(int,float))]
          order=min(orders)-10 if orders else -10
          item={
            'title':title,
            'kind':'Formal settlement note',
            'quote':quote,
            'quote_page':1,
            'card_text':card_text,
            'status':status,
            'subject':'cs.LO_Logic_in_Computer_Science',
            'id':pub_id,
            'href':pub_id+'/',
            'pdf':pub_id+'/'+pdf_name,
            'archive_path':pub_id+'/'+pdf_name,
            'sha256':digest,
            'sha256_tex':source_digest,
            'sha256_source_package':zip_digest,
            'pages':pages,
            'order':order,
            'source':pub_id+'/source.html',
            'source_file':pub_id+'/source.tex',
            'source_package':pub_id+'/'+zip_name,
            'authors':'Brian Tenneson',
            'classification_note':(
              'Formal settlement note, September 27, 2026. Records the Personal Formal-Discovery Conjecture '
              'and the Decision-Region Characterization that settles its adaptive-cost component within the '
              'stated verifier-safe AMLD/Board framework. Subject classification: cs.LO — Logic in Computer Science.'
            )
          }
          data['items']=[item]+old
          cat.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          search=json.loads((root/'docs/search-index.json').read_text())
          expected=int(search['count']) if existed else int(search['count'])+1
          wrapper=root/'scripts/build_publications_106.py'
          w=wrapper.read_text()
          w,n1=re.subn(r'if len\(expanded\["items"\]\) != \d+:',
                       f'if len(expanded["items"]) != {expected}:',w,count=1)
          w,n2=re.subn(r'Expected \d+ cards after restoration',
                       f'Expected {expected} cards after restoration',w,count=1)
          assert n1==1 and n2==1, (n1,n2)
          wrapper.write_text(w)
          (root/'.build/personal_formal_discovery_conjecture/expected.txt').write_text(str(expected))
          print('slot order',order,'expected',expected)
          PY

          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py

          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          pub_id='cs.LO_Logic_in_Computer_Science/personal_formal_discovery_conjecture_and_its_settlement'
          s=json.loads((root/'docs/search-index.json').read_text())
          expected=int((root/'.build/personal_formal_discovery_conjecture/expected.txt').read_text())
          assert s['count']==expected
          assert s['items'][0]['id']==pub_id
          assert s['items'][0]['pages']==4
          page=(root/'docs'/pub_id/'index.html').read_text()
          for phrase in [
            'A Personal Formal-Discovery Conjecture and Its Settlement',
            'A settlement experiment was carried out by ChatGPT operating under a Tenneson AMLD/Board protocol',
            'The CONJECTURE that was settled by being PROVED was the following:',
            'switching from its default verifier-safe proof policy to an alternate safe policy'
          ]:
              assert phrase in page, phrase
          for f in [
            f'docs/{pub_id}/index.html',
            f'docs/{pub_id}/source.html',
            f'docs/{pub_id}/source.tex',
            f'docs/{pub_id}/personal_formal_discovery_conjecture_final_audited.pdf',
            f'docs/{pub_id}/personal_formal_discovery_conjecture_final_audited_source_and_pdf.zip'
          ]:
              assert (root/f).is_file(), f
          PY

          rm -rf incoming_publications/personal_formal_discovery_conjecture_final_audited .build/personal_formal_discovery_conjecture

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m 'Publish Personal Formal-Discovery Conjecture as card 1 [skip ci]'
          git push
