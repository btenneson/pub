name: Fix quotation finalizer regex

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-quote-finalize-regex.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch fixed-width sentence split and remove this helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/quote-all-authored-finalize.yml')
          s=p.read_text(encoding='utf-8')
          old="parts=re.split(r'(?<=[.!?][”\\\"]?)\\s+(?=[A-Z“\\\"(])',p)"
          new="parts=re.split(r'(?<=[.!?])(?:[”\\\"])?\\s+(?=[A-Z“\\\"(])',p)"
          if old not in s:
              raise SystemExit('sentence-split regex marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-quote-finalize-regex.yml
          git add -A
          git commit -m 'Fix authored quotation sentence splitting'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
