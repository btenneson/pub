name: Compile compass theorems and physics-density limits v0.1

on:
  push:
    paths:
      - '.github/workflows/compile_compass_theorems_physics_density_v0_1.yml'
      - 'cs.LO_Logic_in_Computer_Science/Proof_Compass_Theory/Compass_Theorems_and_Physics_Density_Limits_v0_1.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended cm-super

      - name: Compile compass theorem note
        run: |
          ROOT='cs.LO_Logic_in_Computer_Science/Proof_Compass_Theory'
          TEX='Compass_Theorems_and_Physics_Density_Limits_v0_1.tex'
          PDF='Compass_Theorems_and_Physics_Density_Limits_v0_1.pdf'
          cd "$ROOT"
          pdflatex -interaction=nonstopmode -halt-on-error "$TEX"
          pdflatex -interaction=nonstopmode -halt-on-error "$TEX"
          pdflatex -interaction=nonstopmode -halt-on-error "$TEX"
          test -s "$PDF"

      - name: Upload compiled PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compass_Theorems_and_Physics_Density_Limits_v0_1
          path: cs.LO_Logic_in_Computer_Science/Proof_Compass_Theory/Compass_Theorems_and_Physics_Density_Limits_v0_1.pdf

      - name: Commit compiled PDF
        run: |
          ROOT='cs.LO_Logic_in_Computer_Science/Proof_Compass_Theory'
          PDF='Compass_Theorems_and_Physics_Density_Limits_v0_1.pdf'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/$PDF"
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'Compile compass theorem note PDF v0.1'
            git push
          fi
