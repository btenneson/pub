name: Publish corrected verifier certificate

on:
  push:
    paths:
      - '.publish/verifier_certificate/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble corrected PDF
        shell: bash
        run: |
          cat .publish/verifier_certificate/part*.b64 | base64 -d > /tmp/Verifier_Certificate_001.pdf
          test "$(wc -c < /tmp/Verifier_Certificate_001.pdf)" -eq 63919
          test "$(git hash-object /tmp/Verifier_Certificate_001.pdf)" = "4cf15cceaf9bd94a1ce898af9f7e651fd6e22238"
          mkdir -p cs.LO_Logic_in_Computer_Science
          mkdir -p docs/papers/verifier_certificate_001
          cp /tmp/Verifier_Certificate_001.pdf cs.LO_Logic_in_Computer_Science/Verifier_Certificate_001.pdf
          cp /tmp/Verifier_Certificate_001.pdf docs/papers/verifier_certificate_001/Verifier_Certificate_001.pdf
          rm -rf .publish/verifier_certificate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish corrected Verifier Certificate 001 [skip ci]"
          git push
