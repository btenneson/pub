name: Publish Depths of Induction Version 48 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_depths_v48_once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-science cm-super zstd
          python -m pip install --disable-pip-version-check pymupdf==1.26.4 gdown

      - name: Retrieve and verify exact Version 48 source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/depths_v48
          gdown '1XJCsILkdEuw-bVt4Sq8DUvyq22ieoC6I' -O /tmp/depths_v48/payload.tar.zst
          echo '0fffe34f6ff14aa1ff3b9ff675c7ba60a80ec0a8586615bf2953d1f6c7dbe96e  /tmp/depths_v48/payload.tar.zst' | sha256sum -c -
          tar --zstd -xf /tmp/depths_v48/payload.tar.zst -C /tmp/depths_v48
          echo '44f814352f72534405bd86db4c8ffc3c11862cc97aa000f0cdfd94b3a7ce637e  /tmp/depths_v48/Depths_of_Induction_Version_48.tex' | sha256sum -c -
          echo 'e21c01dddb92f7e0ad9997bd4fa7c6a38693be1926c1864d779fbd510ac216f6  /tmp/depths_v48/Depths_V46_2_Atlas_Corrected_Core.pdf' | sha256sum -c -

      - name: Compile Version 48 from exact source
        shell: bash
        run: |
          set -euo pipefail
          DEST='docs/cs.LO_Logic_in_Computer_Science/depths_of_induction_v48'
          JOB='Depths_of_Induction_Version_48'
          mkdir -p "$DEST"
          cp /tmp/depths_v48/Depths_of_Induction_Version_48.tex "$DEST/source.tex"
          cp /tmp/depths_v48/Depths_V46_2_Atlas_Corrected_Core.pdf "$DEST/Depths_V46_2_Atlas_Corrected_Core.pdf"
          cd "$DEST"
          pdflatex -interaction=nonstopmode -halt-on-error -jobname="$JOB" source.tex
          pdflatex -interaction=nonstopmode -halt-on-error -jobname="$JOB" source.tex
          test -s "$JOB.pdf"
          rm -f "$JOB.aux" "$JOB.log" "$JOB.out" "$JOB.toc"

      - name: Verify the compiled manuscript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz, hashlib, re, unicodedata

          pdf = Path('docs/cs.LO_Logic_in_Computer_Science/depths_of_induction_v48/Depths_of_Induction_Version_48.pdf')
          doc = fitz.open(pdf)
          assert len(doc) == 165, len(doc)
          target_ratio = 612.0 / 792.0
          for i, page in enumerate(doc):
              r = page.rect.width / page.rect.height
              assert abs(r - target_ratio) < 1e-5, (i + 1, page.rect)

          def norm(s):
              return re.sub(r'\s+', ' ', unicodedata.normalize('NFKC', s or '')).strip().replace('- ', '')

          texts = [norm(p.get_text()) for p in doc]
          joined = '\n\f\n'.join(texts).encode('utf-8')
          digest = hashlib.sha256(joined).hexdigest()
          assert digest == '821d44f4e66b01e5ebda75880ca1a9a64e9224b1a6341c0345f86a70301af354', digest

          assert 'Version 48 – Consolidated Post-Audit Edition' in texts[0]
          quote = 'An automated theorem prover, abbreviated ATP, over Y is a SIC over Y intended to enumerate theorems or search for designated targets.'
          assert norm(quote) in texts[17]
          assert 'Version 48 Closing Synthesis' in texts[164]
          print('PASS: exact Version 48 content signature, 165 Letter pages, ATP/SIC quote, and closing synthesis verified.')
          PY

      - name: Add cornerstone publication to canonical catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          import fitz

          catalog = Path('scripts/publications.json')
          data = json.loads(catalog.read_text())
          pub_id = 'cs.LO_Logic_in_Computer_Science/depths_of_induction_v48'
          pdf_rel = pub_id + '/Depths_of_Induction_Version_48.pdf'
          pdf = Path('docs') / pdf_rel
          doc = fitz.open(pdf)

          item = {
              'title': 'Depths of Induction: ML-Guided Proof Search, Cooperative AMLDs, and Formalized Self-Awareness — Version 48',
              'kind': 'Cornerstone work',
              'quote': 'An automated theorem prover, abbreviated ATP, over Y is a SIC over Y intended to enumerate theorems or search for designated targets.',
              'quote_page': 18,
              'card_text': 'Cornerstone SIC/ATP/AMLD work consolidating the corrected formal-system core with ML-guided proof-search allocation, a verifier-governed cooperative AMLD architecture and shared BANK, four distinct forms of induction, proof-complexity machinery, simulations, and syntactic/proof-theoretic formal self-awareness. Version 48 is the authoritative successor to Versions 47 and 46.3 and provides the foundational SIC layer beneath the ATP and AMLD developments.',
              'subject': 'cs.LO_Logic_in_Computer_Science',
              'id': pub_id,
              'href': pub_id + '/',
              'pdf': pdf_rel,
              'archive_path': 'docs/' + pdf_rel,
              'sha256': hashlib.sha256(pdf.read_bytes()).hexdigest(),
              'pages': len(doc),
              'order': -5,
              'source': pub_id + '/source.html',
              'authors': 'Brian Tenneson',
              'source_file': pub_id + '/source.tex',
              'classification_note': 'Cornerstone SIC/ATP/AMLD work. Version 48 — Consolidated Post-Audit Edition, September 17, 2026. Authoritative successor to Versions 47 and 46.3. Formal self-awareness is treated syntactically and proof-theoretically, not phenomenologically. Subject classification: cs.LO — Logic in Computer Science.'
          }

          old = [x for x in data['items'] if x.get('id') != pub_id]
          data['items'] = [item] + old
          catalog.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          builder = Path('scripts/build_publications_106.py')
          text = builder.read_text()
          text = text.replace('if len(expanded["items"]) != 114:', 'if len(expanded["items"]) != 116:')
          text = text.replace('if len(expanded["items"]) != 115:', 'if len(expanded["items"]) != 116:')
          text = re.sub(r'Expected \d+ cards after restoration', 'Expected 116 cards after restoration', text)
          if 'if len(expanded["items"]) != 116:' not in text:
              raise SystemExit('Could not update publication-count guard to 116')
          builder.write_text(text)
          PY

      - name: Rebuild and audit publication site
        run: |
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py

      - name: Verify cornerstone card, source, reader, and ordering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          pub_id = 'cs.LO_Logic_in_Computer_Science/depths_of_induction_v48'
          index = json.loads(Path('docs/search-index.json').read_text())
          assert index['count'] == 116, index['count']
          assert index['items'][0]['id'] == pub_id
          x = next(i for i in index['items'] if i['id'] == pub_id)
          assert x['kind'] == 'Cornerstone work'
          assert x['pages'] == 165
          assert 'authoritative successor' in x.get('classification_note','').lower()

          root_html = Path('docs/index.html').read_text()
          subject_html = Path('docs/cs.LO_Logic_in_Computer_Science/index.html').read_text()
          assert root_html.find(pub_id) >= 0
          assert subject_html.find(pub_id) >= 0

          base = Path('docs') / pub_id
          assert (base / 'Depths_of_Induction_Version_48.pdf').is_file()
          assert (base / 'source.tex').is_file()
          assert (base / 'Depths_V46_2_Atlas_Corrected_Core.pdf').is_file()
          assert (base / 'source.html').is_file()
          reader = (base / 'index.html').read_text()
          assert '/pub/pdf-reader.html?file=' in reader
          assert 'Cornerstone' in root_html
          print('PASS: Version 48 is card 1, cornerstone-labelled, source-complete, and reader-backed.')
          PY

      - name: Remove one-time workflow and commit publication
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/publish_depths_v48_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Publish Depths of Induction Version 48 as cornerstone [skip ci]'
          git push
