name: Publish Omnicartographer synthesis in slot 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_omnicartographer_slot1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and PDF audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install pymupdf==1.26.4

      - name: Reconstruct and compile the uploaded source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/omnicartographer
          base64 -d incoming_publications/omnicartographer/source.tex.gz.b64 | gzip -d > .build/omnicartographer/source.tex
          test "$(wc -c < .build/omnicartographer/source.tex)" -eq 93456
          test "$(sha256sum .build/omnicartographer/source.tex | awk '{print $1}')" = "18803583942431735b79fb7325401484841d626e9b91e79b9ce0b22c361e6030"
          grep -q '\\end{document}' .build/omnicartographer/source.tex
          cd .build/omnicartographer
          for i in 1 2 3 4; do
            pdflatex -interaction=nonstopmode -halt-on-error source.tex
          done
          test -s source.pdf

      - name: Stage PDF and source under cs.LO
        shell: bash
        run: |
          set -euo pipefail
          PUB='cs.LO_Logic_in_Computer_Science/amlds_cartographers_pioneers_omnicartographers'
          mkdir -p "$PUB" "docs/$PUB"
          cp .build/omnicartographer/source.pdf "$PUB/AMLD_Omnicartographer_Post_Audit_Consolidated_Synthesis_004.pdf"
          cp .build/omnicartographer/source.tex "docs/$PUB/source.tex"

      - name: Verify PDF and promote publication to slot 1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, fitz

          root = Path('.')
          pub_id = 'cs.LO_Logic_in_Computer_Science/amlds_cartographers_pioneers_omnicartographers'
          pdf_name = 'AMLD_Omnicartographer_Post_Audit_Consolidated_Synthesis_004.pdf'
          archive = root / pub_id / pdf_name
          source = root / 'docs' / pub_id / 'source.tex'
          assert archive.is_file() and archive.stat().st_size > 0
          assert source.is_file() and source.stat().st_size == 93456

          doc = fitz.open(archive)
          pages = len(doc)
          assert pages == 37, f'Expected 37 pages, got {pages}'
          quote = 'The target is a goal for search, not a truth value the system is entitled to force.'
          page1 = re.sub(r'\s+', ' ', doc[0].get_text()).strip()
          assert quote in page1, 'Card quote not found on PDF page 1'
          assert all(doc[i].get_text().strip() for i in range(pages)), 'Unreadable or empty PDF page'
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()

          card_text = 'The proposed novelty is not multi-agent theorem proving, shared proof state, verifier feedback, or proof-progress estimation individually; it is their organization into a typed five-settlement geometry with conservative cross-channel pioneering, dynamically recomputed settlement horizons, resolution-indexed cartographic guidance, and verifier-sovereign one-step oracle induction.'

          cat = root / 'scripts/publications.json'
          data = json.loads(cat.read_text())
          old = [x for x in data['items'] if x.get('id') != pub_id]
          for x in old:
              if isinstance(x.get('order'), int):
                  x['order'] += 1

          item = {
              'title': 'AMLDs as Cartographers, Pioneers, and Omnicartographers',
              'kind': 'Core paper',
              'quote': quote,
              'quote_page': 1,
              'card_text': card_text,
              'subject': 'cs.LO_Logic_in_Computer_Science',
              'id': pub_id,
              'href': pub_id + '/',
              'pdf': pub_id + '/' + pdf_name,
              'archive_path': pub_id + '/' + pdf_name,
              'sha256': digest,
              'pages': pages,
              'order': -2,
              'source': pub_id + '/source.html',
              'authors': 'Brian Tenneson',
              'source_file': pub_id + '/source.tex',
              'classification_note': 'Post-Audit Consolidated Synthesis 004. Subject classification: cs.LO — Logic in Computer Science.'
          }
          data['items'] = [item] + old
          cat.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          wrapper = root / 'scripts/build_publications_106.py'
          s = wrapper.read_text()
          s2 = re.sub(r'if len\(expanded\["items"\]\) != \d+:', 'if len(expanded["items"]) != 112:', s)
          assert s2 != s or '!= 112' in s, 'Could not update expected publication count'
          wrapper.write_text(s2)
          PY

      - name: Rebuild catalog and audit every publication reader
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import json, fitz

          docs = Path('docs')
          pub_id = 'cs.LO_Logic_in_Computer_Science/amlds_cartographers_pioneers_omnicartographers'
          exact_card_text = 'The proposed novelty is not multi-agent theorem proving, shared proof state, verifier feedback, or proof-progress estimation individually; it is their organization into a typed five-settlement geometry with conservative cross-channel pioneering, dynamically recomputed settlement horizons, resolution-indexed cartographic guidance, and verifier-sovereign one-step oracle induction.'

          search = json.loads((docs / 'search-index.json').read_text())
          assert search['count'] == 112, search['count']
          assert search['items'][0]['id'] == pub_id, 'New publication is not slot #1'
          assert search['items'][0]['card_text'] == exact_card_text

          index = (docs / 'index.html').read_text()
          first_card = index.split('<article class="card"', 1)[1].split('</article>', 1)[0]
          assert 'AMLDs as Cartographers, Pioneers, and Omnicartographers' in first_card
          assert exact_card_text in first_card

          reader_html = (docs / 'pdf-reader.html').read_text()
          reader_js = (docs / 'pdf-reader.js').read_text()
          assert '.stage canvas{display:block;max-width:100%;height:auto' in reader_html
          assert 'const viewport=page.getViewport({scale})' in reader_js
          assert 'canvas.width=Math.floor(viewport.width*ratio)' in reader_js
          assert 'canvas.height=Math.floor(viewport.height*ratio)' in reader_js
          assert "canvas.style.height='auto'" in reader_js

          ratios = []
          checked = 0
          for item in search['items']:
              pdf_rel = item.get('pdf')
              if not pdf_rel:
                  continue
              pdf_path = docs / pdf_rel
              assert pdf_path.is_file(), pdf_path
              doc = fitz.open(pdf_path)
              assert len(doc) > 0
              for page in doc:
                  r = page.rect
                  assert r.width > 0 and r.height > 0
                  ratios.append(r.width / r.height)
              pub_reader = docs / item['href'] / 'index.html'
              html = pub_reader.read_text()
              pdf_url = '/pub/' + pdf_rel
              expected = '/pub/pdf-reader.html?file=' + quote(pdf_url, safe='')
              assert expected in html, (item['id'], expected)
              checked += 1

          assert checked > 0
          print(f'PASS: {search["count"]} cards; {checked} PDF-backed readers resolve through the shared PDF.js reader.')
          print(f'PASS: native PDF page aspect ratios preserved by viewport rendering; observed width/height range {min(ratios):.4f}..{max(ratios):.4f}.')
          PY

      - name: Remove one-time staging payload
        run: rm -rf incoming_publications/omnicartographer

      - name: Commit tested publication and generated library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish Omnicartographer synthesis as card 1 [skip ci]'
            git push
          fi
