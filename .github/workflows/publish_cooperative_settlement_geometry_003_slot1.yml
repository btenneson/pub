name: Publish Cooperative Settlement Geometry 003 in slot 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_cooperative_settlement_geometry_003_slot1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and PDF verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install pymupdf==1.26.4

      - name: Compile source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/cooperative_settlement_geometry_003
          cp incoming_publications/cooperative_settlement_geometry_003/source.tex .build/cooperative_settlement_geometry_003/source.tex
          test "$(wc -c < .build/cooperative_settlement_geometry_003/source.tex)" -ge 70000
          grep -q '\\end{document}' .build/cooperative_settlement_geometry_003/source.tex
          cd .build/cooperative_settlement_geometry_003
          for i in 1 2 3 4; do
            pdflatex -interaction=nonstopmode -halt-on-error source.tex
          done
          test -s source.pdf

      - name: Verify paper and stage publication files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz, re
          pdf = Path('.build/cooperative_settlement_geometry_003/source.pdf')
          doc = fitz.open(pdf)
          assert len(doc) == 28, f'Expected 28 pages, got {len(doc)}'
          p1 = re.sub(r'\s+', ' ', doc[0].get_text()).strip()
          assert 'Cooperative Settlement Geometry' in p1
          quote = 'The resulting object is not naturally described as two independent proof searches. It is a coupled state-space process.'
          assert quote in p1, 'Card quote not found on page 1'
          assert all(doc[i].get_text().strip() for i in range(len(doc))), 'Unreadable or empty PDF page'
          print('PASS: 28-page Cooperative Settlement Geometry 003 compiled; title and quote verified.')
          PY
          PUB='cs.LO_Logic_in_Computer_Science/cooperative_settlement_geometry_003'
          DOCS="docs/$PUB"
          mkdir -p "$PUB" "$DOCS"
          cp .build/cooperative_settlement_geometry_003/source.pdf "$PUB/Cooperative_Settlement_Geometry_003.pdf"
          cp .build/cooperative_settlement_geometry_003/source.pdf "$DOCS/Cooperative_Settlement_Geometry_003.pdf"
          cp .build/cooperative_settlement_geometry_003/source.tex "$DOCS/source.tex"

      - name: Promote publication to card slot 1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, fitz

          root = Path('.')
          pub_id = 'cs.LO_Logic_in_Computer_Science/cooperative_settlement_geometry_003'
          pdf_name = 'Cooperative_Settlement_Geometry_003.pdf'
          archive = root / pub_id / pdf_name
          source = root / 'docs' / pub_id / 'source.tex'
          doc_pdf = root / 'docs' / pub_id / pdf_name
          assert archive.is_file() and archive.stat().st_size > 0
          assert doc_pdf.is_file() and doc_pdf.stat().st_size > 0
          assert source.is_file() and source.stat().st_size >= 70000
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == hashlib.sha256(doc_pdf.read_bytes()).hexdigest()

          doc = fitz.open(archive)
          pages = len(doc)
          assert pages == 28
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          quote = 'The resulting object is not naturally described as two independent proof searches. It is a coupled state-space process.'
          card_text = (
              'This paper grew from recognizing that conjecture-settling agents are not merely parallel theorem provers: '
              'the two or five conjecture-settling agents—akin to Pac-Men—move through one generalized board game under '
              'special legal rules. Once that rule-governed state space is made explicit, shared BANK deposits become '
              'geometric interventions, settlement horizons become directed distances, and certified lemmas can be measured '
              'by how much they shorten another agent’s route. The resulting defect decomposition separates intrinsic '
              'shortest-path cost from accumulated local geodesic defect and exposes a boundary between exact local progress '
              'and knowing that the final breakthrough has occurred.'
          )

          cat = root / 'scripts/publications.json'
          data = json.loads(cat.read_text())
          old = [x for x in data['items'] if x.get('id') != pub_id]
          item = {
              'title': 'Cooperative Settlement Geometry — Prover–Refuter Lemma Exchange, BANK Geodesics, Discrete Derivatives, and the Noncomputability of the Last Breakthrough',
              'kind': 'Core paper',
              'quote': quote,
              'quote_page': 1,
              'card_text': card_text,
              'subject': 'cs.LO_Logic_in_Computer_Science',
              'id': pub_id,
              'href': pub_id + '/',
              'pdf': pub_id + '/' + pdf_name,
              'archive_path': pub_id + '/' + pdf_name,
              'sha256': digest,
              'pages': pages,
              'order': -130,
              'source': pub_id + '/source.html',
              'authors': 'Brian Tenneson',
              'source_file': pub_id + '/source.tex',
              'classification_note': (
                  'Research Draft 003, September 22, 2026. Cooperative prover/refuter and multi-role AMLD settlement geometry '
                  'with shared BANK interventions, directed settlement horizons, discrete derivatives, Bellman defect '
                  'decomposition, cross-agent assistance, and the noncomputability boundary for the last strict breakthrough. '
                  'Subject classification: cs.LO — Logic in Computer Science.'
              )
          }
          data['items'] = [item] + old
          cat.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          search = json.loads((root / 'docs/search-index.json').read_text())
          old_count = int(search['count'])
          expected = old_count + (0 if any(x.get('id') == pub_id for x in search['items']) else 1)
          (root / '.build/cooperative_settlement_geometry_003/expected_count.txt').write_text(str(expected))

          wrapper = root / 'scripts/build_publications_106.py'
          s = wrapper.read_text()
          s2, n1 = re.subn(
              r'if len\(expanded\["items"\]\) != \d+:',
              f'if len(expanded["items"]) != {expected}:',
              s,
              count=1
          )
          s2, n2 = re.subn(
              r'Expected \d+ cards after restoration',
              f'Expected {expected} cards after restoration',
              s2,
              count=1
          )
          assert n1 == 1 and n2 == 1, 'Could not update expected publication count'
          wrapper.write_text(s2)
          print(f'Catalog expected count: {expected}.')
          PY

      - name: Rebuild publication site and verify slot 1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          docs = root / 'docs'
          pub_id = 'cs.LO_Logic_in_Computer_Science/cooperative_settlement_geometry_003'
          title = 'Cooperative Settlement Geometry — Prover–Refuter Lemma Exchange, BANK Geodesics, Discrete Derivatives, and the Noncomputability of the Last Breakthrough'
          quote = 'The resulting object is not naturally described as two independent proof searches. It is a coupled state-space process.'
          required_card_phrase = 'the two or five conjecture-settling agents—akin to Pac-Men—move through one generalized board game under special legal rules.'
          expected = int((root / '.build/cooperative_settlement_geometry_003/expected_count.txt').read_text())

          search = json.loads((docs / 'search-index.json').read_text())
          assert search['count'] == expected, search['count']
          assert search['items'][0]['id'] == pub_id, 'Cooperative Settlement Geometry is not slot #1'
          assert search['items'][0]['quote'] == quote
          assert required_card_phrase in search['items'][0].get('card_text', '')

          index = (docs / 'index.html').read_text()
          first_card = index.split('<article class="card"', 1)[1].split('</article>', 1)[0]
          assert title in first_card
          assert 'Pac-Men' in first_card
          assert 'generalized board game' in first_card

          pub_docs = docs / pub_id
          assert (pub_docs / 'index.html').is_file()
          assert (pub_docs / 'source.html').is_file()
          assert (pub_docs / 'source.tex').is_file()
          assert (pub_docs / 'Cooperative_Settlement_Geometry_003.pdf').is_file()
          reader = (pub_docs / 'index.html').read_text()
          assert '/pub/pdf-reader.html?file=' in reader
          assert 'Cooperative_Settlement_Geometry_003.pdf' in reader
          assert 'Source' in reader
          print('PASS: Cooperative Settlement Geometry 003 is slot #1 with requested GBG/Pac-Man origin note, reader, PDF, and source.')
          PY

      - name: Remove one-time staging payload
        run: rm -rf incoming_publications/cooperative_settlement_geometry_003

      - name: Commit verified publication and rebuilt library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish Cooperative Settlement Geometry 003 as card 1 [skip ci]'
            git push
          fi
