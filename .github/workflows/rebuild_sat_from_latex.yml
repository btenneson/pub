name: Rebuild SAT paper from LaTeX

on:
  push:
    paths:
      - '.github/workflows/rebuild_sat_from_latex.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and PDF tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern poppler-utils

      - name: Compile and validate clean PDF
        shell: bash
        run: |
          set -euo pipefail
          cd math.AC_Commutative_Algebra
          pdflatex -interaction=nonstopmode -halt-on-error Solving_SAT_in_polynomial_time_-_Brian_Tenneson.tex
          pdflatex -interaction=nonstopmode -halt-on-error Solving_SAT_in_polynomial_time_-_Brian_Tenneson.tex
          test "$(pdfinfo Solving_SAT_in_polynomial_time_-_Brian_Tenneson.pdf | awk '/^Pages:/ {print $2}')" = "2"
          pdftotext Solving_SAT_in_polynomial_time_-_Brian_Tenneson.pdf /tmp/sat.txt
          grep -F 'Input Boolean wff' /tmp/sat.txt
          grep -F 'different algorithm' /tmp/sat.txt
          grep -F 'not satisfiable' /tmp/sat.txt
          grep -F 'is satisfiable' /tmp/sat.txt

      - name: Commit rebuilt PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add math.AC_Commutative_Algebra/Solving_SAT_in_polynomial_time_-_Brian_Tenneson.pdf
          if git diff --cached --quiet; then
            echo 'PDF is already current.'
          else
            git commit -m 'Rebuild SAT paper from clean LaTeX source'
            git push
          fi
