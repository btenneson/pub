name: Publish Singleton Enumeration as a Generalized Board Game in slot 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_singleton_enumeration_gbg_slot1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and PDF verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install pymupdf==1.26.4

      - name: Compile the reviewed source
        shell: bash
        run: |
          set -euo pipefail
          BUILD='.build/singleton_enumeration_gbg'
          mkdir -p "$BUILD"
          cp incoming_publications/singleton_enumeration_as_a_generalized_board_game/source.tex "$BUILD/source.tex"
          test "$(wc -c < "$BUILD/source.tex")" -eq 40488
          test "$(sha256sum "$BUILD/source.tex" | awk '{print $1}')" = "f371138e1d5162d86afb4edaca3ea011e8355189a3d95cd133d3b567690eaf72"
          grep -q '\\end{document}' "$BUILD/source.tex"
          cd "$BUILD"
          for i in 1 2 3; do
            pdflatex -interaction=nonstopmode -halt-on-error source.tex
          done
          test -s source.pdf

      - name: Verify paper and stage publication files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz, re
          root = Path('.')
          build = root / '.build/singleton_enumeration_gbg'
          pdf = build / 'source.pdf'
          tex = build / 'source.tex'
          doc = fitz.open(pdf)
          assert len(doc) == 16, f'Expected 16 pages, got {len(doc)}'
          assert all(doc[i].get_text().strip() for i in range(len(doc))), 'Unreadable or empty PDF page'
          first = re.sub(r'\s+', ' ', doc[0].get_text()).strip()
          assert 'Singleton Enumeration as a Generalized Board Game' in first
          source = tex.read_text()
          required = [
              'Information-Constrained Bellman Gap',
              'Opaque Singleton No-Polynomial-Settlement',
              'CNF Prefix-Pruning Monotonicity',
              'Singleton GBG--Proof-Horizon--Bellman Equivalence',
              'Horizon--Execution Separation',
              'Efficient GBG Isomorphism Preserves Fair Settlement Degree',
              'Observation-constrained settlement geometry',
          ]
          for phrase in required:
              assert phrase in source, phrase
          quote = ('The central distinction developed here is between structured singleton search, '
                   'where observable local features correlate with progress toward the target, and '
                   'opaque singleton search, where no such navigational signal is available.')
          qnorm = re.sub(r'\s+', ' ', quote).strip()
          quote_page = None
          for i in range(len(doc)):
              page = re.sub(r'\s+', ' ', doc[i].get_text()).strip()
              if qnorm in page:
                  quote_page = i + 1
                  break
          assert quote_page is not None, 'Could not locate catalog quote in compiled PDF'
          (build / 'quote_page.txt').write_text(str(quote_page))
          print(f'PASS: 16-page paper compiled; six theorem statements and observation-map formalism verified; quote is on page {quote_page}.')
          PY

          PUB='cs.LO_Logic_in_Computer_Science/singleton_enumeration_as_a_generalized_board_game'
          PDF='Singleton_Enumeration_as_a_Generalized_Board_Game.pdf'
          mkdir -p "$PUB" "docs/$PUB"
          cp .build/singleton_enumeration_gbg/source.pdf "$PUB/$PDF"
          cp .build/singleton_enumeration_gbg/source.pdf "docs/$PUB/$PDF"
          cp .build/singleton_enumeration_gbg/source.tex "docs/$PUB/source.tex"

      - name: Promote publication to card slot 1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, fitz

          root = Path('.')
          pub_id = 'cs.LO_Logic_in_Computer_Science/singleton_enumeration_as_a_generalized_board_game'
          pdf_name = 'Singleton_Enumeration_as_a_Generalized_Board_Game.pdf'
          archive = root / pub_id / pdf_name
          doc_pdf = root / 'docs' / pub_id / pdf_name
          source = root / 'docs' / pub_id / 'source.tex'
          assert archive.is_file() and archive.stat().st_size > 0
          assert doc_pdf.is_file() and doc_pdf.stat().st_size > 0
          assert source.is_file() and source.stat().st_size == 40488
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'f371138e1d5162d86afb4edaca3ea011e8355189a3d95cd133d3b567690eaf72'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == hashlib.sha256(doc_pdf.read_bytes()).hexdigest()

          doc = fitz.open(archive)
          pages = len(doc)
          assert pages == 16
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          quote = ('The central distinction developed here is between structured singleton search, '
                   'where observable local features correlate with progress toward the target, and '
                   'opaque singleton search, where no such navigational signal is available.')
          quote_page = int((root / '.build/singleton_enumeration_gbg/quote_page.txt').read_text())
          card_text = (
              'Connects singleton enumeration to generalized board games, Universal Proof Horizon, '
              'password search, SAT/3-CNF constraint revelation, DATA MIND-style Ocean navigation, '
              'and fair settlement geometry. The paper introduces an observation-map formalism '
              'separating intrinsic distance from information available to the searcher, and proves '
              'six cross-domain results on observation-constrained search, opaque singleton bounds, '
              'CNF prefix pruning, horizon equivalence, search overhead, and fair-settlement invariance.'
          )

          cat = root / 'scripts/publications.json'
          data = json.loads(cat.read_text())
          already = any(x.get('id') == pub_id for x in data['items'])
          old = [x for x in data['items'] if x.get('id') != pub_id]
          item = {
              'title': 'Singleton Enumeration as a Generalized Board Game — Proof Horizons, Ocean Navigation, and Password Search',
              'kind': 'Core paper',
              'quote': quote,
              'quote_page': quote_page,
              'card_text': card_text,
              'subject': 'cs.LO_Logic_in_Computer_Science',
              'id': pub_id,
              'href': pub_id + '/',
              'pdf': pub_id + '/' + pdf_name,
              'archive_path': pub_id + '/' + pdf_name,
              'sha256': digest,
              'pages': pages,
              'order': -180,
              'source': pub_id + '/source.html',
              'authors': 'Brian Tenneson',
              'source_file': pub_id + '/source.tex',
              'classification_note': (
                  'Research paper, September 25, 2026. Develops singleton enumeration as a '
                  'generalized-board-game and proof-horizon problem, with password, CNF/3-CNF, '
                  'Ocean navigation, observation-constrained settlement, and fair-settlement connections. '
                  'Subject classification: cs.LO — Logic in Computer Science.'
              )
          }
          data['items'] = [item] + old
          cat.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          search = json.loads((root / 'docs/search-index.json').read_text())
          old_count = int(search['count'])
          expected = old_count if already else old_count + 1
          (root / '.build/singleton_enumeration_gbg/expected_count.txt').write_text(str(expected))

          wrapper = root / 'scripts/build_publications_106.py'
          w = wrapper.read_text()
          w2, n1 = re.subn(
              r'if len\(expanded\["items"\]\) != \d+:',
              f'if len(expanded["items"]) != {expected}:',
              w,
              count=1
          )
          w2, n2 = re.subn(
              r'Expected \d+ cards after restoration',
              f'Expected {expected} cards after restoration',
              w2,
              count=1
          )
          assert n1 == 1 and n2 == 1, 'Could not update expected publication count'
          wrapper.write_text(w2)
          print(f'Catalog prepared for {expected} cards; new paper is canonical slot #1.')
          PY

      - name: Rebuild publication site and verify slot 1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          docs = root / 'docs'
          pub_id = 'cs.LO_Logic_in_Computer_Science/singleton_enumeration_as_a_generalized_board_game'
          title = 'Singleton Enumeration as a Generalized Board Game — Proof Horizons, Ocean Navigation, and Password Search'
          phrase = 'Connects singleton enumeration to generalized board games'
          expected = int((root / '.build/singleton_enumeration_gbg/expected_count.txt').read_text())

          search = json.loads((docs / 'search-index.json').read_text())
          assert search['count'] == expected, search['count']
          assert search['items'][0]['id'] == pub_id, 'Singleton Enumeration paper is not slot #1'
          assert search['items'][0]['pages'] == 16
          assert phrase in search['items'][0].get('card_text', '')

          index = (docs / 'index.html').read_text()
          first_card = index.split('<article class="card"', 1)[1].split('</article>', 1)[0]
          assert title in first_card
          assert phrase in first_card

          pub_docs = docs / pub_id
          for name in ['index.html', 'source.html', 'source.tex', 'Singleton_Enumeration_as_a_Generalized_Board_Game.pdf']:
              assert (pub_docs / name).is_file(), name
          reader = (pub_docs / 'index.html').read_text()
          assert '/pub/pdf-reader.html?file=' in reader
          assert 'Singleton_Enumeration_as_a_Generalized_Board_Game.pdf' in reader
          assert 'Source' in reader
          print('PASS: Singleton Enumeration paper is slot #1; reader, PDF, source, quote, and catalog card all verified.')
          PY

      - name: Remove one-time staging and build payload
        run: |
          rm -rf incoming_publications/singleton_enumeration_as_a_generalized_board_game
          rm -rf .build/singleton_enumeration_gbg

      - name: Commit verified publication and rebuilt library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish Singleton Enumeration as a Generalized Board Game as card 1 [skip ci]'
            git push
          fi
