name: Publish One-Way Pac-Man FDWC Completion B at slot 1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_one_way_pac_man_fdwc_b_slot1.yml'
      - 'scripts/publish_one_way_pac_man_fdwc_b_slot1.py'
      - 'incoming_publications/one_way_pac_man_fdwc_completion_b_0_1/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-one-way-pac-man-fdwc-b
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LaTeX and PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Verify original FDWC B source, compile its PDF, and place publication in card slot 1
        run: python scripts/publish_one_way_pac_man_fdwc_b_slot1.py
      - name: Commit and publish article, source, card, and searchable catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/publications.json docs
          if ! git diff --cached --quiet; then
            git commit -m 'Publish One-Way Pac-Man FDWC Completion B at slot 1'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
