name: Compile experimental architecture article

on:
  push:
    branches: [main]
    paths:
      - 'pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.tex'
      - 'pub.experimental/_BUILD_Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compile-experimental-architecture-article
  cancel-in-progress: false

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up source from staged payload
        shell: bash
        run: |
          set -euo pipefail
          SRC='pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.tex'
          shopt -s nullglob
          PARTS=(.build/article_payload/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.part*.b64)
          if [ "${#PARTS[@]}" -gt 0 ]; then
            test "${#PARTS[@]}" -eq 4
            cat "${PARTS[@]}" | base64 -d | gzip -dc > "$SRC"
          fi
          test -s "$SRC"

      - name: Update authorship credit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.tex')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'pdfauthor={Prepared through interaction with Brian Tenneson; Research assistant: Brian Tenneson}',
              'pdfauthor={Brian Tenneson; Assisted by GPT-5; independently reviewed and accepted by the human author.}'
          )
          old = "\\author{\\textit{Prepared through interaction with Brian Tenneson}\\\\[0.5em]\n\\normalsize Research assistant: Brian Tenneson\\\\"
          new = "\\author{Brian Tenneson\\\\[0.3em]\n\\normalsize \\textit{Assisted by GPT-5; independently reviewed and accepted by the human author.}\\\\[0.5em]"
          if old not in s and 'Assisted by GPT-5; independently reviewed and accepted by the human author.' not in s:
              raise SystemExit('Expected authorship block not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install LaTeX dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended lmodern

      - name: Compile article twice
        shell: bash
        run: |
          set -euo pipefail
          SRC='pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.tex'
          OUTDIR=/tmp/architecture_pdf
          mkdir -p "$OUTDIR"
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$OUTDIR" "$SRC"
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$OUTDIR" "$SRC"
          cp "$OUTDIR/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.pdf" \
             'pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.pdf'
          test -s 'pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.pdf'
          mkdir -p docs/pub.experimental
          cp "$SRC" 'docs/pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.tex'
          cp 'pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.pdf' \
             'docs/pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.pdf'

      - name: Commit source and compiled PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.tex' \
            'pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.pdf' \
            'docs/pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.tex' \
            'docs/pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.pdf'
          if ! git diff --cached --quiet; then
            git commit -m 'Publish revised architecture article authorship credit'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
