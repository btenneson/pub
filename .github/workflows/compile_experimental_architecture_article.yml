name: Compile experimental architecture article

on:
  push:
    branches: [main]
    paths:
      - 'pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.tex'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compile-experimental-architecture-article
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LaTeX dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended lmodern

      - name: Compile article twice
        shell: bash
        run: |
          set -euo pipefail
          SRC='pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.tex'
          OUTDIR=/tmp/architecture_pdf
          mkdir -p "$OUTDIR"
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$OUTDIR" "$SRC"
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$OUTDIR" "$SRC"
          cp "$OUTDIR/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.pdf" \
             'pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.pdf'
          test -s 'pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.pdf'

      - name: Commit compiled PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'pub.experimental/Verifier_Gated_Conjecture_Settlement_Architecture_2026_08_29.pdf'
          if ! git diff --cached --quiet; then
            git commit -m 'Compile verifier-gated architecture article PDF'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
