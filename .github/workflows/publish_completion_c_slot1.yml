name: Publish Completion C at slot 1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_completion_c_slot1.yml'
      - 'scripts/publish_completion_c_slot1.py'
      - 'incoming_publications/completion_c_epistemic_conservation_0_2/source.tex'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-completion-c-slot1
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LaTeX and PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Compile, verify, and publish authorized repaired Completion C
        run: python scripts/publish_completion_c_slot1.py
      - name: Commit PDF, source, publication card, and catalog at slot 1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/publications.json docs
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Completion C ATLAS-repaired v0.2 in slot 1'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
