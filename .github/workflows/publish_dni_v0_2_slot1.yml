name: Publish provisional DNI 0.2 at slot 1
on:
  push:
    branches: [main]
    paths:
      - 'incoming_publications/dni_v0_2/**'
      - 'scripts/publish_dni_v0_2_slot1.py'
      - '.github/workflows/publish_dni_v0_2_slot1.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-dni-0-2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TeX and verification requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install -q pymupdf==1.26.4
      - name: Build and publish provisional DNI research article
        run: python scripts/publish_dni_v0_2_slot1.py
      - name: Commit publication outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/publications.json docs cs.LO_Logic_in_Computer_Science/deterministic_nondeterministic_interfaces_provisional_v0_2
          if ! git diff --cached --quiet; then
            git commit -m 'Publish PROVISIONAL DNI v0.2 at library slot 1'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
