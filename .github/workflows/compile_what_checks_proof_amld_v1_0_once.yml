name: Finalize What Checks the Proof AMLD textbook v1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compile_what_checks_proof_amld_v1_0_once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-what-checks-proof-amld-v1-0
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended cm-super

      - name: Reconstruct private-source build input in runner temp
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/amld-v10"
          mkdir -p "$work"
          cat .build/amld_v09/source.bz2.b64.part00 \
              .build/amld_v09/source.bz2.b64.part01 \
              .build/amld_v09/source.bz2.b64.part02 \
              .build/amld_v09/source.bz2.b64.part03 \
              .build/amld_v09/source.bz2.b64.part04 \
              .build/amld_v09/source.bz2.b64.part05 \
              .build/amld_v09/source.bz2.b64.part06 \
              .build/amld_v09/source.bz2.b64.part07 \
              .build/amld_v09/source.bz2.b64.part08 \
            | base64 -d | bunzip2 > "$work/v0_9.tex"
          base64 -d .build/amld_v10/transform.py.bz2.b64 | bunzip2 > "$work/transform.py"
          grep -q 'Textbook Draft v0.9' "$work/v0_9.tex"
          cd "$work"
          python transform.py
          test -s What_Checks_the_Proof_AMLD_Textbook_v1_0.tex
          grep -q 'Textbook Version 1.0' What_Checks_the_Proof_AMLD_Textbook_v1_0.tex
          ! grep -Eqi 'v0[._ ]?8|v0[._ ]?9|Textbook Draft' What_Checks_the_Proof_AMLD_Textbook_v1_0.tex

      - name: Compile and validate PDF
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/amld-v10"
          cd "$work"
          pdflatex -interaction=nonstopmode -halt-on-error What_Checks_the_Proof_AMLD_Textbook_v1_0.tex
          pdflatex -interaction=nonstopmode -halt-on-error What_Checks_the_Proof_AMLD_Textbook_v1_0.tex
          pdflatex -interaction=nonstopmode -halt-on-error What_Checks_the_Proof_AMLD_Textbook_v1_0.tex
          test -s What_Checks_the_Proof_AMLD_Textbook_v1_0.pdf
          ! grep -E 'Undefined control sequence|LaTeX Error|There were undefined references|Overfull' What_Checks_the_Proof_AMLD_Textbook_v1_0.log

      - name: Publish one canonical PDF and remove superseded copies
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/amld-v10/What_Checks_the_Proof_AMLD_Textbook_v1_0.pdf"
          canonical='Automated_Logical_Deciders_and_Conjecture_Settling/What_Checks_the_Proof_AMLD_Textbook_v1_0.pdf'
          mkdir -p 'Automated_Logical_Deciders_and_Conjecture_Settling'
          cp "$src" "$canonical"

          rm -f \
            'Automated_Logical_Deciders_and_Conjecture_Settling/What_Checks_the_Proof_AMLD_Textbook_v0_8.pdf' \
            'Automated_Logical_Deciders_and_Conjecture_Settling/What_Checks_the_Proof_AMLD_Textbook_v0_9.pdf' \
            'documents and their sources/What_Checks_the_Proof_AMLD_Textbook_v0_8.pdf' \
            'documents and their sources/What_Checks_the_Proof_AMLD_Textbook_v0_9.pdf' \
            'documents and their sources/What_Checks_the_Proof_AMLD_Textbook_v0_8.tex' \
            'documents and their sources/What_Checks_the_Proof_AMLD_Textbook_v0_9.tex'

          rm -rf \
            'docs/papers/what_checks_the_proof_amld_textbook_v0_8' \
            'docs/papers/what_checks_the_proof_amld_textbook_v0_9' \
            '.build/amld_v08' \
            '.build/amld_v09' \
            '.build/amld_v10'

          rm -f '.github/workflows/compile_what_checks_proof_amld_v0_8.yml'

          # Rebuild the public search page after the superseded readers are gone.
          python scripts/build_library_homepage.py

          # Remove this one-time finalizer from the finished repository.
          rm -f '.github/workflows/compile_what_checks_proof_amld_v1_0_once.yml'

      - name: Commit final canonical publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -s 'Automated_Logical_Deciders_and_Conjecture_Settling/What_Checks_the_Proof_AMLD_Textbook_v1_0.pdf'
          test -s 'docs/papers/what_checks_the_proof_amld_textbook_v1_0/index.html'
          test ! -e 'docs/papers/what_checks_the_proof_amld_textbook_v0_8'
          test ! -e 'docs/papers/what_checks_the_proof_amld_textbook_v0_9'
          if ! git diff --cached --quiet; then
            git commit -m 'Publish canonical What Checks the Proof v1.0 [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
