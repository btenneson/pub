name: One-time repair Hyperfinite Oracles publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair_hyperfinite_oracles_once.yml'

permissions:
  contents: write

concurrency:
  group: repair-hyperfinite-oracles-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore canonical LaTeX source exactly
        shell: bash
        run: |
          python - <<'PY2'
          from pathlib import Path
          import base64, hashlib, zlib
          payload = ""
          data = zlib.decompress(base64.b64decode(payload))
          expected = "32480a3d83d7faf8eda01cc98e13b53e65efc07a57b55e8d2e13bbd746c3c591"
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f"source hash mismatch: {actual} != {expected}")
          path = Path("documents and their sources/The_Hyperfinite_Oracles_of_DATA_MIND_3_2.tex")
          path.write_bytes(data)
          print(f"restored {path}: {len(data)} bytes, sha256={actual}")
          PY2

      - name: Install LaTeX and PDF validation tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern \
            poppler-utils

      - name: Rebuild and validate the publication PDF
        shell: bash
        run: |
          set -euo pipefail
          src='documents and their sources/The_Hyperfinite_Oracles_of_DATA_MIND_3_2.tex'
          archive='cs.LO_Logic_in_Computer_Science/The_Hyperfinite_Oracles_of_DATA_MIND_3_2.pdf'
          pages='docs/papers/hyperfinite_oracles_data_mind_3_2/The_Hyperfinite_Oracles_of_DATA_MIND_3_2.pdf'
          build="$RUNNER_TEMP/hyperfinite_oracles_repair"
          mkdir -p "$build" "$(dirname "$archive")" "$(dirname "$pages")"
          cp "$src" "$build/paper.tex"
          (
            cd "$build"
            pdflatex -interaction=nonstopmode -halt-on-error paper.tex
            pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          )
          test -s "$build/paper.pdf"
          size=$(stat -c%s "$build/paper.pdf")
          pages_count=$(pdfinfo "$build/paper.pdf" | awk '/^Pages:/ {print $2}')
          test "$size" -gt 100000
          test "$pages_count" -eq 15
          cp "$build/paper.pdf" "$archive"
          cp "$build/paper.pdf" "$pages"
          cmp -s "$archive" "$pages"
          echo "validated PDF: $pages_count pages, $size bytes"

      - name: Commit restored source and PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'documents and their sources/The_Hyperfinite_Oracles_of_DATA_MIND_3_2.tex' \
            'cs.LO_Logic_in_Computer_Science/The_Hyperfinite_Oracles_of_DATA_MIND_3_2.pdf' \
            'docs/papers/hyperfinite_oracles_data_mind_3_2/The_Hyperfinite_Oracles_of_DATA_MIND_3_2.pdf'
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Restore complete Hyperfinite Oracles source and PDF'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
