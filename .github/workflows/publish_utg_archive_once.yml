name: Publish Universal Theorem Geometry I archive once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_utg_archive_once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover validated PDF from preserved upload
        shell: bash
        run: |
          set -euo pipefail
          OLD='fe4bf0eaed7fe2016a2be0efc9a0826e031b0ee0'
          TMP='/tmp/Universal_Theorem_Geometry_I.pdf'
          ARCHIVE='cs.LO_Logic_in_Computer_Science/Universal_Theorem_Geometry_I.pdf'
          READER='docs/papers/universal_theorem_geometry_i_001/Universal_Theorem_Geometry_I_Corrected.pdf'
          MARKER='docs/papers/universal_theorem_geometry_i_001/PUBLICATION.md'

          mapfile -t PARTS < <(git ls-tree -r --name-only "$OLD" -- '.build/utg_pdf_parts' | sort)
          test "${#PARTS[@]}" -eq 12
          : > /tmp/utg_pdf.b64
          for p in "${PARTS[@]}"; do
            git show "$OLD:$p" >> /tmp/utg_pdf.b64
          done
          tr -d '\r\n\t ' < /tmp/utg_pdf.b64 | base64 -d > "$TMP"
          test -s "$TMP"
          file "$TMP" | grep -q 'PDF document'
          head -c 5 "$TMP" | grep -q '%PDF-'

          mkdir -p "$(dirname "$ARCHIVE")" "$(dirname "$READER")"
          cp "$TMP" "$ARCHIVE"
          cp "$TMP" "$READER"
          cat > "$MARKER" <<'EOF'
# Universal Theorem Geometry I

Canonical archive: `cs.LO_Logic_in_Computer_Science/Universal_Theorem_Geometry_I.pdf`

Public reader PDF: `Universal_Theorem_Geometry_I_Corrected.pdf`
EOF

      - name: Commit canonical publication and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'cs.LO_Logic_in_Computer_Science/Universal_Theorem_Geometry_I.pdf' \
            'docs/papers/universal_theorem_geometry_i_001/Universal_Theorem_Geometry_I_Corrected.pdf' \
            'docs/papers/universal_theorem_geometry_i_001/PUBLICATION.md'
          git rm '.github/workflows/publish_utg_archive_once.yml'
          git commit -m 'Publish Universal Theorem Geometry I in library archive'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
