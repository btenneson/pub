name: Publish Foggy Multiarticle Metaworld v0.2 slot 1
on:
  push:
    branches: [main]
    paths:
      - 'incoming_publications/foggy_multiarticle_v0_2/source.tex'
      - 'scripts/publish_foggy_multiarticle_v0_2_slot1.py'
      - '.github/workflows/publish_foggy_multiarticle_v0_2_slot1.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-foggy-metaworld-v0-2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LaTeX and publication validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install -q pymupdf==1.26.4
      - name: Compile and publish the approved article in slot 1
        run: python scripts/publish_foggy_multiarticle_v0_2_slot1.py
      - name: Commit publication artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/publications.json docs cs.LO_Logic_in_Computer_Science/foggy_multiarticle_metaworld_discoveries_connections_open_frontiers_0_2
          if ! git diff --cached --quiet; then
            git commit -m 'Publish 50-island Foggy Multiarticle Metaworld v0.2 in slot 1'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
