name: Publish Self Aware Machine Epistemic Handoff in slot 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_self_aware_machine_epistemic_handoff_slot1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install pymupdf==1.26.4

      - name: Reconstruct audited Atlas source and compile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/self_aware_handoff
          base64 -d incoming_publications/self_aware_machine_epistemic_handoff/source.tex.gz.b64 | gzip -d > .build/self_aware_handoff/source.tex
          test "$(wc -c < .build/self_aware_handoff/source.tex)" -eq 37145
          test "$(sha256sum .build/self_aware_handoff/source.tex | awk '{print $1}')" = "ac65105e20ab57518a3c791acbce4116a852350827cbc79193719a80c9907dff"
          grep -q '\\end{document}' .build/self_aware_handoff/source.tex
          cd .build/self_aware_handoff
          for i in 1 2 3; do
            pdflatex -interaction=nonstopmode -halt-on-error source.tex
          done
          test -s source.pdf

      - name: Verify the compiled paper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz, re
          pdf = Path('.build/self_aware_handoff/source.pdf')
          doc = fitz.open(pdf)
          assert len(doc) == 15, f'Expected 15 pages, got {len(doc)}'
          p1 = re.sub(r'\s+', ' ', doc[0].get_text()).strip()
          assert 'The Self Aware Machine' in p1
          assert 'Epistemic Handoff' in p1
          p9 = re.sub(r'\s+', ' ', doc[8].get_text()).strip()
          quote = 'successor-safe formal self-awareness is preserved by re-identification, not by identity fiction.'
          assert quote in p9, 'Slot-card quote not found on page 9'
          assert all(doc[i].get_text().strip() for i in range(len(doc))), 'Unreadable or empty PDF page'
          print('PASS: 15-page Atlas revision compiled and publication quote verified.')
          PY

      - name: Stage publication files under cs.LO
        shell: bash
        run: |
          set -euo pipefail
          PUB='cs.LO_Logic_in_Computer_Science/self_aware_machine_epistemic_handoff'
          DOCS='docs/cs.LO_Logic_in_Computer_Science/self_aware_machine_epistemic_handoff'
          PDF='Self_Aware_Machine_Epistemic_Handoff_Atlas_Revision.pdf'
          mkdir -p "$PUB" "$DOCS"
          cp .build/self_aware_handoff/source.pdf "$PUB/$PDF"
          cp .build/self_aware_handoff/source.pdf "$DOCS/$PDF"
          cp .build/self_aware_handoff/source.tex "$DOCS/source.tex"

      - name: Promote publication to slot 1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, fitz

          root = Path('.')
          pub_id = 'cs.LO_Logic_in_Computer_Science/self_aware_machine_epistemic_handoff'
          pdf_name = 'Self_Aware_Machine_Epistemic_Handoff_Atlas_Revision.pdf'
          pdf = root / pub_id / pdf_name
          docs_pdf = root / 'docs' / pub_id / pdf_name
          source = root / 'docs' / pub_id / 'source.tex'

          assert pdf.is_file() and docs_pdf.is_file() and source.is_file()
          assert hashlib.sha256(pdf.read_bytes()).hexdigest() == hashlib.sha256(docs_pdf.read_bytes()).hexdigest()
          digest = hashlib.sha256(pdf.read_bytes()).hexdigest()
          pages = len(fitz.open(pdf))
          assert pages == 15

          cat = root / 'scripts/publications.json'
          data = json.loads(cat.read_text())
          old = [x for x in data['items'] if x.get('id') != pub_id]

          item = {
              'title': 'The Self Aware Machine: Epistemic Handoff and Successor-Safe Self-Awareness',
              'kind': 'Core paper',
              'quote': 'successor-safe formal self-awareness is preserved by re-identification, not by identity fiction.',
              'quote_page': 9,
              'card_text': 'Post-audit Atlas revision formalizing verifier-gated knowledge and certified succession for general certified subjects, then specializing the framework to AMLDs and Omnicartographers. It separates state, knowledge, provenance, and identity continuity; gives a handoff knowledge-transport lemma, successor self-identification by re-identification, lineage-aware epistemic towers, and an identity-local handoff theorem with explicit freshness, provenance, deactivation, and identity-adequacy hypotheses.',
              'status': 'POST-AUDIT ATLAS REVISION — The results are conditional on the stated certification, soundness, transport, identity, activation, and implementation obligations. The handoff theorem is restricted to identity-local hazards and does not claim to resolve identity-insensitive diagonal, liar-like, prediction-based, Loebian, content-sensitive, copied-memory, or causal-continuity hazards.',
              'subject': 'cs.LO_Logic_in_Computer_Science',
              'id': pub_id,
              'href': pub_id + '/',
              'pdf': pub_id + '/' + pdf_name,
              'archive_path': pub_id + '/' + pdf_name,
              'sha256': digest,
              'pages': pages,
              'order': -7,
              'source': pub_id + '/source.html',
              'authors': 'Brian Tenneson',
              'source_file': pub_id + '/source.tex',
              'classification_note': 'Post-Audit Atlas Revision, September 18, 2026. Formal and architectural treatment of verifier-gated epistemic handoff and successor-safe self-awareness; no phenomenological or consciousness claim. Subject classification: cs.LO — Logic in Computer Science.'
          }
          data['items'] = [item] + old
          cat.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Increase restored-catalog expected count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_publications_106.py')
          s = p.read_text()
          if '!= 117:' in s:
              s = s.replace('!= 117:', '!= 118:')
              s = s.replace('Expected 117 cards after restoration', 'Expected 118 cards after restoration')
          assert '!= 118:' in s, 'Could not establish 118-card restored catalog expectation'
          p.write_text(s)
          PY

      - name: Rebuild and audit publication library
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py
          python - <<'PY'
          from pathlib import Path
          import json

          pub_id = 'cs.LO_Logic_in_Computer_Science/self_aware_machine_epistemic_handoff'
          pdf_name = 'Self_Aware_Machine_Epistemic_Handoff_Atlas_Revision.pdf'
          docs = Path('docs')
          search = json.loads((docs / 'search-index.json').read_text())
          assert search['count'] == 118, search['count']
          assert search['items'][0]['id'] == pub_id, 'New paper is not slot #1'

          first = search['items'][0]
          assert first['title'] == 'The Self Aware Machine: Epistemic Handoff and Successor-Safe Self-Awareness'
          assert first['pages'] == 15
          assert first['pdf'] == pub_id + '/' + pdf_name

          assert (docs / pub_id / 'index.html').is_file()
          assert (docs / pub_id / pdf_name).is_file()
          assert (docs / pub_id / 'source.tex').is_file()
          assert (docs / pub_id / 'source.html').is_file()

          print('PASS: new paper is slot #1; 118-card catalog, PDF reader, PDF, and source files verified.')
          PY

      - name: Remove one-time staging payload
        run: rm -rf incoming_publications/self_aware_machine_epistemic_handoff

      - name: Commit tested publication and regenerated library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish Self Aware Machine Epistemic Handoff as card 1 [skip ci]'
            git push
          fi
