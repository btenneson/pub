name: Visual audit publication library (101 items)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_publication_visual.py'
      - '.github/workflows/audit_publication_visual.yml'

permissions:
  contents: read

concurrency:
  group: visual-audit-publication-library
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: python -m pip install --quiet pymupdf pillow selenium requests beautifulsoup4

      - name: Record browser versions
        shell: bash
        run: |
          google-chrome --version || google-chrome-stable --version || chromium --version || true
          chromedriver --version || true

      - name: Audit all 101 indexed publications
        run: |
          python scripts/audit_publication_visual.py \
            --repo-root . \
            --out diagnostics/pub-101-visual-audit \
            --live-base https://btenneson.github.io/pub/

      - name: Show report
        if: always()
        run: |
          test -s diagnostics/pub-101-visual-audit/audit.md
          cat diagnostics/pub-101-visual-audit/audit.md

      - name: Upload full diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-101-visual-diagnostic
          path: diagnostics/pub-101-visual-audit
          if-no-files-found: error
          retention-days: 30
