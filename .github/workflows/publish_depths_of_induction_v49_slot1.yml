name: Publish Depths of Induction Version 49 in slot 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_depths_of_induction_v49_slot1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and PDF verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-pictures lmodern
          python -m pip install pymupdf==1.26.4

      - name: Compile Version 49 against the retained Version 48 core
        shell: bash
        run: |
          set -euo pipefail
          BUILD='.build/depths_of_induction_v49'
          mkdir -p "$BUILD"
          cp incoming_publications/depths_of_induction_v49/source.tex "$BUILD/source.tex"
          cp docs/cs.LO_Logic_in_Computer_Science/depths_of_induction_v48/Depths_of_Induction_Version_48.pdf "$BUILD/Depths_of_Induction_Version_48.pdf"
          test "$(wc -c < "$BUILD/source.tex")" -ge 68000
          grep -q '\\end{document}' "$BUILD/source.tex"
          cd "$BUILD"
          for i in 1 2 3 4; do
            pdflatex -interaction=nonstopmode -halt-on-error source.tex
          done
          test -s source.pdf

      - name: Verify and stage the flagship publication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz, re

          root = Path('.')
          pdf = root / '.build/depths_of_induction_v49/source.pdf'
          doc = fitz.open(pdf)
          assert len(doc) == 191, f'Expected 191 pages, got {len(doc)}'
          first = re.sub(r'\\s+', ' ', doc[0].get_text()).strip()
          assert 'Depths of Induction' in first and 'Version 49' in first
          assert all(doc[i].get_text().strip() for i in range(len(doc))), 'Unreadable or empty PDF page'
          full = '\n'.join(doc[i].get_text() for i in range(len(doc)))
          full_norm = re.sub(r'\\s+', ' ', full).strip()
          for phrase in [
              'countably infinite antichain',
              'Greatest clocked-simulation degree',
              'moving target',
          ]:
              assert phrase in full_norm, f'Missing expected Version 49 text: {phrase}'
          quote = ('The next substantial theme should begin in a later version rather than make '
                   'Version 49 a moving target.')
          qnorm = re.sub(r'\\s+', ' ', quote).strip()
          quote_page = None
          for i in range(len(doc)):
              p = re.sub(r'\\s+', ' ', doc[i].get_text()).strip()
              if qnorm in p:
                  quote_page = i + 1
                  break
          assert 'Scheduled GBG Clocked Simulation Degrees' in (root / '.build/depths_of_induction_v49/source.tex').read_text()
          assert quote_page is not None, 'Could not locate the closing moving-target quote'
          (root / '.build/depths_of_induction_v49/quote_page.txt').write_text(str(quote_page))
          print(f'PASS: Version 49 compiled to 191 readable pages; closing quote is on page {quote_page}.')
          PY

          PUB='cs.LO_Logic_in_Computer_Science/depths_of_induction_v49'
          mkdir -p "$PUB" "docs/$PUB"
          cp .build/depths_of_induction_v49/source.pdf "$PUB/Depths_of_Induction_Version_49.pdf"
          cp .build/depths_of_induction_v49/source.pdf "docs/$PUB/Depths_of_Induction_Version_49.pdf"
          cp .build/depths_of_induction_v49/source.tex "docs/$PUB/source.tex"

      - name: Promote Version 49 to publication card slot 1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, fitz

          root = Path('.')
          pub_id = 'cs.LO_Logic_in_Computer_Science/depths_of_induction_v49'
          pdf_name = 'Depths_of_Induction_Version_49.pdf'
          archive = root / pub_id / pdf_name
          source = root / 'docs' / pub_id / 'source.tex'
          doc_pdf = root / 'docs' / pub_id / pdf_name
          assert archive.is_file() and archive.stat().st_size > 0
          assert doc_pdf.is_file() and doc_pdf.stat().st_size > 0
          assert source.is_file() and source.stat().st_size >= 68000
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == hashlib.sha256(doc_pdf.read_bytes()).hexdigest()

          doc = fitz.open(archive)
          pages = len(doc)
          assert pages == 191
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          quote = ('The next substantial theme should begin in a later version rather than make '
                   'Version 49 a moving target.')
          quote_page = int((root / '.build/depths_of_induction_v49/quote_page.txt').read_text())
          card_text = (
              'Latest version of the primary text for the library. Version 49 preserves the Version 48 '
              'foundations while integrating the clocked-simulation degree settlements, including the '
              'countably infinite antichain theorem; generalized board games as operational proof and '
              'search geometry; the distinction among proof, discovery, and forced-settlement horizons; '
              'scheduler-robust AMLD interpretations; scheduled GBG simulation degrees; and a '
              'Hilbert-addressed ATP case study. Former Open Problem 9.2, the greatest-degree question, '
              'remains open.'
          )

          cat = root / 'scripts/publications.json'
          data = json.loads(cat.read_text())
          old = [x for x in data['items'] if x.get('id') != pub_id]
          item = {
              'title': 'Depths of Induction and Formalized Self-Awareness — Version 49',
              'kind': 'Flagship monograph',
              'quote': quote,
              'quote_page': quote_page,
              'card_text': card_text,
              'subject': 'cs.LO_Logic_in_Computer_Science',
              'id': pub_id,
              'href': pub_id + '/',
              'pdf': pub_id + '/' + pdf_name,
              'archive_path': pub_id + '/' + pdf_name,
              'sha256': digest,
              'pages': pages,
              'order': -170,
              'source': pub_id + '/source.html',
              'authors': 'Brian Tenneson',
              'source_file': pub_id + '/source.tex',
              'classification_note': (
                  'Version 49, September 24, 2026. Latest version of the primary text for the library. '
                  'Retains the Version 48 core and integrates settled clocked-simulation degree results, '
                  'generalized-board-game operational proof/search geometry, strategic horizons, scheduled '
                  'GBG simulation degrees, and the Hilbert-addressed ATP case study. '
                  'Subject classification: cs.LO — Logic in Computer Science.'
              )
          }
          data['items'] = [item] + old
          cat.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          wrapper = root / 'scripts/build_publications_106.py'
          s = wrapper.read_text()
          s2, n1 = re.subn(
              r'if len\(expanded\["items"\]\) != \d+:',
              'if len(expanded["items"]) != 128:',
              s,
              count=1
          )
          s2, n2 = re.subn(
              r'Expected \d+ cards after restoration',
              'Expected 128 cards after restoration',
              s2,
              count=1
          )
          assert n1 == 1 and n2 == 1, 'Could not update expected publication count to 128'
          wrapper.write_text(s2)
          print('Catalog prepared for 128 cards with Version 49 in canonical slot 1.')
          PY

      - name: Rebuild publication site and verify slot 1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          docs = root / 'docs'
          pub_id = 'cs.LO_Logic_in_Computer_Science/depths_of_induction_v49'
          title = 'Depths of Induction and Formalized Self-Awareness — Version 49'
          phrase = 'Latest version of the primary text for the library'

          search = json.loads((docs / 'search-index.json').read_text())
          assert search['count'] == 128, search['count']
          assert search['items'][0]['id'] == pub_id, 'Version 49 is not slot #1'
          assert search['items'][0]['pages'] == 191
          assert phrase in search['items'][0].get('card_text', '')

          index = (docs / 'index.html').read_text()
          first_card = index.split('<article class="card"', 1)[1].split('</article>', 1)[0]
          assert title in first_card
          assert phrase in first_card

          pub_docs = docs / pub_id
          for name in ['index.html', 'source.html', 'source.tex', 'Depths_of_Induction_Version_49.pdf']:
              assert (pub_docs / name).is_file(), name
          reader = (pub_docs / 'index.html').read_text()
          assert '/pub/pdf-reader.html?file=' in reader
          assert 'Depths_of_Induction_Version_49.pdf' in reader
          assert 'Source' in reader

          assert (docs / 'cs.LO_Logic_in_Computer_Science/depths_of_induction_v48/index.html').is_file()
          print('PASS: Version 49 is slot #1; reader, PDF, source, catalog card, and Version 48 predecessor are all present.')
          PY

      - name: Remove one-time staging and build payload
        run: |
          rm -rf incoming_publications/depths_of_induction_v49
          rm -rf .build/depths_of_induction_v49

      - name: Commit verified Version 49 and rebuilt library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish Depths of Induction Version 49 as card 1 [skip ci]'
            git push
          fi
