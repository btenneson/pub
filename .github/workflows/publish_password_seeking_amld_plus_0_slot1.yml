name: Publish Password-Seeking with AMLD+0 in slot 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_password_seeking_amld_plus_0_slot1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build reviewed source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern zip >/dev/null
          python -m pip install -q pymupdf==1.26.4

          BUILD='.build/password_seeking_amld_plus_0'
          STAGE='incoming_publications/password_seeking_amld_plus_0'
          mkdir -p "$BUILD"
          cp "$STAGE/source.tex" "$BUILD/source.tex"
          test "$(wc -c < "$BUILD/source.tex")" -eq 40951
          test "$(sha256sum "$BUILD/source.tex" | awk '{print $1}')" = "8aa37fe992ecdf29b8e8560aa15087340f0e0cbaa6986b29b824406d2ebcef84"

          cd "$BUILD"
          for i in 1 2 3; do pdflatex -interaction=nonstopmode -halt-on-error source.tex >/dev/null; done
          cd ../..

          python - <<'PY'
          from pathlib import Path
          import fitz, re
          p=Path('.build/password_seeking_amld_plus_0/source.pdf')
          d=fitz.open(p)
          assert len(d)==17, len(d)
          text=re.sub(r'\s+', ' ', ' '.join(page.get_text() for page in d))
          for s in [
              'Password-Seeking with AMLD+0',
              'Singleton Query / Typed Settlement Principle',
              'Player-Zero Noncreation of Information',
              'Scheduling is a control resource, not an oracle.',
              'CNF Prefix-Pruning Monotonicity',
              'Horizon–Execution Separation'
          ]:
              assert s in text, s
          quote='Scheduling is a control resource, not an oracle.'
          qp=None
          for i,page in enumerate(d):
              if quote in re.sub(r'\s+', ' ', page.get_text()):
                  qp=i+1
                  break
          assert qp is not None
          Path('.build/password_seeking_amld_plus_0/quote_page.txt').write_text(str(qp))
          print('verified quote page', qp)
          PY

          PUB='cs.LO_Logic_in_Computer_Science/password_seeking_with_amld_plus_0_singleton_enumeration_sat_cnf_pruning'
          PDF='Password-Seeking_with_AMLD_plus_0_Singleton_Enumeration_SAT_and_CNF_Pruning.pdf'
          ZIP='Password-Seeking_with_AMLD_plus_0_Singleton_Enumeration_SAT_and_CNF_Pruning_Source_and_PDF.zip'
          mkdir -p "$PUB" "docs/$PUB"
          cp "$BUILD/source.pdf" "$PUB/$PDF"
          cp "$BUILD/source.pdf" "docs/$PUB/$PDF"
          cp "$BUILD/source.tex" "docs/$PUB/source.tex"
          cp "$BUILD/source.pdf" "$BUILD/$PDF"
          (cd "$BUILD" && zip -X -q "$ZIP" source.tex "$PDF")
          cp "$BUILD/$ZIP" "docs/$PUB/$ZIP"

      - name: Promote publication to card slot 1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz, hashlib, json, re
          root=Path('.')
          pub_id='cs.LO_Logic_in_Computer_Science/password_seeking_with_amld_plus_0_singleton_enumeration_sat_cnf_pruning'
          pdf_name='Password-Seeking_with_AMLD_plus_0_Singleton_Enumeration_SAT_and_CNF_Pruning.pdf'
          zip_name='Password-Seeking_with_AMLD_plus_0_Singleton_Enumeration_SAT_and_CNF_Pruning_Source_and_PDF.zip'
          pdf=root/pub_id/pdf_name
          source=root/'docs'/pub_id/'source.tex'
          source_package=root/'docs'/pub_id/zip_name
          pages=len(fitz.open(pdf))
          assert pages == 17
          digest=hashlib.sha256(pdf.read_bytes()).hexdigest()
          source_digest=hashlib.sha256(source.read_bytes()).hexdigest()
          zip_digest=hashlib.sha256(source_package.read_bytes()).hexdigest()
          quote='Scheduling is a control resource, not an oracle.'
          quote_page=int((root/'.build/password_seeking_amld_plus_0/quote_page.txt').read_text())

          title='Password-Seeking with AMLD+0 — Singleton Enumeration, SAT, and CNF Pruning'
          card_text=(
            'Rewires singleton enumeration around AMLD+0 and uses password-seeking as an opaque-search '
            'control for automated theorem proving. A singleton query can induce multiple typed settlement '
            'regions and many certificate histories, while Player 0 allocates service without choosing local '
            'moves or changing verifier acceptance. The password theorems show that scheduling cannot create '
            'information absent from the observation interface; the SAT/CNF comparison shows how visible '
            'constraint structure can instead support pruning, navigation, BANK reuse, and controller-level allocation.'
          )
          status='FINAL ATLAS-REPAIRED RELEASE — September 30, 2026.'

          cat=root/'scripts/publications.json'
          data=json.loads(cat.read_text())
          existed=any(x.get('id')==pub_id for x in data['items'])
          old=[x for x in data['items'] if x.get('id')!=pub_id]
          orders=[x.get('order') for x in old if isinstance(x.get('order'),(int,float))]
          order=min(orders)-10 if orders else -10
          item={
            'title':title,
            'kind':'Core paper',
            'quote':quote,
            'quote_page':quote_page,
            'card_text':card_text,
            'status':status,
            'subject':'cs.LO_Logic_in_Computer_Science',
            'id':pub_id,
            'href':pub_id+'/',
            'pdf':pub_id+'/'+pdf_name,
            'archive_path':pub_id+'/'+pdf_name,
            'sha256':digest,
            'sha256_tex':source_digest,
            'sha256_source_package':zip_digest,
            'pages':pages,
            'order':order,
            'source':pub_id+'/source.html',
            'source_file':pub_id+'/source.tex',
            'source_package':pub_id+'/'+zip_name,
            'authors':'Brian Tenneson',
            'classification_note':(
              'Core paper, September 30, 2026. Rewires singleton enumeration into the AMLD+0 controller '
              'architecture, separating singleton query cardinality from typed settlement regions, local navigation '
              'from global Player-Zero scheduling, and opaque password search from constraint-rich SAT/CNF search. '
              'Includes the Player-Zero Noncreation of Information theorem, information-constrained Bellman gap, '
              'opaque no-polynomial-settlement result, CNF prefix-pruning monotonicity, horizon equivalence, '
              'execution-separation, and fair-settlement invariance. Subject classification: cs.LO — Logic in Computer Science.'
            )
          }
          data['items']=[item]+old
          cat.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          search=json.loads((root/'docs/search-index.json').read_text())
          expected=int(search['count']) if existed else int(search['count'])+1
          wrapper=root/'scripts/build_publications_106.py'
          wt=wrapper.read_text()
          wt,n1=re.subn(r'if len\(expanded\["items"\]\) != \d+:',
                       f'if len(expanded["items"]) != {expected}:',wt,count=1)
          wt,n2=re.subn(r'Expected \d+ cards after restoration',
                       f'Expected {expected} cards after restoration',wt,count=1)
          assert n1==1 and n2==1, (n1,n2)
          wrapper.write_text(wt)
          (root/'.build/password_seeking_amld_plus_0/expected.txt').write_text(str(expected))
          print('slot order',order,'expected',expected)
          PY

          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py

          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          pub_id='cs.LO_Logic_in_Computer_Science/password_seeking_with_amld_plus_0_singleton_enumeration_sat_cnf_pruning'
          s=json.loads((root/'docs/search-index.json').read_text())
          expected=int((root/'.build/password_seeking_amld_plus_0/expected.txt').read_text())
          assert s['count']==expected
          x=s['items'][0]
          assert x['id']==pub_id
          assert x['pages']==17
          assert x['title']=='Password-Seeking with AMLD+0 — Singleton Enumeration, SAT, and CNF Pruning'
          assert x['quote']=='Scheduling is a control resource, not an oracle.'
          home=(root/'docs/index.html').read_text()
          first=home.split('<article class="card"',1)[1].split('</article>',1)[0]
          assert 'Password-Seeking with AMLD+0' in first
          for f in [
            f'docs/{pub_id}/index.html',
            f'docs/{pub_id}/source.html',
            f'docs/{pub_id}/source.tex',
            f'docs/{pub_id}/Password-Seeking_with_AMLD_plus_0_Singleton_Enumeration_SAT_and_CNF_Pruning.pdf',
            f'docs/{pub_id}/Password-Seeking_with_AMLD_plus_0_Singleton_Enumeration_SAT_and_CNF_Pruning_Source_and_PDF.zip'
          ]:
              assert (root/f).is_file(), f
          print('PASS: publication is slot #1 with PDF, reader, source, ZIP, and quote.')
          PY

          rm -rf incoming_publications/password_seeking_amld_plus_0 .build/password_seeking_amld_plus_0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m 'Publish Password-Seeking with AMLD+0 as card 1 [skip ci]'
          git push
