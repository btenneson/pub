name: Publish Semi-Ideal Computers in Proof-Fiber Geometry once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_semi_ideal_proof_fiber_once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX and audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended cm-super
          python -m pip install pymupdf==1.26.4

      - name: Assemble exact post-audit source
        shell: bash
        run: |
          set -euo pipefail
          SRC='incoming_publications/semi_ideal_computers_in_proof_fiber_geometry'
          DEST='docs/cs.LO_Logic_in_Computer_Science/semi_ideal_computers_in_proof_fiber_geometry'
          mkdir -p "$DEST"
          cat "$SRC/source.part00" "$SRC/source.part01" "$SRC/source.part02" > "$DEST/source.tex"
          echo '3f3b42bee27d382a858fc4f7b88fb25b5dae27be5d3156c187cb37aad0b4e10d  '"$DEST/source.tex" | sha256sum -c -

      - name: Compile publication PDF
        shell: bash
        run: |
          set -euo pipefail
          DEST='docs/cs.LO_Logic_in_Computer_Science/semi_ideal_computers_in_proof_fiber_geometry'
          JOB='Semi_Ideal_Computers_in_Proof_Fiber_Geometry_POST_AUDIT_002'
          cd "$DEST"
          pdflatex -interaction=nonstopmode -halt-on-error -jobname="$JOB" source.tex
          pdflatex -interaction=nonstopmode -halt-on-error -jobname="$JOB" source.tex
          test -s "$JOB.pdf"
          rm -f "$JOB.aux" "$JOB.log" "$JOB.out"

      - name: Put publication in slot 1 of canonical catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          import fitz

          catalog = Path('scripts/publications.json')
          data = json.loads(catalog.read_text())
          pub_id = 'cs.LO_Logic_in_Computer_Science/semi_ideal_computers_in_proof_fiber_geometry'
          pdf_rel = pub_id + '/Semi_Ideal_Computers_in_Proof_Fiber_Geometry_POST_AUDIT_002.pdf'
          pdf = Path('docs') / pdf_rel
          doc = fitz.open(pdf)
          item = {
              'title': 'Semi-Ideal Computers in Proof-Fiber Geometry: Machine-Accessible Geodesics, Exact Distance Certification, and Computational Regret',
              'kind': 'Core paper',
              'quote': 'This is the precise sense in which intrinsic theorem difficulty is the length or cost of an extremal/geodesic proof, when the infimum is attained.',
              'quote_page': 8,
              'subject': 'cs.LO_Logic_in_Computer_Science',
              'id': pub_id,
              'href': pub_id + '/',
              'pdf': pdf_rel,
              'archive_path': 'docs/' + pdf_rel,
              'sha256': hashlib.sha256(pdf.read_bytes()).hexdigest(),
              'pages': len(doc),
              'order': -1,
              'source': pub_id + '/source.html',
              'authors': 'Brian Tenneson',
              'source_file': pub_id + '/source.tex',
              'classification_note': 'Post-Audit Revised Edition. Subject classification: cs.LO — Logic in Computer Science.'
          }
          old = [x for x in data['items'] if x.get('id') != pub_id]
          data['items'] = [item] + old
          catalog.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          builder = Path('scripts/build_publications_106.py')
          text = builder.read_text()
          if '!= 109' in text:
              text = text.replace('!= 109', '!= 110').replace('Expected 109', 'Expected 110')
              builder.write_text(text)
          elif '!= 110' not in text:
              raise SystemExit('Could not locate restored-card count guard')
          PY

      - name: Rebuild readers and publication catalog
        run: |
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py

      - name: Verify slot, quote, reader, and PDF aspect ratio
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re
          from urllib.parse import quote
          import fitz

          pub_id = 'cs.LO_Logic_in_Computer_Science/semi_ideal_computers_in_proof_fiber_geometry'
          pdf_rel = pub_id + '/Semi_Ideal_Computers_in_Proof_Fiber_Geometry_POST_AUDIT_002.pdf'
          pdf_path = Path('docs') / pdf_rel
          source_path = Path('docs') / pub_id / 'source.tex'
          reader_path = Path('docs') / pub_id / 'index.html'
          quote_text = 'This is the precise sense in which intrinsic theorem difficulty is the length or cost of an extremal/geodesic proof, when the infimum is attained.'

          # Underscore/no-space publication path and filenames.
          for part in pub_id.split('/') + [pdf_path.name, source_path.name]:
              assert ' ' not in part, part
          assert pub_id.endswith('semi_ideal_computers_in_proof_fiber_geometry')

          # True slot #1, both globally and within cs.LO.
          index = json.loads(Path('docs/search-index.json').read_text())
          assert index['count'] == 110
          assert index['items'][0]['id'] == pub_id
          cslo = [x for x in index['items'] if x['subject'] == 'cs.LO_Logic_in_Computer_Science']
          assert cslo[0]['id'] == pub_id
          root_html = Path('docs/index.html').read_text()
          subject_html = Path('docs/cs.LO_Logic_in_Computer_Science/index.html').read_text()
          assert root_html.find(pub_id) < root_html.find('miu_address_and_logical_distance')
          assert subject_html.find(pub_id) < subject_html.find('certified_synergy_ten_paper_synthesis')

          # Section 9 theorem-difficulty quote is really on PDF page 8.
          doc = fitz.open(pdf_path)
          assert len(doc) == 13
          page8 = ' '.join(doc[7].get_text().split())
          assert ' '.join(quote_text.split()) in page8

          # Every page preserves the portrait Letter page geometry.
          target_ratio = 612.0 / 792.0
          for i, page in enumerate(doc):
              r = page.rect.width / page.rect.height
              assert abs(r - target_ratio) < 1e-5, (i + 1, page.rect, r)

          # New publication uses the shared PDF.js reader, not a stretched raw PDF iframe.
          reader = reader_path.read_text()
          viewer = '/pub/pdf-reader.html?file=' + quote('/pub/' + pdf_rel, safe='')
          assert viewer in reader
          assert quote_text in reader
          js = Path('docs/pdf-reader.js').read_text()
          shared_reader = Path('docs/pdf-reader.html').read_text()
          assert "canvas.style.height='auto';" in js
          assert "canvas.style.height=Math.floor(viewport.height)+'px';" not in js
          assert '.stage canvas{display:block;max-width:100%;height:auto' in shared_reader
          assert (Path('docs') / pub_id / 'source.html').is_file()
          print('PASS: slot #1, section-9 quote, 13-page Letter aspect ratio, PDF.js reader, and LaTeX source verified.')
          PY

      - name: Remove staging and one-time workflow, then commit publication
        shell: bash
        run: |
          set -euo pipefail
          rm -rf incoming_publications/semi_ideal_computers_in_proof_fiber_geometry
          rm .github/workflows/publish_semi_ideal_proof_fiber_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Publish Semi-Ideal Computers in Proof-Fiber Geometry'
          git push
