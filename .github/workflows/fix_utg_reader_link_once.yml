name: Fix Universal Theorem Geometry reader link once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix_utg_reader_link_once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify validated publication asset
        shell: bash
        run: |
          set -euo pipefail
          CANON='cs.LO_Logic_in_Computer_Science/Universal_Theorem_Geometry_I.pdf'
          GOOD='docs/papers/universal_theorem_geometry_i_001/Universal_Theorem_Geometry_I_Validated.pdf'
          test -s "$CANON"
          test -s "$GOOD"
          cmp -s "$CANON" "$GOOD"

      - name: Retire stale PDF link from the public catalogue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old = 'papers/universal_theorem_geometry_i_001/Universal_Theorem_Geometry_I_Corrected.pdf'
          new = 'papers/universal_theorem_geometry_i_001/'
          changed = []
          for name in ('docs/index.html', 'docs/search-index.json'):
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(name)
          if 'docs/index.html' not in changed:
              raise SystemExit('stale homepage link was not found; refusing a silent no-op')
          print('updated:', ', '.join(changed))
          PY
          ! grep -Fq 'papers/universal_theorem_geometry_i_001/Universal_Theorem_Geometry_I_Corrected.pdf' docs/index.html
          grep -Fq 'papers/universal_theorem_geometry_i_001/' docs/index.html

      - name: Commit link repair and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html docs/search-index.json 2>/dev/null || true
          git rm '.github/workflows/fix_utg_reader_link_once.yml'
          git commit -m 'Route Universal Theorem Geometry I through validated reader'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
