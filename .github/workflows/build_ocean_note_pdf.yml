name: Build Ocean ATP measurement note PDF

on:
  push:
    paths:
      - '.github/workflows/build_ocean_note_pdf.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install document and PDF tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils xz-utils

      - name: Reconstruct source and create PDF
        shell: bash
        run: |
          set -euo pipefail
          name='Depth_Density_and_Objective_ATP_Measurement_in_a_Frozen_Ocean'
          outdir='cs.LO_Logic_in_Computer_Science'
          mkdir -p "$outdir"
          cat .github/ocean_note_payload/part_*.txt > "/tmp/${name}.docx.xz.b64"
          base64 -d "/tmp/${name}.docx.xz.b64" > "/tmp/${name}.docx.xz"
          xz -d "/tmp/${name}.docx.xz"
          file "/tmp/${name}.docx" | grep -F 'Microsoft Word'
          libreoffice --headless --convert-to pdf --outdir "$outdir" "/tmp/${name}.docx"
          test -s "$outdir/${name}.pdf"
          pdfinfo "$outdir/${name}.pdf" | grep -E '^Pages:[[:space:]]+[1-9][0-9]*$'
          pdftotext "$outdir/${name}.pdf" /tmp/ocean_note.txt
          grep -Fi 'DEPTH, DENSITY, AND OBJECTIVE ATP MEASUREMENT IN A FROZEN OCEAN' /tmp/ocean_note.txt
          grep -Fi 'Working research note' /tmp/ocean_note.txt

      - name: Commit PDF and remove one-time builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cs.LO_Logic_in_Computer_Science/Depth_Density_and_Objective_ATP_Measurement_in_a_Frozen_Ocean.pdf
          git rm -r .github/ocean_note_payload .github/workflows/build_ocean_note_pdf.yml
          git commit -m 'Add Ocean ATP measurement note PDF'
          git push
