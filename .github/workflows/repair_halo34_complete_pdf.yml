name: Publish exact attachment-derived Halo (3,4) PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair_halo34_complete_pdf.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF validation tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Reassemble exact edited attachment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          d = Path('.build/halo34_attachment_final')
          parts = [d / f'part{i:02d}' for i in range(5)]
          missing = [str(p) for p in parts if not p.is_file()]
          if missing:
              raise SystemExit('Missing staged attachment chunks: ' + ', '.join(missing))
          b64 = ''.join(p.read_text().strip() for p in parts)
          pdf = base64.b64decode(b64, validate=True)
          sha = hashlib.sha256(pdf).hexdigest()
          expected = 'd94c784c05c55bd326698157cf8283ba94006a766df779e4fc8bed9564f3c23d'
          if sha != expected:
              raise SystemExit(f'Attachment-derived PDF SHA256 mismatch: {sha} != {expected}')

          out = Path('Automated_Logical_Deciders_and_Conjecture_Settling/Thinking_Ahead_Without_Calling_It_Proof_Halo_34_Experiment_Guide.pdf')
          out.write_bytes(pdf)
          print('wrote exact edited attachment:', out, len(pdf), 'bytes', sha)
          PY

      - name: Validate all eight pages and requested page-one link
        shell: bash
        run: |
          PDF='Automated_Logical_Deciders_and_Conjecture_Settling/Thinking_Ahead_Without_Calling_It_Proof_Halo_34_Experiment_Guide.pdf'
          pdfinfo "$PDF" | tee /tmp/pdfinfo.txt
          test "$(awk '/^Pages:/ {print $2}' /tmp/pdfinfo.txt)" = '8'
          pdftotext "$PDF" /tmp/halo34.txt
          grep -F 'Thinking Ahead Without Calling It' /tmp/halo34.txt
          grep -F 'Prepared for Brian Tenneson' /tmp/halo34.txt
          grep -F 'Public research repository: https://btenneson.github.io/pub/' /tmp/halo34.txt
          grep -F '1. What kind of machine is this?' /tmp/halo34.txt
          grep -F '2. What does (3,4) mean?' /tmp/halo34.txt
          grep -F '3. FUTUREBANK: where imagined' /tmp/halo34.txt
          grep -F '4. Why imagination is useful - and' /tmp/halo34.txt
          grep -F '5. What the 3 actually does: change' /tmp/halo34.txt
          grep -F '6. What the experiments have actually' /tmp/halo34.txt
          grep -F '7. The whole idea in one page' /tmp/halo34.txt
          grep -F 'Page 1 of 8' /tmp/halo34.txt

      - name: Commit exact PDF from attachment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          PDF='Automated_Logical_Deciders_and_Conjecture_Settling/Thinking_Ahead_Without_Calling_It_Proof_Halo_34_Experiment_Guide.pdf'
          git add "$PDF"
          if ! git diff --cached --quiet; then
            git commit -m 'Publish exact attachment-derived 8-page Halo (3,4) guide'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'Published PDF already matches the edited attachment exactly.'
          fi
