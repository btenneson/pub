name: Compile DATA 4.2 quotient-density compass v0.1

on:
  push:
    paths:
      - '.github/workflows/build_data_4_2_pdf.yml'
      - 'cs.LO_Logic_in_Computer_Science/Proof_Compass_Theory/DATA_4_2_Quotient_Density_Compass_and_Conservative_Fallback_v0_1.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-pictures cm-super lmodern

      - name: Compile DATA 4.2 report
        run: |
          ROOT='cs.LO_Logic_in_Computer_Science/Proof_Compass_Theory'
          TEX='DATA_4_2_Quotient_Density_Compass_and_Conservative_Fallback_v0_1.tex'
          PDF='DATA_4_2_Quotient_Density_Compass_and_Conservative_Fallback_v0_1.pdf'
          cd "$ROOT"
          pdflatex -interaction=nonstopmode -halt-on-error "$TEX"
          pdflatex -interaction=nonstopmode -halt-on-error "$TEX"
          pdflatex -interaction=nonstopmode -halt-on-error "$TEX"
          test -s "$PDF"

      - name: Upload compiled PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: DATA_4_2_Quotient_Density_Compass_and_Conservative_Fallback_v0_1
          path: cs.LO_Logic_in_Computer_Science/Proof_Compass_Theory/DATA_4_2_Quotient_Density_Compass_and_Conservative_Fallback_v0_1.pdf

      - name: Commit compiled PDF
        run: |
          ROOT='cs.LO_Logic_in_Computer_Science/Proof_Compass_Theory'
          PDF='DATA_4_2_Quotient_Density_Compass_and_Conservative_Fallback_v0_1.pdf'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/$PDF"
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'Compile DATA 4.2 PDF v0.1'
            git push
          fi
