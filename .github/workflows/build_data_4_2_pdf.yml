name: Compile DATA 4.2 quotient-density compass v0.1

on:
  push:
    paths:
      - '.github/workflows/build_data_4_2_pdf.yml'
      - 'cs.LO_Logic_in_Computer_Science/Proof_Compass_Theory/DATA_4_2_Quotient_Density_Compass_and_Conservative_Fallback_v0_1.tex'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-4-2-pdf-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile DATA 4.2 report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: DATA_4_2_Quotient_Density_Compass_and_Conservative_Fallback_v0_1.tex
          working_directory: cs.LO_Logic_in_Computer_Science/Proof_Compass_Theory
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Verify compiled PDF
        run: |
          PDF='cs.LO_Logic_in_Computer_Science/Proof_Compass_Theory/DATA_4_2_Quotient_Density_Compass_and_Conservative_Fallback_v0_1.pdf'
          test -s "$PDF"
          file "$PDF"

      - name: Upload compiled PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: DATA_4_2_Quotient_Density_Compass_and_Conservative_Fallback_v0_1
          path: cs.LO_Logic_in_Computer_Science/Proof_Compass_Theory/DATA_4_2_Quotient_Density_Compass_and_Conservative_Fallback_v0_1.pdf
          if-no-files-found: error

      - name: Commit compiled PDF to main
        shell: bash
        run: |
          set -euo pipefail
          PDF='cs.LO_Logic_in_Computer_Science/Proof_Compass_Theory/DATA_4_2_Quotient_Density_Compass_and_Conservative_Fallback_v0_1.pdf'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PDF"
          if git diff --cached --quiet; then
            echo 'Compiled PDF is already current.'
            exit 0
          fi
          git commit -m 'Compile DATA 4.2 PDF v0.1'
          git pull --rebase origin main
          git push origin HEAD:main
