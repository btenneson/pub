name: Rebuild publication library homepage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/papers/**'
      - 'docs/ADS/manifest.json'
      - 'pub.experimental/**'
      - '.build/pubexp_import/**'
      - 'scripts/import_pubexp_packages.py'
      - 'scripts/build_library_homepage_v2.py'
      - 'scripts/build_library_homepage_v3.py'
      - 'scripts/sync_experimental_pages.py'
      - 'scripts/fix_experimental_page_links.py'
      - '.github/workflows/build_library_homepage.yml'

permissions:
  contents: write

concurrency:
  group: rebuild-publication-library-homepage
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Import verified experimental packages
        run: python scripts/import_pubexp_packages.py

      - name: Sync experimental wing into Pages
        run: python scripts/sync_experimental_pages.py

      - name: Build searchable homepage
        run: python scripts/build_library_homepage_v3.py

      - name: Route experimental links through Pages
        run: python scripts/fix_experimental_page_links.py

      - name: Validate generated site index
        shell: bash
        run: |
          test -s docs/index.html
          test -s docs/search-index.json
          test -s docs/pub.experimental/index.html
          python - <<'PY'
          import json
          d=json.load(open('docs/search-index.json', encoding='utf-8'))
          assert d['schema_version'] == 1
          assert d['count'] == len(d['items'])
          assert any(x['kind'] == 'Core paper' for x in d['items'])
          assert any(x['kind'] == 'Applied Data Science' for x in d['items'])
          assert any(x['kind'] == 'Experimental' for x in d['items'])
          missing=[x['title'] for x in d['items'] if x['kind']=='Core paper' and not x.get('archive_path')]
          if missing:
              raise SystemExit('Core readers missing archive PDF metadata: '+repr(missing))
          experimental=[x for x in d['items'] if x['kind']=='Experimental']
          assert all(str(x['href']).startswith('pub.experimental/') for x in experimental)
          assert all(not str(x.get('pdf') or '').startswith('https://raw.githubusercontent.com/') for x in experimental)
          hrefs=[x['href'] for x in d['items']]
          brain='pub.experimental/BRAINSTORMING-the_creativity_knobs_limits_natures_for_an_ATP.pdf'
          creativity='papers/data_atp_creativity_treatise_v0_1/'
          what_checks='papers/what_checks_the_proof_v6_80/'
          if brain in hrefs:
              assert hrefs[0] == brain
              assert hrefs[1] == creativity
              if what_checks in hrefs:
                  assert hrefs[2] == what_checks
          else:
              assert hrefs[0] == creativity
              if what_checks in hrefs:
                  assert hrefs[1] == what_checks
          print('searchable items:', d['count'])
          print('experimental items:', len(experimental))
          print('first item:', hrefs[0])
          PY

      - name: Commit generated and imported files if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} + || true
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild searchable publication library homepage'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

# The public default order is curator-ranked but intentionally unlabeled.
