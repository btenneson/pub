name: Publish Universal Theorem Geometry I in slot 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_universal_theorem_geometry_i_slot2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage Universal Theorem Geometry I under cs.LO subject folder
        shell: bash
        run: |
          set -e
          SRC='cs.LO_Logic_in_Computer_Science/Universal_Theorem_Geometry_I.pdf'
          ARCH='cs.LO_Logic_in_Computer_Science/universal_theorem_geometry_i'
          DOCS='docs/cs.LO_Logic_in_Computer_Science/universal_theorem_geometry_i'
          test -f "$SRC"
          mkdir -p "$ARCH" "$DOCS"
          cp "$SRC" "$ARCH/Universal_Theorem_Geometry_I.pdf"
          cp "$SRC" "$DOCS/Universal_Theorem_Geometry_I.pdf"

      - name: Insert Part I as card 2 and preserve current card 1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, fitz

          root = Path('.')
          archive = Path('cs.LO_Logic_in_Computer_Science/universal_theorem_geometry_i/Universal_Theorem_Geometry_I.pdf')
          docs_pdf = Path('docs/cs.LO_Logic_in_Computer_Science/universal_theorem_geometry_i/Universal_Theorem_Geometry_I.pdf')
          digest = hashlib.sha256(docs_pdf.read_bytes()).hexdigest()
          doc = fitz.open(docs_pdf)
          pages = len(doc)
          quote = 'Address proximity is not proof proximity.'
          assert quote in doc[2].get_text(), 'Authentic card quote not found on PDF page 3'

          cat = root / 'scripts/publications.json'
          data = json.loads(cat.read_text())
          pub_id = 'cs.LO_Logic_in_Computer_Science/universal_theorem_geometry_i'
          part2_id = 'cs.LO_Logic_in_Computer_Science/universal_theorem_geometry_ii_weighted_geodesics_mapquest_heuristics'

          item = {
              'title': 'Universal Theorem Geometry I — Fibered Directed Multi-Geometry for Proof Search and MAPQUEST Navigation',
              'kind': 'Core paper',
              'quote': quote,
              'quote_page': 3,
              'subject': 'cs.LO_Logic_in_Computer_Science',
              'id': pub_id,
              'href': pub_id + '/',
              'pdf': pub_id + '/Universal_Theorem_Geometry_I.pdf',
              'archive_path': str(archive),
              'sha256': digest,
              'pages': pages,
              'order': 1,
              'source': '',
              'authors': 'Brian Tenneson',
              'classification_note': 'Revision 1.1 — theorem audit. Subject classification: cs.LO — Logic in Computer Science.'
          }

          old = [x for x in data['items'] if x.get('id') != pub_id]
          found_part2 = False
          for x in old:
              if x.get('id') == part2_id:
                  x['order'] = 0
                  found_part2 = True
              elif isinstance(x.get('order'), int):
                  x['order'] += 1
          assert found_part2, 'Current #1 Universal Theorem Geometry II card not found'
          data['items'] = [x for x in old if x.get('id') == part2_id] + [item] + [x for x in old if x.get('id') != part2_id]
          cat.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          builder = root / 'scripts/build_publications_106.py'
          s = builder.read_text()
          s = s.replace('!= 107', '!= 108')
          builder.write_text(s)
          PY

      - name: Rebuild publication library and audit cards, quote, links, and PDFs
        run: |
          python -m pip install pymupdf==1.26.4
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py

      - name: Commit publication
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish Universal Theorem Geometry I as card 2'
            git push
          fi
