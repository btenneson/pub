name: Detailed PDF bounds audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detailed_pdf_bounds_audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pymupdf
      - name: Scan every indexed PDF
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import unquote
          import pymupdf
          d=json.load(open('docs/search-index.json',encoding='utf-8'))
          seen=set(); findings=[]; checked=pages=0
          for i,item in enumerate(d['items'],1):
              rel=unquote(str(item.get('archive_path') or '')).lstrip('/')
              if not rel.lower().endswith('.pdf'): continue
              p=Path(rel)
              if not p.is_file():
                  findings.append((i,item.get('title'),rel,'MISSING',''))
                  continue
              rp=str(p.resolve())
              if rp in seen: continue
              seen.add(rp); checked+=1
              try: doc=pymupdf.open(p)
              except Exception as e:
                  findings.append((i,item.get('title'),rel,'OPEN',str(e))); continue
              for n,page in enumerate(doc):
                  pages+=1; r=page.rect
                  for b in page.get_text('blocks',sort=False):
                      x0,y0,x1,y1=map(float,b[:4])
                      if x0<r.x0-4 or y0<r.y0-4 or x1>r.x1+4 or y1>r.y1+4:
                          txt=' '.join(str(b[4]).split())[:250]
                          findings.append((i,item.get('title'),rel,f'PAGE {n+1}',f'bbox={[round(x,2) for x in (x0,y0,x1,y1)]} page={[round(r.width,2),round(r.height,2)]} text={txt}'))
              doc.close()
          print('INDEXED',len(d['items']))
          print('UNIQUE_PDFS',checked)
          print('PAGES',pages)
          print('FINDINGS',len(findings))
          for f in findings: print('FINDING | '+' | '.join(map(str,f)))
          if findings: raise SystemExit(1)
          PY
