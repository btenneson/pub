name: Build semantic publication search index

on:
  push:
    branches: [main, feature/semantic-search-20261025]
    paths:
      - 'scripts/build_semantic_index.py'
      - 'docs/search-index.json'
      - 'docs/**/*.pdf'
      - '.github/workflows/semantic_search.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: semantic-search
  cancel-in-progress: false

jobs:
  embed-public-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the current publication catalog
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: '.github/workflows/semantic_search.yml'

      - name: Cache sentence embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: minilm-l6-v2-20261025

      - name: Install CPU embedding dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'sentence-transformers==5.1.2' 'pymupdf==1.26.4'

      - name: Embed public PDF passages
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python scripts/build_semantic_index.py

      - name: Validate index against public catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('docs')
          source = json.loads((root/'search-index.json').read_text())
          meta = json.loads((root/'semantic-index.json').read_text())
          assert len(meta['publications']) == len([x for x in source['items'] if x.get('visibility') != 'hidden'])
          assert all(x.get('visibility') != 'hidden' for x in source['items'])
          assert len(meta['passages']) == meta['passage_count'] > 0
          assert (root/'semantic-vectors.i8').stat().st_size == meta['passage_count'] * 384
          print('Semantic search catalog/vector validation passed.')
          PY

      - name: Commit rebuilt index to current branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/semantic-index.json docs/semantic-vectors.i8
          if ! git diff --cached --quiet; then
            source_before="$(git rev-parse HEAD:docs/search-index.json)"
            git commit -m "Build public semantic PDF passage index"
            git fetch origin "$GITHUB_REF"
            git rebase FETCH_HEAD
            source_after="$(git rev-parse HEAD:docs/search-index.json)"
            if [ "$source_before" != "$source_after" ]; then
              echo "Catalog changed while embeddings were built; rerun on the updated catalog."
              exit 1
            fi
            git push origin HEAD:"$GITHUB_REF"
          fi
