name: Publish Fundamental Round-Robin AMLD Theorem 002 in slot 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_fundamental_round_robin_amld_002_slot1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and PDF verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install pymupdf==1.26.4

      - name: Compile source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/fundamental_round_robin_amld_002
          cp incoming_publications/fundamental_round_robin_amld_settlement_002/source.tex .build/fundamental_round_robin_amld_002/source.tex
          test "$(wc -c < .build/fundamental_round_robin_amld_002/source.tex)" -ge 25000
          grep -q '\\end{document}' .build/fundamental_round_robin_amld_002/source.tex
          cd .build/fundamental_round_robin_amld_002
          for i in 1 2 3 4; do
            pdflatex -interaction=nonstopmode -halt-on-error source.tex
          done
          test -s source.pdf

      - name: Verify paper and stage publication files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz, re
          pdf = Path('.build/fundamental_round_robin_amld_002/source.pdf')
          doc = fitz.open(pdf)
          assert len(doc) == 9, f'Expected 9 pages, got {len(doc)}'
          p1 = re.sub(r'\s+', ' ', doc[0].get_text()).strip()
          assert 'Fundamental Theorem of Round-Robin AMLD Settlement' in p1
          quote = 'Thus, whenever at least one certified settlement is finitely reachable, the branch-covering round-robin AMLD eventually reaches a certified settlement.'
          assert quote in p1, 'Card quote not found on page 1'
          assert all(doc[i].get_text().strip() for i in range(len(doc))), 'Unreadable or empty PDF page'
          print('PASS: 9-page Fundamental Theorem of Round-Robin AMLD Settlement 002 compiled; title and quote verified.')
          PY
          PUB='cs.LO_Logic_in_Computer_Science/fundamental_theorem_round_robin_amld_settlement_002'
          DOCS="$PUB"
          mkdir -p "$PUB" "docs/$DOCS"
          cp .build/fundamental_round_robin_amld_002/source.pdf "$PUB/Fundamental_Theorem_of_Round_Robin_AMLD_Settlement_002.pdf"
          cp .build/fundamental_round_robin_amld_002/source.pdf "docs/$DOCS/Fundamental_Theorem_of_Round_Robin_AMLD_Settlement_002.pdf"
          cp .build/fundamental_round_robin_amld_002/source.tex "docs/$DOCS/source.tex"

      - name: Promote publication to card slot 1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, fitz

          root = Path('.')
          pub_id = 'cs.LO_Logic_in_Computer_Science/fundamental_theorem_round_robin_amld_settlement_002'
          pdf_name = 'Fundamental_Theorem_of_Round_Robin_AMLD_Settlement_002.pdf'
          archive = root / pub_id / pdf_name
          source = root / 'docs' / pub_id / 'source.tex'
          doc_pdf = root / 'docs' / pub_id / pdf_name
          assert archive.is_file() and archive.stat().st_size > 0
          assert doc_pdf.is_file() and doc_pdf.stat().st_size > 0
          assert source.is_file() and source.stat().st_size >= 25000
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == hashlib.sha256(doc_pdf.read_bytes()).hexdigest()

          doc = fitz.open(archive)
          pages = len(doc)
          assert pages == 9
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          quote = 'Thus, whenever at least one certified settlement is finitely reachable, the branch-covering round-robin AMLD eventually reaches a certified settlement.'
          card_text = (
              'This note grew by mixing generalized board games with AMLD theory. Complete AMLD states become '
              'rule-complete board positions, accepted service steps become legal moves, and certificate-backed '
              'settlement classes become exits. With round-robin nonstarvation and branch-covering search, finite '
              'settlement distance is equivalent to eventual certified settlement, while undecidability blocks a '
              'uniform computable completion clock.'
          )

          cat = root / 'scripts/publications.json'
          data = json.loads(cat.read_text())
          old = [x for x in data['items'] if x.get('id') != pub_id]
          item = {
              'title': 'Fundamental Theorem of Round-Robin AMLD Settlement — Finite-Settlement Completeness, GBG Reachability, CSG Horizons, and the No-Uniform-Deadline Boundary',
              'kind': 'Core theorem note',
              'quote': quote,
              'quote_page': 1,
              'card_text': card_text,
              'subject': 'cs.LO_Logic_in_Computer_Science',
              'id': pub_id,
              'href': pub_id + '/',
              'pdf': pub_id + '/' + pdf_name,
              'archive_path': pub_id + '/' + pdf_name,
              'sha256': digest,
              'pages': pages,
              'order': -140,
              'source': pub_id + '/source.html',
              'authors': 'Brian Tenneson',
              'source_file': pub_id + '/source.tex',
              'classification_note': (
                  'Research Note 002, September 22, 2026. Fundamental completeness theorem for fixed finite '
                  'round-robin AMLDs, synthesizing generalized-board-game reachability, exact AMLD history '
                  'compilation, cooperative settlement horizons, branch-covering fairness, optional '
                  'Omnicartographic guidance, and the no-uniform-computable-deadline boundary. '
                  'Subject classification: cs.LO — Logic in Computer Science.'
              )
          }
          data['items'] = [item] + old
          cat.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          search = json.loads((root / 'docs/search-index.json').read_text())
          old_count = int(search['count'])
          expected = old_count + (0 if any(x.get('id') == pub_id for x in search['items']) else 1)
          (root / '.build/fundamental_round_robin_amld_002/expected_count.txt').write_text(str(expected))

          wrapper = root / 'scripts/build_publications_106.py'
          s = wrapper.read_text()
          s2, n1 = re.subn(
              r'if len\(expanded\["items"\]\) != \d+:',
              f'if len(expanded["items"]) != {expected}:',
              s,
              count=1
          )
          s2, n2 = re.subn(
              r'Expected \d+ cards after restoration',
              f'Expected {expected} cards after restoration',
              s2,
              count=1
          )
          assert n1 == 1 and n2 == 1, 'Could not update expected publication count'
          wrapper.write_text(s2)
          print(f'Catalog expected count: {expected}.')
          PY

      - name: Rebuild publication site and verify slot 1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          docs = root / 'docs'
          pub_id = 'cs.LO_Logic_in_Computer_Science/fundamental_theorem_round_robin_amld_settlement_002'
          title = 'Fundamental Theorem of Round-Robin AMLD Settlement — Finite-Settlement Completeness, GBG Reachability, CSG Horizons, and the No-Uniform-Deadline Boundary'
          quote = 'Thus, whenever at least one certified settlement is finitely reachable, the branch-covering round-robin AMLD eventually reaches a certified settlement.'
          required_card_phrase = 'mixing generalized board games with AMLD theory'
          expected = int((root / '.build/fundamental_round_robin_amld_002/expected_count.txt').read_text())

          search = json.loads((docs / 'search-index.json').read_text())
          assert search['count'] == expected, search['count']
          assert search['items'][0]['id'] == pub_id, 'Fundamental AMLD theorem is not slot #1'
          assert search['items'][0]['quote'] == quote
          assert required_card_phrase in search['items'][0].get('card_text', '')

          index = (docs / 'index.html').read_text()
          first_card = index.split('<article class="card"', 1)[1].split('</article>', 1)[0]
          assert title in first_card
          assert 'generalized board games' in first_card
          assert 'AMLD theory' in first_card

          pub_docs = docs / pub_id
          assert (pub_docs / 'index.html').is_file()
          assert (pub_docs / 'source.html').is_file()
          assert (pub_docs / 'source.tex').is_file()
          assert (pub_docs / 'Fundamental_Theorem_of_Round_Robin_AMLD_Settlement_002.pdf').is_file()
          reader = (pub_docs / 'index.html').read_text()
          assert '/pub/pdf-reader.html?file=' in reader
          assert 'Fundamental_Theorem_of_Round_Robin_AMLD_Settlement_002.pdf' in reader
          assert 'Source' in reader
          print('PASS: Fundamental Round-Robin AMLD Theorem 002 is slot #1 with requested GBG/AMLD card text, reader, PDF, and source.')
          PY

      - name: Remove one-time staging payload
        run: rm -rf incoming_publications/fundamental_round_robin_amld_settlement_002

      - name: Commit verified publication and rebuilt library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish Fundamental Round-Robin AMLD Theorem 002 as card 1 [skip ci]'
            git push
          fi
