name: Publish X0 X1 X2 self-awareness articles in slots 1 2 3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_x_self_awareness_slots_1_3.yml'
      - 'scripts/publish_x_self_awareness_slots_1_3.py'
      - 'incoming_publications/x_self_awareness_20261031/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-x-self-awareness-three-slots
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LaTeX and PDF audit tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science texlive-pictures lmodern poppler-utils
          python -m pip install pymupdf==1.26.4
      - name: Compile and verify three separate articles, then build the slots
        run: python scripts/publish_x_self_awareness_slots_1_3.py
      - name: Commit separate PDFs and updated library cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/publications.json docs
          if ! git diff --cached --quiet; then
            git commit -m 'Publish X0 X1 X2 separately as cards 1-3 and shift existing cards [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No catalog or publication changes to commit.'
          fi