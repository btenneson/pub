name: Publish Universal Proof Horizon v1.1 in slot 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_universal_proof_horizon_v1_1_slot1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install pymupdf==1.26.4 selenium

      - name: Reconstruct source and compile canonical PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/uph
          base64 -d incoming_publications/universal_proof_horizon_v1_1/source.tex.gz.b64 | gzip -d > .build/uph/Universal_Proof_Horizon_Tenneson_v1_1.tex
          test "$(wc -c < .build/uph/Universal_Proof_Horizon_Tenneson_v1_1.tex)" -eq 58925
          grep -q '\\end{document}' .build/uph/Universal_Proof_Horizon_Tenneson_v1_1.tex
          cd .build/uph
          pdflatex -interaction=nonstopmode -halt-on-error Universal_Proof_Horizon_Tenneson_v1_1.tex
          pdflatex -interaction=nonstopmode -halt-on-error Universal_Proof_Horizon_Tenneson_v1_1.tex
          test -s Universal_Proof_Horizon_Tenneson_v1_1.pdf
          zip -q Universal_Proof_Horizon_Tenneson_v1_1_source.zip Universal_Proof_Horizon_Tenneson_v1_1.tex

      - name: Stage publication files
        shell: bash
        run: |
          set -euo pipefail
          PUB='cs.LO_Logic_in_Computer_Science/universal_proof_horizon_tenneson_v1_1'
          DOCS='docs/cs.LO_Logic_in_Computer_Science/universal_proof_horizon_tenneson_v1_1'
          mkdir -p "$PUB" "$DOCS"
          cp .build/uph/Universal_Proof_Horizon_Tenneson_v1_1.pdf "$PUB/Universal_Proof_Horizon_Tenneson_v1_1.pdf"
          cp .build/uph/Universal_Proof_Horizon_Tenneson_v1_1.pdf "$DOCS/Universal_Proof_Horizon_Tenneson_v1_1.pdf"
          cp .build/uph/Universal_Proof_Horizon_Tenneson_v1_1.tex "$DOCS/source.tex"
          cp .build/uph/Universal_Proof_Horizon_Tenneson_v1_1_source.zip "$DOCS/Universal_Proof_Horizon_Tenneson_v1_1_source.zip"

      - name: Teach builders about source packages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for p in [Path('scripts/build_publications.py'), Path('scripts/build_publications_106.py')]:
              if not p.exists():
                  continue
              s = p.read_text()
              if "source_package" not in s:
                  needle = "if x.get('source'):result+='<a href=\"'+url(x['source'])+'\">Source</a>'"
                  repl = "if x.get('source'):result+='<a href=\"'+url(x['source'])+'\">Source</a>'\n if x.get('source_package'):result+='<a href=\"'+url(x['source_package'])+'\" download>Download Source ZIP</a>'"
                  s = s.replace(needle, repl)
              s = __import__('re').sub(r'if len\(expanded\["items"\]\) != \d+:', 'if len(expanded["items"]) != 109:', s)
              p.write_text(s)
          PY

      - name: Insert as publication card 1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, fitz
          root = Path('.')
          pub_id = 'cs.LO_Logic_in_Computer_Science/universal_proof_horizon_tenneson_v1_1'
          pdf_name = 'Universal_Proof_Horizon_Tenneson_v1_1.pdf'
          pdf = root / pub_id / pdf_name
          doc_pdf = root / 'docs' / pub_id / pdf_name
          tex = root / 'docs' / pub_id / 'source.tex'
          source_zip = root / 'docs' / pub_id / 'Universal_Proof_Horizon_Tenneson_v1_1_source.zip'
          assert pdf.is_file() and doc_pdf.is_file() and tex.is_file() and source_zip.is_file()
          assert hashlib.sha256(pdf.read_bytes()).hexdigest() == hashlib.sha256(doc_pdf.read_bytes()).hexdigest()
          digest = hashlib.sha256(pdf.read_bytes()).hexdigest()
          tex_digest = hashlib.sha256(tex.read_bytes()).hexdigest()
          zip_digest = hashlib.sha256(source_zip.read_bytes()).hexdigest()
          doc = fitz.open(pdf)
          pages = len(doc)
          assert pages == 39, f'Expected 39 pages, got {pages}'
          page1 = re.sub(r'\s+', ' ', doc[0].get_text()).strip()
          page4 = re.sub(r'\s+', ' ', doc[3].get_text()).strip()
          assert 'The Universal Proof-Horizon Operator' in page1
          quote = 'proof recovery is universal on theorems, while termination on non-theorems is not guaranteed.'
          assert quote in page4

          cat = root / 'scripts/publications.json'
          data = json.loads(cat.read_text())
          old = [x for x in data['items'] if x.get('id') != pub_id]
          for x in old:
              if isinstance(x.get('order'), int):
                  x['order'] += 1
          item = {
              'title': 'The Universal Proof-Horizon Operator: From MIU and the nth Well-Formed Formula to ZFC, Predator, and Automated Logical Deciders',
              'kind': 'Core paper',
              'quote': quote,
              'quote_page': 4,
              'subject': 'cs.LO_Logic_in_Computer_Science',
              'id': pub_id,
              'href': pub_id + '/',
              'pdf': pub_id + '/' + pdf_name,
              'archive_path': pub_id + '/' + pdf_name,
              'sha256': digest,
              'sha256_tex': tex_digest,
              'sha256_source_package': zip_digest,
              'pages': pages,
              'order': 0,
              'source': pub_id + '/source.html',
              'source_file': pub_id + '/source.tex',
              'source_package': pub_id + '/Universal_Proof_Horizon_Tenneson_v1_1_source.zip',
              'authors': 'Brian Tenneson',
              'classification_note': 'Subject classification: cs.LO — Logic in Computer Science.'
          }
          data['items'] = [item] + old
          cat.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Rebuild catalog and verify reader link
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py
          python - <<'PY'
          from pathlib import Path
          import json
          from urllib.parse import quote
          pub_id = 'cs.LO_Logic_in_Computer_Science/universal_proof_horizon_tenneson_v1_1'
          pdf_path = '/pub/' + pub_id + '/Universal_Proof_Horizon_Tenneson_v1_1.pdf'
          reader = Path('docs') / pub_id / 'index.html'
          html = reader.read_text()
          expected = '/pub/pdf-reader.html?file=' + quote(pdf_path, safe='')
          assert expected in html, 'Reader page does not point to shared PDF.js reader'
          assert 'Download PDF' in html
          assert 'Download Source ZIP' in html
          index = Path('docs/index.html').read_text()
          first_card = index.split('<article class="card"', 1)[1].split('</article>', 1)[0]
          assert 'The Universal Proof-Horizon Operator' in first_card, 'UPH is not publication slot #1'
          assert 'Download Source ZIP' in first_card, 'Source ZIP link missing from slot #1 card'
          search = json.loads(Path('docs/search-index.json').read_text())
          assert search['count'] == 109, search['count']
          assert search['items'][0]['id'] == pub_id
          print('PASS: Universal Proof Horizon is slot #1, catalog count is 109, reader/source links verified.')
          PY

      - name: Browser smoke test reader
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          CHROMEDRIVER="$(command -v chromedriver || true)"
          test -n "$CHROME"
          test -n "$CHROMEDRIVER"
          rm -rf .reader-test
          mkdir -p .reader-test
          ln -s "$GITHUB_WORKSPACE/docs" .reader-test/pub
          python -m http.server 8765 --directory .reader-test >/tmp/reader-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          export CHROME CHROMEDRIVER
          python - <<'PY'
          import os
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          url = ('http://127.0.0.1:8765/pub/pdf-reader.html?file='
                 '%2Fpub%2Fcs.LO_Logic_in_Computer_Science%2Funiversal_proof_horizon_tenneson_v1_1%2F'
                 'Universal_Proof_Horizon_Tenneson_v1_1.pdf')
          opts = Options()
          opts.binary_location = os.environ['CHROME']
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--disable-dev-shm-usage')
          driver = webdriver.Chrome(service=Service(os.environ['CHROMEDRIVER']), options=opts)
          try:
              driver.get(url)
              WebDriverWait(driver, 25).until(lambda d: d.find_element(By.ID, 'pageInfo').text == 'Page 1 of 39')
              canvas = driver.find_element(By.ID, 'page')
              w = driver.execute_script('return arguments[0].width', canvas)
              h = driver.execute_script('return arguments[0].height', canvas)
              assert w > 0 and h > 0
              print(f'PASS: PDF.js rendered UPH page 1 of 39; canvas={w}x{h}.')
          finally:
              driver.quit()
          PY

      - name: Remove one-time staging payload
        run: rm -rf incoming_publications/universal_proof_horizon_v1_1

      - name: Commit Universal Proof Horizon publication
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish Universal Proof Horizon v1.1 as card 1'
            git push
          fi
