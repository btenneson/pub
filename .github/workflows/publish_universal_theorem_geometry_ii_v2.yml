name: Publish Universal Theorem Geometry II v2

on:
  push:
    branches: [main]
    paths:
      - '.build/utg2v2/source.b64.part4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stop cleanly after payload cleanup
        shell: bash
        run: |
          if [ ! -f .build/utg2v2/source.b64.part4 ]; then
            echo "Payload already consumed; nothing to publish."
            exit 0
          fi

      - name: Reconstruct LaTeX source
        shell: bash
        run: |
          mkdir -p docs/cs.LO_Logic_in_Computer_Science/universal_theorem_geometry_ii_weighted_geodesics_mapquest_heuristics
          cat .build/utg2v2/source.b64.part1 \
              .build/utg2v2/source.b64.part2 \
              .build/utg2v2/source.b64.part3 \
              .build/utg2v2/source.b64.part4 \
            | base64 --decode | gunzip \
            > docs/cs.LO_Logic_in_Computer_Science/universal_theorem_geometry_ii_weighted_geodesics_mapquest_heuristics/source.tex

      - name: Install LaTeX and PDF audit dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
          python -m pip install pymupdf==1.26.4

      - name: Compile theorem-audited PDF
        shell: bash
        run: |
          set -e
          FOLDER=docs/cs.LO_Logic_in_Computer_Science/universal_theorem_geometry_ii_weighted_geodesics_mapquest_heuristics
          cd "$FOLDER"
          pdflatex -interaction=nonstopmode -halt-on-error -jobname=Universal_Theorem_Geometry_II_Weighted_Geodesics_MAPQUEST_Heuristics_v2 source.tex
          pdflatex -interaction=nonstopmode -halt-on-error -jobname=Universal_Theorem_Geometry_II_Weighted_Geodesics_MAPQUEST_Heuristics_v2 source.tex
          rm -f *.aux *.log *.out *.toc

      - name: Put Part II in publication slot 1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, fitz, re

          root = Path('.')
          folder = Path('docs/cs.LO_Logic_in_Computer_Science/universal_theorem_geometry_ii_weighted_geodesics_mapquest_heuristics')
          pdf_name = 'Universal_Theorem_Geometry_II_Weighted_Geodesics_MAPQUEST_Heuristics_v2.pdf'
          pdf = folder / pdf_name
          digest = hashlib.sha256(pdf.read_bytes()).hexdigest()
          pages = len(fitz.open(pdf))

          cat = root / 'scripts/publications.json'
          data = json.loads(cat.read_text())
          pub_id = 'cs.LO_Logic_in_Computer_Science/universal_theorem_geometry_ii_weighted_geodesics_mapquest_heuristics'

          item = {
              'title': 'Universal Theorem Geometry II — Weighted Geodesics, Heuristic Calibration, and MAPQUEST Navigation',
              'kind': 'Core paper',
              'quote': 'A map coordinate does not determine road length.',
              'quote_page': 4,
              'subject': 'cs.LO_Logic_in_Computer_Science',
              'id': pub_id,
              'href': pub_id + '/',
              'pdf': pub_id + '/' + pdf_name,
              'archive_path': pub_id + '/' + pdf_name,
              'sha256': digest,
              'pages': pages,
              'order': 0,
              'source': pub_id + '/source.html',
              'authors': 'Brian Tenneson',
              'source_file': pub_id + '/source.tex',
              'classification_note': 'Theorem-audited Version 2.0. Subject classification: cs.LO — Logic in Computer Science.'
          }

          old = [x for x in data['items'] if x.get('id') != pub_id]
          for x in old:
              if isinstance(x.get('order'), int):
                  x['order'] += 1
          data['items'] = [item] + old
          cat.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          builder = root / 'scripts/build_publications_106.py'
          s = builder.read_text()
          s = s.replace('!= 106', '!= 107').replace('got {len(expanded[\"items\"])}', 'got {len(expanded[\"items\"])}')
          builder.write_text(s)
          PY

      - name: Rebuild publication library and verify quote/card links
        run: |
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py

      - name: Remove one-shot payload and commit publication
        shell: bash
        run: |
          rm -rf .build/utg2v2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Publish Universal Theorem Geometry II v2 in slot 1"
            git push
          fi
