name: Decode DATA 2.0 SAT paper

on:
  push:
    paths:
      - '.github/workflows/decode_data20_sat.yml'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and validate PDF
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ghostscript poppler-utils
          cat \
            .upload/data20sat/part_00 \
            .upload/data20sat/part_01 \
            .upload/data20sat/part_02 \
            .upload/data20sat/part_03 \
            .upload/data20sat/part_04 \
            .upload/data20sat/part_05 \
            .upload/data20sat/part_06_00 \
            | base64 --decode --ignore-garbage > /tmp/sat.pdf
          test "$(pdfinfo /tmp/sat.pdf | awk '/^Pages:/ {print $2}')" = "2"
          mkdir -p 'math.AC — Commutative Algebra'
          gs -q -dNOPAUSE -dBATCH -sDEVICE=pdfwrite \
             -sOutputFile='math.AC — Commutative Algebra/Solving_SAT_in_polynomial_time_-_Brian_Tenneson.pdf' \
             /tmp/sat.pdf
          test "$(pdfinfo 'math.AC — Commutative Algebra/Solving_SAT_in_polynomial_time_-_Brian_Tenneson.pdf' | awk '/^Pages:/ {print $2}')" = "2"
          git rm -r .upload/data20sat

      - name: Commit classified PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'math.AC — Commutative Algebra/Solving_SAT_in_polynomial_time_-_Brian_Tenneson.pdf'
          git commit -m 'Add SAT Gröbner-basis paper under commutative algebra'
          git push
