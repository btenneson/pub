name: Compile Proof Navigation by Rational Address

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.build/proof_navigation_by_rational_address/source.tex.bz2.b64'
      - '.github/workflows/compile_proof_navigation_by_rational_address.yml'

permissions:
  contents: write

concurrency:
  group: compile-proof-navigation-by-rational-address
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore LaTeX source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, bz2
          staged = Path('.build/proof_navigation_by_rational_address/source.tex.bz2.b64')
          source = Path('documents and their sources/Proof_Navigation_by_Rational_Address_001.tex')
          source.parent.mkdir(parents=True, exist_ok=True)
          source.write_bytes(bz2.decompress(base64.b64decode(staged.read_text(encoding='utf-8').strip())))
          print('restored', source, source.stat().st_size, 'bytes')
          PY

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern cm-super

      - name: Compile monograph
        shell: bash
        run: |
          SOURCE='documents and their sources/Proof_Navigation_by_Rational_Address_001.tex'
          mkdir -p build/proof-navigation
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build/proof-navigation "$SOURCE"
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build/proof-navigation "$SOURCE"
          test -s build/proof-navigation/Proof_Navigation_by_Rational_Address_001.pdf

      - name: Publish archive and reader
        shell: bash
        run: |
          ARCHIVE='cs.LO_Logic_in_Computer_Science/Proof_Navigation_by_Rational_Address_001.pdf'
          READER='docs/papers/proof_navigation_by_rational_address'
          mkdir -p "$(dirname "$ARCHIVE")" "$READER"
          cp build/proof-navigation/Proof_Navigation_by_Rational_Address_001.pdf "$ARCHIVE"
          cp "$ARCHIVE" "$READER/Proof_Navigation_by_Rational_Address_001.pdf"
          cp 'documents and their sources/Proof_Navigation_by_Rational_Address_001.tex' "$READER/Proof_Navigation_by_Rational_Address_001.tex"
          cat > "$READER/index.html" <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proof Navigation by Rational Address</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f5f5;color:#111}header{padding:18px 24px;background:white;border-bottom:1px solid #ddd}h1{margin:0 0 6px;font-size:1.4rem}.links a{margin-right:18px}iframe{display:block;width:100%;height:calc(100vh - 105px);border:0;background:white}</style></head><body><header><h1>Proof Navigation by Rational Address</h1><div>Brian Tenneson · September 6, 2026</div><div class="links"><a href="Proof_Navigation_by_Rational_Address_001.pdf">Open PDF</a><a href="Proof_Navigation_by_Rational_Address_001.tex">LaTeX source</a></div></header><iframe src="Proof_Navigation_by_Rational_Address_001.pdf" title="Proof Navigation by Rational Address"></iframe></body></html>
          HTML

      - name: Commit publication files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'documents and their sources/Proof_Navigation_by_Rational_Address_001.tex' \
                  'cs.LO_Logic_in_Computer_Science/Proof_Navigation_by_Rational_Address_001.pdf' \
                  'docs/papers/proof_navigation_by_rational_address/'
          if git diff --cached --quiet; then
            echo 'No publication changes to commit.'
          else
            git commit -m 'Publish Proof Navigation by Rational Address [skip ci]'
            git push
          fi
