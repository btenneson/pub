name: Reconstruct and file multi-dose PDF

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconstruct-drug-pdf.yml

permissions:
  contents: write

jobs:
  file-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct, verify, and cross-list PDF
        shell: bash
        run: |
          git fetch origin agent/drug-pdf-transport
          mkdir -p /tmp/drug-pdf
          for i in $(seq -w 0 11); do
            git show origin/agent/drug-pdf-transport:.tmp_drug_pdf/part${i}.b64 >> /tmp/drug-pdf/all.b64
          done
          tr -d '\n' < /tmp/drug-pdf/all.b64 | base64 --decode > /tmp/drug-pdf/Multi-Dose_Concentration_Derivation_v2.pdf
          test "$(wc -c < /tmp/drug-pdf/Multi-Dose_Concentration_Derivation_v2.pdf)" -eq 107603
          echo "4c39102a27608869abe31f2bb5b19610b1b6f95a6c1e4576b628eff37b10ada2  /tmp/drug-pdf/Multi-Dose_Concentration_Derivation_v2.pdf" | sha256sum -c -
          mkdir -p q-bio.QM_Quantitative_Methods math.CA_Classical_Analysis_and_ODEs physics.med-ph_Medical_Physics
          cp /tmp/drug-pdf/Multi-Dose_Concentration_Derivation_v2.pdf q-bio.QM_Quantitative_Methods/Multi-Dose_Concentration_Derivation_v2.pdf
          cp /tmp/drug-pdf/Multi-Dose_Concentration_Derivation_v2.pdf math.CA_Classical_Analysis_and_ODEs/Multi-Dose_Concentration_Derivation_v2.pdf
          cp /tmp/drug-pdf/Multi-Dose_Concentration_Derivation_v2.pdf physics.med-ph_Medical_Physics/Multi-Dose_Concentration_Derivation_v2.pdf
          rm .github/workflows/reconstruct-drug-pdf.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add q-bio.QM_Quantitative_Methods math.CA_Classical_Analysis_and_ODEs physics.med-ph_Medical_Physics .github/workflows/reconstruct-drug-pdf.yml
          git commit -m "Add multi-dose concentration derivation"
          git push
