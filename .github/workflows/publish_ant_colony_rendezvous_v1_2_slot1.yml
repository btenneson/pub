name: Publish Ant-Colony Rendezvous v1.2 in slot 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_ant_colony_rendezvous_v1_2_slot1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify Ant-Colony Rendezvous v1.2
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern zip >/dev/null
          python -m pip install -q pymupdf==1.26.4

          BUILD='.build/ant_colony_rendezvous_v1_2'
          STAGE='incoming_publications/ant_colony_rendezvous_v1_2'
          mkdir -p "$BUILD"
          cat "$STAGE"/source.part_00 "$STAGE"/source.part_01 "$STAGE"/source.part_02 "$STAGE"/source.part_03 "$STAGE"/source.part_04 "$STAGE"/source.part_05 "$STAGE"/source.part_06 "$STAGE"/source.part_07 > "$BUILD/source.b64"
          test "$(wc -c < "$BUILD/source.b64")" -eq 56308
          test "$(sha256sum "$BUILD/source.b64" | awk '{print $1}')" = "18a61d17c021b53191ea90667f8575c19c195a780b78d159ae538cf63b149f2d"
          base64 -d "$BUILD/source.b64" > "$BUILD/source.tex"
          test "$(wc -c < "$BUILD/source.tex")" -eq 42229
          test "$(sha256sum "$BUILD/source.tex" | awk '{print $1}')" = "a3b2351e5aec1f89c2edcbe31ddb64a4ebf147d8776d4183d585426c9e31bef1"

          cd "$BUILD"
          for i in 1 2 3; do pdflatex -interaction=nonstopmode -halt-on-error source.tex >/dev/null; done
          cd ../..

          python - <<'PY'
          from pathlib import Path
          import fitz, re, unicodedata
          p=Path('.build/ant_colony_rendezvous_v1_2/source.pdf')
          d=fitz.open(p)
          assert len(d)==17, len(d)
          def norm(s):
              return re.sub(r"\s+", " ", unicodedata.normalize("NFKC", s or "")).strip().replace("- ", "")
          quote=("One of the strategies that inspired this paper is to imagine scout ants surrounding "
                 "the winning territory, then taking on proof obligations and effectively retreating from it "
                 "until they rendezvous with a forward probe. At rendezvous, the scouts’ certified route can "
                 "guide the forward proof through the remaining territory and toward the win.")
          assert norm(quote) in norm(d[2].get_text()), d[2].get_text()
          alltext=' '.join(page.get_text() for page in d)
          for s in [
              'Scout-Ant Rendezvous Theorem',
              'Collective-BANK Rendezvous Theorem',
              'Proof-Consistent Rendezvous Lemma',
              'Quotient bridge pruning',
              'Parallel colony rendezvous bound'
          ]:
              assert s in alltext, s
          PY

          PUB='cs.LO_Logic_in_Computer_Science/ant_colony_rendezvous_verifier_bidirectional_proof_search_v1_2'
          PDF='Ant_Colony_Rendezvous_Verifier_Bidirectional_Proof_Search_v1_2.pdf'
          ZIP='Ant_Colony_Rendezvous_Verifier_Bidirectional_Proof_Search_v1_2_Source_and_PDF.zip'
          mkdir -p "$PUB" "docs/$PUB"
          cp "$BUILD/source.pdf" "$PUB/$PDF"
          cp "$BUILD/source.pdf" "docs/$PUB/$PDF"
          cp "$BUILD/source.tex" "docs/$PUB/source.tex"
          cp "$BUILD/source.pdf" "$BUILD/$PDF"
          (cd "$BUILD" && zip -X -q "$ZIP" source.tex "$PDF")
          cp "$BUILD/$ZIP" "docs/$PUB/$ZIP"

      - name: Put publication in slot 1 and rebuild catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz, hashlib, json, re
          root=Path('.')
          pub_id='cs.LO_Logic_in_Computer_Science/ant_colony_rendezvous_verifier_bidirectional_proof_search_v1_2'
          pdf_name='Ant_Colony_Rendezvous_Verifier_Bidirectional_Proof_Search_v1_2.pdf'
          zip_name='Ant_Colony_Rendezvous_Verifier_Bidirectional_Proof_Search_v1_2_Source_and_PDF.zip'
          pdf=root/pub_id/pdf_name
          source=root/'docs'/pub_id/'source.tex'
          source_package=root/'docs'/pub_id/zip_name
          pages=len(fitz.open(pdf))
          assert pages == 17
          digest=hashlib.sha256(pdf.read_bytes()).hexdigest()
          source_digest=hashlib.sha256(source.read_bytes()).hexdigest()
          zip_digest=hashlib.sha256(source_package.read_bytes()).hexdigest()

          quote=("One of the strategies that inspired this paper is to imagine scout ants surrounding "
                 "the winning territory, then taking on proof obligations and effectively retreating from it "
                 "until they rendezvous with a forward probe. At rendezvous, the scouts’ certified route can "
                 "guide the forward proof through the remaining territory and toward the win.")

          cat=root/'scripts/publications.json'
          data=json.loads(cat.read_text())
          existed=any(x.get('id')==pub_id for x in data['items'])
          old=[x for x in data['items'] if x.get('id')!=pub_id]
          orders=[x.get('order') for x in old if isinstance(x.get('order'),(int,float))]
          order=min(orders)-10 if orders else -10
          item={
            'title':'Ant-Colony Rendezvous for Verifier-Backed Bidirectional Proof Search',
            'kind':'Core paper',
            'quote':quote,
            'quote_page':3,
            'card_text':(
              'A verifier-backed bidirectional proof-search architecture in which a forward colony grows '
              'certified proof states while backward scout ants regress the target into finite open-obligation '
              'sets with certified suffixes. Exact rendezvous is detected by obligation containment, '
              'near-rendezvous becomes a bridge-distance problem, collective BANK provenance allows different '
              'forward agents to jointly satisfy a backward frontier, and ACO influences search allocation '
              'without affecting proof acceptance. Final audited Version 1.2 distinguishes heuristic navigation '
              'from certified bounds, repairs scheduler and pruning conditions, and gives an experimental '
              'protocol that isolates what rendezvous-aware ACO contributes beyond bidirectional search itself.'
            ),
            'status':(
              'FINAL ATLAS-AUDITED WORKING THEOREM EDITION — Version 1.2. '
              'The scout-ant winning-territory strategy is stated explicitly in the introduction.'
            ),
            'subject':'cs.LO_Logic_in_Computer_Science',
            'id':pub_id,
            'href':pub_id+'/',
            'pdf':pub_id+'/'+pdf_name,
            'archive_path':pub_id+'/'+pdf_name,
            'sha256':digest,
            'sha256_tex':source_digest,
            'sha256_source_package':zip_digest,
            'pages':pages,
            'order':order,
            'source':pub_id+'/source.html',
            'source_file':pub_id+'/source.tex',
            'source_package':pub_id+'/'+zip_name,
            'authors':'Brian Tenneson',
            'classification_note':(
              'Core paper, September 2026. Final Atlas-audited Version 1.2 of the verifier-backed ant-colony '
              'rendezvous framework for bidirectional proof search, including certified regression, exact and '
              'collective-BANK rendezvous, bridge geometry, ACO scheduling, proof-cost bounds, and a controlled '
              'experimental protocol. Subject classification: cs.LO — Logic in Computer Science.'
            )
          }
          data['items']=[item]+old
          cat.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          search=json.loads((root/'docs/search-index.json').read_text())
          expected=int(search['count']) if existed else int(search['count'])+1
          wrapper=root/'scripts/build_publications_106.py'
          w=wrapper.read_text()
          w,n1=re.subn(r'if len\(expanded\["items"\]\) != \d+:',
                       f'if len(expanded["items"]) != {expected}:',w,count=1)
          w,n2=re.subn(r'Expected \d+ cards after restoration',
                       f'Expected {expected} cards after restoration',w,count=1)
          assert n1==1 and n2==1, (n1,n2)
          wrapper.write_text(w)
          (root/'.build/ant_colony_rendezvous_v1_2/expected.txt').write_text(str(expected))
          print('slot order',order,'expected',expected)
          PY

          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py

          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          pub_id='cs.LO_Logic_in_Computer_Science/ant_colony_rendezvous_verifier_bidirectional_proof_search_v1_2'
          s=json.loads((root/'docs/search-index.json').read_text())
          expected=int((root/'.build/ant_colony_rendezvous_v1_2/expected.txt').read_text())
          quote=("One of the strategies that inspired this paper is to imagine scout ants surrounding "
                 "the winning territory, then taking on proof obligations and effectively retreating from it "
                 "until they rendezvous with a forward probe. At rendezvous, the scouts’ certified route can "
                 "guide the forward proof through the remaining territory and toward the win.")
          assert s['count']==expected
          assert s['items'][0]['id']==pub_id
          assert s['items'][0]['pages']==17
          assert s['items'][0]['quote']==quote
          assert s['items'][0]['quote_page']==3
          for f in [
            f'docs/{pub_id}/index.html',
            f'docs/{pub_id}/source.html',
            f'docs/{pub_id}/source.tex',
            f'docs/{pub_id}/Ant_Colony_Rendezvous_Verifier_Bidirectional_Proof_Search_v1_2.pdf',
            f'docs/{pub_id}/Ant_Colony_Rendezvous_Verifier_Bidirectional_Proof_Search_v1_2_Source_and_PDF.zip'
          ]:
              assert (root/f).is_file(), f
          page=(root/'docs'/pub_id/'index.html').read_text()
          assert quote in page
          PY

          rm -rf incoming_publications/ant_colony_rendezvous_v1_2 .build/ant_colony_rendezvous_v1_2

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m 'Publish Ant-Colony Rendezvous v1.2 as card 1 [skip ci]'
          git push
