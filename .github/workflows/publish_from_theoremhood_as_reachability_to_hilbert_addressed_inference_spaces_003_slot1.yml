name: Publish From Theoremhood as Reachability to Hilbert-Addressed Inference Spaces in slot 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_from_theoremhood_as_reachability_to_hilbert_addressed_inference_spaces_003_slot1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and PDF verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-pictures lmodern
          python -m pip install pymupdf==1.26.4

      - name: Compile source
        shell: bash
        run: |
          set -euo pipefail
          BUILD='.build/from_theoremhood_as_reachability_to_hilbert_addressed_inference_spaces_003'
          mkdir -p "$BUILD"
          cp incoming_publications/from_theoremhood_as_reachability_to_hilbert_addressed_inference_spaces_003/source.tex "$BUILD/source.tex"
          test "$(wc -c < "$BUILD/source.tex")" -ge 50000
          grep -q '\\end{document}' "$BUILD/source.tex"
          cd "$BUILD"
          for i in 1 2 3 4; do
            pdflatex -interaction=nonstopmode -halt-on-error source.tex
          done
          test -s source.pdf

      - name: Verify paper and stage publication files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz, re
          pdf = Path('.build/from_theoremhood_as_reachability_to_hilbert_addressed_inference_spaces_003/source.pdf')
          doc = fitz.open(pdf)
          assert len(doc) == 20, f'Expected 20 pages, got {len(doc)}'
          p1 = re.sub(r'\s+', ' ', doc[0].get_text()).strip()
          plast = re.sub(r'\s+', ' ', doc[-1].get_text()).strip()
          assert 'From Theoremhood as Reachability to Hilbert-Addressed Inference Spaces' in p1
          assert 'Draft 0.2' in p1
          assert 'Haverkort' in plast
          assert all(doc[i].get_text().strip() for i in range(len(doc))), 'Unreadable or empty PDF page'
          print('PASS: 20-page From Theoremhood as Reachability to Hilbert-Addressed Inference Spaces compiled and verified.')
          PY
          PUB='cs.LO_Logic_in_Computer_Science/from_theoremhood_as_reachability_to_hilbert_addressed_inference_spaces_003'
          mkdir -p "$PUB" "docs/$PUB"
          cp .build/from_theoremhood_as_reachability_to_hilbert_addressed_inference_spaces_003/source.pdf "$PUB/From_Theoremhood_as_Reachability_to_Hilbert_Addressed_Inference_Spaces_003.pdf"
          cp .build/from_theoremhood_as_reachability_to_hilbert_addressed_inference_spaces_003/source.pdf "docs/$PUB/From_Theoremhood_as_Reachability_to_Hilbert_Addressed_Inference_Spaces_003.pdf"
          cp .build/from_theoremhood_as_reachability_to_hilbert_addressed_inference_spaces_003/source.tex "docs/$PUB/source.tex"

      - name: Promote publication to card slot 1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, fitz

          root = Path('.')
          pub_id = 'cs.LO_Logic_in_Computer_Science/from_theoremhood_as_reachability_to_hilbert_addressed_inference_spaces_003'
          pdf_name = 'From_Theoremhood_as_Reachability_to_Hilbert_Addressed_Inference_Spaces_003.pdf'
          archive = root / pub_id / pdf_name
          source = root / 'docs' / pub_id / 'source.tex'
          doc_pdf = root / 'docs' / pub_id / pdf_name
          assert archive.is_file() and archive.stat().st_size > 0
          assert doc_pdf.is_file() and doc_pdf.stat().st_size > 0
          assert source.is_file() and source.stat().st_size >= 50000
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == hashlib.sha256(doc_pdf.read_bytes()).hexdigest()

          doc = fitz.open(archive)
          pages = len(doc)
          assert pages == 20
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          quote = ('The resulting architecture separates identity, machine-level attemptability, formal legality, '
                   'navigation, verification, and execution while showing precisely how geometric navigation can '
                   'become an operational tool in ATP.')
          card_text = (
              'A September 2026 synthesis using xyz formal systems and generalized board games as the common thread '
              'from theoremhood-as-reachability to ATP search-state lifting and Hilbert-addressed inference spaces. '
              'It develops target winning regions, proof-horizon-preserving Hilbert breadth-first scheduling, '
              'future-complete operational-state transpositions, finite action fibers, and synchronized 2D-to-dD '
              'Hilbert atlases while keeping navigation separate from formal legality and verification.'
          )

          cat = root / 'scripts/publications.json'
          data = json.loads(cat.read_text())
          old = [x for x in data['items'] if x.get('id') != pub_id]
          item = {
              'title': 'From Theoremhood as Reachability to Hilbert-Addressed Inference Spaces',
              'kind': 'Research synthesis and theorem-proving architecture',
              'quote': quote,
              'quote_page': 1,
              'card_text': card_text,
              'subject': 'cs.LO_Logic_in_Computer_Science',
              'id': pub_id,
              'href': pub_id + '/',
              'pdf': pub_id + '/' + pdf_name,
              'archive_path': pub_id + '/' + pdf_name,
              'sha256': digest,
              'pages': pages,
              'order': -160,
              'source': pub_id + '/source.html',
              'authors': 'Brian Tenneson',
              'source_file': pub_id + '/source.tex',
              'classification_note': (
                  'Draft 0.2, September 24, 2026. Unified xyz/GBG/ATP/Hilbert synthesis: theoremhood as finite '
                  'reachability, complete ATP search-state lifting, target winning regions, represented-system '
                  'provability, Hilbert-addressed candidate-action fibers, proof-horizon-preserving HBF navigation, '
                  'transposition quotienting, exact and bucketed finite coverage, and synchronized 2D-to-dD Hilbert '
                  'atlas construction. Subject classification: cs.LO — Logic in Computer Science.'
              )
          }
          data['items'] = [item] + old
          cat.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          search = json.loads((root / 'docs/search-index.json').read_text())
          old_count = int(search['count'])
          expected = old_count + (0 if any(x.get('id') == pub_id for x in search['items']) else 1)
          (root / '.build/from_theoremhood_as_reachability_to_hilbert_addressed_inference_spaces_003/expected_count.txt').write_text(str(expected))

          wrapper = root / 'scripts/build_publications_106.py'
          s = wrapper.read_text()
          s2, n1 = re.subn(
              r'if len\(expanded\["items"\]\) != \d+:',
              f'if len(expanded["items"]) != {expected}:',
              s,
              count=1
          )
          s2, n2 = re.subn(
              r'Expected \d+ cards after restoration',
              f'Expected {expected} cards after restoration',
              s2,
              count=1
          )
          assert n1 == 1 and n2 == 1, 'Could not update expected publication count'
          wrapper.write_text(s2)
          print(f'Catalog expected count: {expected}.')
          PY

      - name: Rebuild publication site and verify slot 1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          docs = root / 'docs'
          pub_id = 'cs.LO_Logic_in_Computer_Science/from_theoremhood_as_reachability_to_hilbert_addressed_inference_spaces_003'
          title = 'From Theoremhood as Reachability to Hilbert-Addressed Inference Spaces'
          expected = int((root / '.build/from_theoremhood_as_reachability_to_hilbert_addressed_inference_spaces_003/expected_count.txt').read_text())

          search = json.loads((docs / 'search-index.json').read_text())
          assert search['count'] == expected, search['count']
          assert search['items'][0]['id'] == pub_id, 'Theoremhood/Hilbert paper is not slot #1'
          assert search['items'][0]['pages'] == 20
          assert 'operational tool in ATP' in search['items'][0]['quote']
          assert 'theoremhood-as-reachability' in search['items'][0].get('card_text', '')

          index = (docs / 'index.html').read_text()
          first_card = index.split('<article class="card"', 1)[1].split('</article>', 1)[0]
          assert title in first_card
          assert 'theoremhood-as-reachability' in first_card

          pub_docs = docs / pub_id
          assert (pub_docs / 'index.html').is_file()
          assert (pub_docs / 'source.html').is_file()
          assert (pub_docs / 'source.tex').is_file()
          assert (pub_docs / 'From_Theoremhood_as_Reachability_to_Hilbert_Addressed_Inference_Spaces_003.pdf').is_file()
          reader = (pub_docs / 'index.html').read_text()
          assert '/pub/pdf-reader.html?file=' in reader
          assert 'From_Theoremhood_as_Reachability_to_Hilbert_Addressed_Inference_Spaces_003.pdf' in reader
          assert 'Source' in reader
          print('PASS: From Theoremhood as Reachability to Hilbert-Addressed Inference Spaces is slot #1 with reader, PDF, source, and catalog card.')
          PY

      - name: Remove one-time staging payload
        run: rm -rf incoming_publications/from_theoremhood_as_reachability_to_hilbert_addressed_inference_spaces_003

      - name: Commit verified publication and rebuilt library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish From Theoremhood as Reachability to Hilbert-Addressed Inference Spaces 003 as card 1 [skip ci]'
            git push
          fi
