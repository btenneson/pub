name: Rebuild fullscreen reader once

on:
  push:
    branches: [fix-fullscreen-reader]
    paths:
      - '.github/workflows/rebuild_fullscreen_reader_once.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-fullscreen-reader
          fetch-depth: 0

      - name: Install audit dependency
        run: python -m pip install --quiet pymupdf

      - name: Repair fullscreen reader control
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/build_publications.py')
          s = p.read_text()

          old_css = '.links a{padding:.5rem .7rem;border:1px solid var(--line);border-radius:8px;text-decoration:none;font-weight:650}.links a:hover,.links a:focus-visible{background:var(--tint)}'
          new_css = '.links a,.links button{padding:.5rem .7rem;border:1px solid var(--line);border-radius:8px;text-decoration:none;font-weight:650}.links button{cursor:pointer}.links a:hover,.links a:focus-visible,.links button:hover,.links button:focus-visible{background:var(--tint)}'
          if old_css not in s:
              raise SystemExit('Expected link CSS not found')
          s = s.replace(old_css, new_css, 1)

          old_link = '''  p=url(x['pdf']);result+=('<a href="'+p+'" target="_blank" rel="noopener">Open full-screen reader</a>' if reader else '')+'<a href="'+p+'" download>Download PDF</a>'
'''
          new_link = '''  p=url(x['pdf']);result+=('<button type="button" class="fullscreen-reader" onclick="const f=document.querySelector(\\'.reader-frame\\');if(f?.requestFullscreen)f.requestFullscreen();else if(f?.webkitRequestFullscreen)f.webkitRequestFullscreen();">Open full-screen reader</button>' if reader else '')+'<a href="'+p+'" download>Download PDF</a>'
'''
          if old_link not in s:
              raise SystemExit('Expected fullscreen reader link not found')
          s = s.replace(old_link, new_link, 1)
          p.write_text(s)

      - name: Rebuild publication site
        run: python scripts/build_publications.py

      - name: Audit publication catalog
        run: python scripts/audit_subject_catalog.py

      - name: Verify fullscreen behavior in generated readers
        shell: python
        run: |
          from pathlib import Path
          readers = []
          bad = []
          for p in Path('docs').glob('*/*/index.html'):
              text = p.read_text(errors='replace')
              if 'Download PDF' in text:
                  readers.append(p)
                  if 'class="fullscreen-reader"' not in text or 'requestFullscreen' not in text:
                      bad.append(str(p))
                  if 'Open full-screen reader</a>' in text:
                      bad.append(str(p) + ' still points at raw PDF')
          if not readers:
              raise SystemExit('No PDF reader pages found')
          if bad:
              raise SystemExit('Fullscreen audit failed:\n' + '\n'.join(bad[:20]))
          print(f'Audited {len(readers)} PDF reader pages: fullscreen button is embedded-reader only.')

      - name: Commit rebuilt site and remove one-shot workflow
        run: |
          rm .github/workflows/rebuild_fullscreen_reader_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix fullscreen publication reader behavior'
          git push origin HEAD:fix-fullscreen-reader
