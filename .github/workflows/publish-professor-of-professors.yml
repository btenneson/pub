name: Publish Atlas-audited Professor of Professors
on:
  push:
    branches: [main]
    paths:
      - '.build/professor-of-professors-001v2/**.tex'
      - '.build/professor-of-professors-001v2/publish.py'
      - '.github/workflows/publish-professor-of-professors.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: professor-of-professors-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install compilation and rendering tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-pictures lmodern poppler-utils
      - name: Compile audited source and verify static reader
        run: python3 .build/professor-of-professors-001v2/publish.py
      - name: Publish verified files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs
          if [ -f scripts/publications.json ]; then git add scripts/publications.json; fi
          git add -f .build/professor-of-professors-001v2/publication-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Professor of Professors 001v2 with static reader'
          git pull --rebase origin main
          git push origin HEAD:main
