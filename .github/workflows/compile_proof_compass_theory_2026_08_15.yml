name: Compile proof compass theory 2026-08-15

on:
  push:
    paths:
      - '.github/workflows/compile_proof_compass_theory_2026_08_15.yml'
      - 'cs.LO_Logic_in_Computer_Science/Proof_Compass_Theory/Proof_Compass_Theory_Learnability_Shrinkage_and_Control_2026_08_15.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended cm-super

      - name: Compile proof compass report
        run: |
          ROOT='cs.LO_Logic_in_Computer_Science/Proof_Compass_Theory'
          TEX='Proof_Compass_Theory_Learnability_Shrinkage_and_Control_2026_08_15.tex'
          PDF='Proof_Compass_Theory_Learnability_Shrinkage_and_Control_2026_08_15.pdf'
          cd "$ROOT"
          pdflatex -interaction=nonstopmode -halt-on-error "$TEX"
          pdflatex -interaction=nonstopmode -halt-on-error "$TEX"
          pdflatex -interaction=nonstopmode -halt-on-error "$TEX"
          test -f "$PDF"

      - name: Upload compiled PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Proof_Compass_Theory_Learnability_Shrinkage_and_Control_2026_08_15
          path: cs.LO_Logic_in_Computer_Science/Proof_Compass_Theory/Proof_Compass_Theory_Learnability_Shrinkage_and_Control_2026_08_15.pdf

      - name: Commit compiled PDF
        run: |
          ROOT='cs.LO_Logic_in_Computer_Science/Proof_Compass_Theory'
          PDF='Proof_Compass_Theory_Learnability_Shrinkage_and_Control_2026_08_15.pdf'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/$PDF"
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'Compile proof compass theory PDF 2026-08-15'
            git push
          fi
