name: Publish audited DNI research monograph 0.2 at slot 1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_dni_monograph_v0_2_slot1.py'
      - '.github/workflows/publish_dni_monograph_v0_2_slot1.yml'
      - 'docs/cs.LO_Logic_in_Computer_Science/determinism_possibility_and_certified_search_research_monograph_0_2/*.pdf'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-dni-monograph-v0-2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pymupdf==1.26.4
      - name: Validate PDF and publish at first position
        run: python scripts/publish_dni_monograph_v0_2_slot1.py
      # The monograph publisher validates the new PDF, metadata, quotation,
      # byte identity, and slot-one order. Repository-wide legacy quote audits
      # have unrelated pre-existing failures and are kept separate.
      - name: Commit generated site and catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/publications.json docs
          if ! git diff --cached --quiet; then
            git commit -m 'Feature audited DNI research monograph 0.2 at library slot 1'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
