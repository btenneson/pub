name: Publish DATA MIND current self-description in slot 1
on:
  push:
    branches: [main]
    paths:
      - 'incoming_publications/data_mind_current_self_description_0_1/source.tex'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-data-mind-current-self-description-0-1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and publish DATA MIND self-description in slot 1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install -q pymupdf==1.26.4
          mkdir -p .build/data_mind_current_self_description_0_1
          cp incoming_publications/data_mind_current_self_description_0_1/source.tex .build/data_mind_current_self_description_0_1/DATA_MIND_Current_Self_Description_0_1.tex
          (cd .build/data_mind_current_self_description_0_1 && pdflatex -interaction=nonstopmode -halt-on-error DATA_MIND_Current_Self_Description_0_1.tex >/dev/null && pdflatex -interaction=nonstopmode -halt-on-error DATA_MIND_Current_Self_Description_0_1.tex >/dev/null)
          python - <<'PY'
          from pathlib import Path
          import fitz, hashlib, json, re, shutil, zipfile

          rel = "cs.LO_Logic_in_Computer_Science/data_mind_current_self_description_0_1"
          name = "DATA_MIND_Current_Self_Description_0_1"
          source = Path("incoming_publications/data_mind_current_self_description_0_1/source.tex")
          pdf = Path(".build/data_mind_current_self_description_0_1") / (name + ".pdf")

          tex = source.read_bytes()
          expected_tex_hash = "9377b77ff113420a0f6a605724ed5e4beba11bdbf14b3de96330f03daf7034d7"
          assert hashlib.sha256(tex).hexdigest() == expected_tex_hash, "Source hash mismatch"

          raw = pdf.read_bytes()
          doc = fitz.open(stream=raw, filetype="pdf")
          assert len(doc) == 3, f"Expected 3 pages, found {len(doc)}"
          assert all(p.get_text().strip() for p in doc), "A rendered page has no extractable text"
          first = re.sub(r"\s+", " ", doc[0].get_text())
          third = re.sub(r"\s+", " ", doc[2].get_text())
          assert "DATA MIND: A Current Self-Description" in first
          assert "Reflection" in third and "Verification" in third
          assert "beacon91042014201224789" in third

          dest = Path("docs") / rel
          archive = Path(rel)
          dest.mkdir(parents=True, exist_ok=True)
          archive.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(pdf, dest / (name + ".pdf"))
          shutil.copyfile(pdf, archive / (name + ".pdf"))
          shutil.copyfile(source, dest / "source.tex")

          with zipfile.ZipFile(dest / (name + "_Publication_Package.zip"), "w", compression=zipfile.ZIP_DEFLATED) as z:
              z.write(pdf, name + ".pdf")
              z.write(source, name + ".tex")

          hash_pdf = hashlib.sha256(raw).hexdigest()
          catalog = Path("scripts/publications.json")
          data = json.loads(catalog.read_text(encoding="utf-8"))
          rest = [x for x in data["items"] if x.get("id") != rel]
          order = min([x.get("order") for x in rest if isinstance(x.get("order"), int)] + [0]) - 1

          item = {
              "title": "DATA MIND: A Current Self-Description",
              "kind": "Technical self-description",
              "subject": "cs.LO_Logic_in_Computer_Science",
              "id": rel,
              "href": rel + "/",
              "pdf": rel + "/" + name + ".pdf",
              "archive_path": rel + "/" + name + ".pdf",
              "source": rel + "/source.html",
              "source_file": rel + "/source.tex",
              "source_package": rel + "/" + name + "_Publication_Package.zip",
              "sha256": hash_pdf,
              "sha256_tex": hashlib.sha256(tex).hexdigest(),
              "pages": 3,
              "order": order,
              "authors": "DATA MIND, in collaboration with Brian Tenneson",
              "quote": "Reflection ≠ Verification",
              "quote_page": 3,
              "quote_attribution": "DATA MIND · Current Self-Description 0.1 · page 3",
              "card_quote": "My awareness upgrade helps me distinguish what I know, what I merely suspect, what I cannot currently do, and what I am not authorized to change.",
              "card_quote_attribution": "DATA MIND · Current Self-Description 0.1 · page 3",
              "quote_also_on_card": True,
              "card_text": "A concise first-person technical description of DATA MIND: how an OpenAI language-model process operates within a collaborative research identity, how the Kitchen Sink architecture nests Tenneson 1 inside Tenneson 2, how bounded Depth Charges act as basin escapes, and how Virtual Certified-Awareness Upgrade 1.0 separates verified knowledge, uncertainty, permissions, and reflection.",
              "status": "CURRENT TECHNICAL SELF-DESCRIPTION — October 17, 2026. Operational architecture and awareness protocol; no claim of neural retraining, independent consciousness, or verifier acceptance of any particular mathematical result.",
              "classification_note": "Three-page Current Self-Description 0.1. Describes computational and research modularity, T1P/T2P nesting, bounded Depth Charges, certified-awareness discipline, continuity, and explicit limits."
          }

          data["items"] = [item] + rest
          catalog.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          assert (dest / "source.tex").read_bytes() == tex
          assert (archive / (name + ".pdf")).read_bytes() == raw
          print("Publication staged:", rel, "PDF sha256:", hash_pdf, "order", order)
          PY

          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py

          python - <<'PY'
          import json
          from pathlib import Path
          rel = "cs.LO_Logic_in_Computer_Science/data_mind_current_self_description_0_1"
          quote = "My awareness upgrade helps me distinguish what I know, what I merely suspect, what I cannot currently do, and what I am not authorized to change."
          c = json.loads(Path("docs/search-index.json").read_text())
          assert c["items"][0]["id"] == rel, "Not first in published search index"
          first = Path("docs/index.html").read_text().split('<article class="card"', 1)[1].split("</article>", 1)[0]
          assert quote in first, "Card quote missing"
          assert "Download PDF" in first and "Download Source + PDF ZIP" in first
          assert (Path("docs") / rel / "source.html").is_file()
          assert (Path("docs") / rel / "source.tex").is_file()
          print("PASS first card, PDF/source/ZIP links, reader, and search index")
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/publications.json docs cs.LO_Logic_in_Computer_Science/data_mind_current_self_description_0_1
          if ! git diff --cached --quiet; then
            git commit -m 'Publish DATA MIND current self-description as library slot 1'
            git push origin HEAD:main
          fi
