name: Publish Universal Theorem Geometry I upload

on:
  push:
    paths:
      - '.build/utg_upload/READY'

permissions:
  contents: write

jobs:
  assemble-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and assemble preserved PDF upload
        shell: bash
        run: |
          set -euo pipefail
          OLD='fe4bf0eaed7fe2016a2be0efc9a0826e031b0ee0'
          OUT='docs/papers/universal_theorem_geometry_i_001/Universal_Theorem_Geometry_I_Corrected.pdf'
          mkdir -p "$(dirname "$OUT")"
          mapfile -t PARTS < <(git ls-tree -r --name-only "$OLD" -- '.build/utg_pdf_parts' | sort)
          test "${#PARTS[@]}" -eq 12
          : > /tmp/utg_pdf.b64
          for p in "${PARTS[@]}"; do
            git show "$OLD:$p" >> /tmp/utg_pdf.b64
          done
          tr -d '\r\n\t ' < /tmp/utg_pdf.b64 | base64 -d > "$OUT"
          test -s "$OUT"
          file "$OUT" | grep -q 'PDF document'
          head -c 5 "$OUT" | grep -q '%PDF-'
          echo "Recovered PDF size: $(wc -c < "$OUT") bytes"
      - name: Commit publication and remove temporary staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/papers/universal_theorem_geometry_i_001/Universal_Theorem_Geometry_I_Corrected.pdf
          git rm -r .build/utg_upload
          git rm .github/workflows/publish_utg_upload.yml
          git commit -m 'Publish Universal Theorem Geometry I PDF [skip ci]'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
