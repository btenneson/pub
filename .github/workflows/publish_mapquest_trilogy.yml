name: Publish MAPQUEST trilogy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_mapquest_trilogy.yml'
      - 'docs/MAPQUEST_Trilogy/.payload/**'
      - 'docs/MAPQUEST_Trilogy/index.html'
      - 'docs/MAPQUEST_Trilogy/README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended cm-super

      - name: Reconstruct trilogy sources
        run: |
          set -e
          ROOT='docs/MAPQUEST_Trilogy'
          cat "$ROOT"/.payload/I_*.b64   | tr -d '\n' | base64 -d > "$ROOT/MAPQUEST_Trilogy_I_MAPQUEST_for_Formal_Proof_001.tex"
          cat "$ROOT"/.payload/II_*.b64  | tr -d '\n' | base64 -d > "$ROOT/MAPQUEST_Trilogy_II_Hilbert_Fair_Target_Navigation_001.tex"
          cat "$ROOT"/.payload/III_*.b64 | tr -d '\n' | base64 -d > "$ROOT/MAPQUEST_Trilogy_III_Target_Certification_001.tex"

      - name: Compile trilogy PDFs
        run: |
          set -e
          ROOT='docs/MAPQUEST_Trilogy'
          cd "$ROOT"
          for TEX in \
            MAPQUEST_Trilogy_I_MAPQUEST_for_Formal_Proof_001.tex \
            MAPQUEST_Trilogy_II_Hilbert_Fair_Target_Navigation_001.tex \
            MAPQUEST_Trilogy_III_Target_Certification_001.tex
          do
            pdflatex -interaction=nonstopmode -halt-on-error "$TEX"
            pdflatex -interaction=nonstopmode -halt-on-error "$TEX"
            pdflatex -interaction=nonstopmode -halt-on-error "$TEX"
          done
          test -s MAPQUEST_Trilogy_I_MAPQUEST_for_Formal_Proof_001.pdf
          test -s MAPQUEST_Trilogy_II_Hilbert_Fair_Target_Navigation_001.pdf
          test -s MAPQUEST_Trilogy_III_Target_Certification_001.pdf

      - name: Remove payload and LaTeX build debris
        run: |
          ROOT='docs/MAPQUEST_Trilogy'
          rm -rf "$ROOT/.payload"
          find "$ROOT" -maxdepth 1 -type f \( -name '*.aux' -o -name '*.log' -o -name '*.out' -o -name '*.toc' \) -delete

      - name: Commit trilogy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MAPQUEST_Trilogy
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'Publish MAPQUEST trilogy PDFs and sources [skip ci]'
            git push
          fi
