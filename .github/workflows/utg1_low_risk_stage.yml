name: UTG I low-risk staging

on:
  push:
    branches: [utg1-low-risk-stage]
    paths: [.github/workflows/utg1_low_risk_stage.yml]

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify corrected PDF
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          out = Path('docs/cs.LO_Logic_in_Computer_Science/universal_theorem_geometry_i_001/Universal_Theorem_Geometry_I.pdf')
          out.parent.mkdir(parents=True, exist_ok=True)
          target_sha = '0a7011edeb67bbbc96d0540d0db9ff61380e5476ea1f25f266ec27d06f99dd85'
          target_size = 292199
          parts = [Path(f'.build/utg1pdf/part{i:02d}.b64') for i in range(1, 11)]
          texts = [''.join(p.read_text().split()) for p in parts]

          def b64(s):
              s = s.strip()
              s += '=' * ((-len(s)) % 4)
              return base64.b64decode(s, validate=False)

          candidates = []
          joined = ''.join(texts)
          for name, s in [('joined', joined), ('joined-no-padding', joined.replace('=', ''))]:
              try:
                  candidates.append((name, b64(s)))
              except Exception:
                  pass
          try:
              candidates.append(('per-part', b''.join(b64(t) for t in texts)))
          except Exception:
              pass
          try:
              candidates.append(('per-part-no-padding', b''.join(b64(t.replace('=', '')) for t in texts)))
          except Exception:
              pass

          for name, data in candidates:
              for mode, payload in [('raw', data), ('gzip', None)]:
                  if mode == 'gzip':
                      try:
                          payload = gzip.decompress(data)
                      except Exception:
                          continue
                  sha = hashlib.sha256(payload).hexdigest()
                  if len(payload) == target_size and sha == target_sha:
                      out.write_bytes(payload)
                      print(f'verified reconstruction: {name}/{mode}; size={len(payload)}; sha256={sha}')
                      raise SystemExit(0)
          raise SystemExit('No reconstruction variant matched the fixed corrected-PDF hash; refusing to publish.')
          PY
      - name: Commit verified PDF to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cs.LO_Logic_in_Computer_Science/universal_theorem_geometry_i_001/Universal_Theorem_Geometry_I.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Stage verified UTG I corrected PDF"
          git push
