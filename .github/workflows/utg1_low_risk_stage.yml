name: UTG I low-risk staging

on:
  push:
    branches: [utg1-low-risk-stage]
    paths: [.github/workflows/utg1_low_risk_stage.yml]

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify audited source
        shell: bash
        run: |
          set -euo pipefail
          cat staging/utg1/corrected_source.b64.00 staging/utg1/corrected_source.b64.01 staging/utg1/corrected_source.b64.02 \
            | base64 -d | gzip -d > /tmp/Universal_Theorem_Geometry_I.tex
          echo "4f8e1ee23afaa5cb03b6e9ac35ec6ad40661f476764f050de213b29b1bcaabf0  /tmp/Universal_Theorem_Geometry_I.tex" | sha256sum -c -
          test "$(wc -c < /tmp/Universal_Theorem_Geometry_I.tex)" = "39396"

      - name: Install minimal LaTeX and PDF audit tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures
          python -m pip install --quiet pymupdf==1.26.4

      - name: Compile audited Revision 1.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/utg1-build
          cp /tmp/Universal_Theorem_Geometry_I.tex /tmp/utg1-build/
          cd /tmp/utg1-build
          pdflatex -interaction=nonstopmode -halt-on-error Universal_Theorem_Geometry_I.tex >/tmp/utg1-pass1.log
          pdflatex -interaction=nonstopmode -halt-on-error Universal_Theorem_Geometry_I.tex >/tmp/utg1-pass2.log

      - name: Audit compiled publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import fitz, hashlib, re
          src = Path('/tmp/utg1-build/Universal_Theorem_Geometry_I.pdf')
          doc = fitz.open(src)
          text = '\n'.join(p.get_text() for p in doc)
          flat = re.sub(r'\s+', ' ', text).strip()
          assert len(doc) == 16, f'Expected 16 pages, got {len(doc)}'
          assert 'Universal Theorem Geometry I' in doc[0].get_text()
          quote = 'Universal theorem space is naturally a stratified, fibered, directed multi-geometry rather than a single metric space.'
          assert quote in flat, 'Exact card quote missing from compiled PDF after whitespace normalization'
          assert 'Revision 1.1' in doc[0].get_text()
          print('pages=', len(doc))
          print('sha256=', hashlib.sha256(src.read_bytes()).hexdigest())
          out = Path('docs/cs.LO_Logic_in_Computer_Science/universal_theorem_geometry_i_001/Universal_Theorem_Geometry_I.pdf')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(src.read_bytes())
          PY

      - name: Commit verified PDF to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cs.LO_Logic_in_Computer_Science/universal_theorem_geometry_i_001/Universal_Theorem_Geometry_I.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Stage verified UTG I Revision 1.1 PDF"
          git push
