name: Publish CDF Certified Discovery Federation 012 as slot 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_cdf_certified_discovery_federation_012_slot1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify audited package
        shell: bash
        run: |
          set -euo pipefail
          BUILD='.build/cdf_certified_discovery_federation_012'
          STAGE='incoming_publications/cdf_certified_discovery_federation_012'
          mkdir -p "$BUILD"

          for f in "$STAGE"/source.part_*.b64; do
            printf '%s ' "$(basename "$f")"
            tr -d '[:space:]' < "$f" | base64 -d | sha256sum
          done
          cat "$STAGE"/source.part_*.b64 | tr -d '[:space:]' | base64 -d > "$BUILD/source.tex"
          tr -d '[:space:]' < "$STAGE/audit.b64" | base64 -d > "$BUILD/CDF_Certified_Discovery_Federation_012_ATLAS_REAUDIT.md"
          tr -d '[:space:]' < "$STAGE/proxy.b64" | base64 -d > "$BUILD/cdf_ocean_proxy_v12.py"

          sha256sum "$BUILD/source.tex" "$BUILD/CDF_Certified_Discovery_Federation_012_ATLAS_REAUDIT.md" "$BUILD/cdf_ocean_proxy_v12.py"
          test "$(sha256sum "$BUILD/source.tex" | awk '{print $1}')" = "d11342aea8afd06aaffcc72c3b1b51c89d49d90ba430fa946363a02c830cc8d3"
          test "$(sha256sum "$BUILD/CDF_Certified_Discovery_Federation_012_ATLAS_REAUDIT.md" | awk '{print $1}')" = "5297de292e175edf0c19da5812f7f164698498e354eea97a8abe979368fdd254"
          test "$(sha256sum "$BUILD/cdf_ocean_proxy_v12.py" | awk '{print $1}')" = "8a93e8849d8b1d48d5f8fbebeb7b62d9b7c504bb961c80a1a0252cc3fed59436"

          sudo apt-get update -qq
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern zip >/dev/null
          python -m pip install -q pymupdf==1.26.4

          cd "$BUILD"
          for i in 1 2 3; do pdflatex -interaction=nonstopmode -halt-on-error source.tex >/dev/null; done
          cd ../..

          python - <<'PY'
          from pathlib import Path
          import fitz, re
          p=Path('.build/cdf_certified_discovery_federation_012/source.pdf')
          d=fitz.open(p)
          assert len(d)==35, len(d)
          full=re.sub(r'\s+', ' ', ' '.join(page.get_text() for page in d))
          checks=[
              'CDF: Certified Discovery Federation',
              'Scout Emulation',
              'Eureka-Style Lemma Fishing',
              'Scientific hypothesis generation',
              'Certified progress earns the right to grow.',
              'Installing an AMLD+0 Reference Instance',
          ]
          for s in checks:
              assert s in full, s
          quote='Certified progress earns the right to grow.'
          qp=None
          for i,page in enumerate(d):
              if quote in re.sub(r'\s+', ' ', page.get_text()):
                  qp=i+1
                  break
          assert qp is not None
          Path('.build/cdf_certified_discovery_federation_012/quote_page.txt').write_text(str(qp))
          print('verified pages',len(d),'quote page',qp)
          PY

      - name: Install publication artifacts
        shell: bash
        run: |
          set -euo pipefail
          BUILD='.build/cdf_certified_discovery_federation_012'
          PUB='cs.LO_Logic_in_Computer_Science/certified_discovery_federation_012'
          PDF='CDF_Certified_Discovery_Federation_012.pdf'
          ZIP='CDF_Certified_Discovery_Federation_012_Source_PDF_Proxy_and_ATLAS_Audit.zip'
          AUDIT='CDF_Certified_Discovery_Federation_012_ATLAS_REAUDIT.md'
          PROXY='cdf_ocean_proxy_v12.py'

          mkdir -p "$PUB" "docs/$PUB"
          cp "$BUILD/source.pdf" "$PUB/$PDF"
          cp "$BUILD/source.pdf" "docs/$PUB/$PDF"
          cp "$BUILD/source.tex" "docs/$PUB/source.tex"
          cp "$BUILD/$AUDIT" "docs/$PUB/$AUDIT"
          cp "$BUILD/$PROXY" "docs/$PUB/$PROXY"

          cp "$BUILD/source.pdf" "$BUILD/$PDF"
          (cd "$BUILD" && zip -X -q "$ZIP" source.tex "$PDF" "$AUDIT" "$PROXY")
          cp "$BUILD/$ZIP" "docs/$PUB/$ZIP"

      - name: Promote CDF to publication card slot 1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz, hashlib, json, re

          root=Path('.')
          pub_id='cs.LO_Logic_in_Computer_Science/certified_discovery_federation_012'
          pdf_name='CDF_Certified_Discovery_Federation_012.pdf'
          zip_name='CDF_Certified_Discovery_Federation_012_Source_PDF_Proxy_and_ATLAS_Audit.zip'
          audit_name='CDF_Certified_Discovery_Federation_012_ATLAS_REAUDIT.md'
          proxy_name='cdf_ocean_proxy_v12.py'

          pdf=root/pub_id/pdf_name
          source=root/'docs'/pub_id/'source.tex'
          package=root/'docs'/pub_id/zip_name
          pages=len(fitz.open(pdf))
          assert pages==35
          quote='Certified progress earns the right to grow.'
          quote_page=int((root/'.build/cdf_certified_discovery_federation_012/quote_page.txt').read_text())

          cat=root/'scripts/publications.json'
          data=json.loads(cat.read_text())
          existed=any(x.get('id')==pub_id for x in data['items'])
          old=[x for x in data['items'] if x.get('id')!=pub_id]
          orders=[x.get('order') for x in old if isinstance(x.get('order'),(int,float))]
          order=min(orders)-10 if orders else -10

          item={
            'title':'CDF: Certified Discovery Federation',
            'kind':'Research synthesis and theorem-proving architecture',
            'quote':quote,
            'quote_page':quote_page,
            'card_text':(
              'Version 12 develops a verifier-gated discovery federation combining ATP conjecture generation, '
              'AMLD settlement roles, certified BANK memory, dynamically activated Scouts, persistent Board state, '
              'and Player-Zero control. Record-low discrete credit ranks prevent spawn-credit farming; Board, Scout, '
              'and worker resources are separated; Scout emulation and ESLF transfer are stated with finite-trace '
              'precision; and scientific hypothesis generation is treated as a proposal–settlement–verification '
              'application without collapsing empirical evidence into formal certification.'
            ),
            'status':'FINAL ATLAS-REPAIRED AND RE-AUDITED RELEASE — Version 12, October 1, 2026.',
            'subject':'cs.LO_Logic_in_Computer_Science',
            'id':pub_id,
            'href':pub_id+'/',
            'pdf':pub_id+'/'+pdf_name,
            'archive_path':pub_id+'/'+pdf_name,
            'sha256':hashlib.sha256(pdf.read_bytes()).hexdigest(),
            'sha256_tex':hashlib.sha256(source.read_bytes()).hexdigest(),
            'sha256_source_package':hashlib.sha256(package.read_bytes()).hexdigest(),
            'pages':pages,
            'order':order,
            'source':pub_id+'/source.html',
            'source_file':pub_id+'/source.tex',
            'source_package':pub_id+'/'+zip_name,
            'authors':'Brian Tenneson',
            'classification_note':(
              'Research synthesis and theorem-proving architecture, October 1, 2026. Version 12 develops a '
              'verifier-gated Certified Discovery Federation combining ATP conjecture generation, AMLD settlement '
              'roles, certified BANK memory, dynamically activated Scouts, persistent Board state, and Player-Zero '
              'control. It introduces record-low discrete credit ranks to prevent spawn-credit farming, separates '
              'Board, Scout, and worker resources, gives a finite-trace Scout Emulation Theorem and ESLF Transfer '
              'Corollary, imports an infinite antichain result for AMLD+0 clocked-simulation degrees, and develops '
              'scientific hypothesis generation as a proposal–settlement–verification application while keeping '
              'empirical evidence distinct from formal certification. Subject classification: cs.LO — Logic in Computer Science.'
            )
          }
          data['items']=[item]+old
          cat.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          search=json.loads((root/'docs/search-index.json').read_text())
          expected=int(search['count']) if existed else int(search['count'])+1
          wrapper=root/'scripts/build_publications_106.py'
          wt=wrapper.read_text()
          wt,n1=re.subn(r'if len\(expanded\["items"\]\) != \d+:',
                       f'if len(expanded["items"]) != {expected}:',wt,count=1)
          wt,n2=re.subn(r'Expected \d+ cards after restoration',
                       f'Expected {expected} cards after restoration',wt,count=1)
          assert n1==1 and n2==1, (n1,n2)
          wrapper.write_text(wt)
          (root/'.build/cdf_certified_discovery_federation_012/expected.txt').write_text(str(expected))
          print('slot order',order,'expected',expected)
          PY

          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py

      - name: Verify card slot and publication files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          root=Path('.')
          pub_id='cs.LO_Logic_in_Computer_Science/certified_discovery_federation_012'
          expected=int((root/'.build/cdf_certified_discovery_federation_012/expected.txt').read_text())
          s=json.loads((root/'docs/search-index.json').read_text())
          assert s['count']==expected, (s['count'],expected)
          x=s['items'][0]
          assert x['id']==pub_id, x['id']
          assert x['pages']==35
          assert x['title']=='CDF: Certified Discovery Federation'
          assert x['quote']=='Certified progress earns the right to grow.'
          assert x['sha256_tex']=='d11342aea8afd06aaffcc72c3b1b51c89d49d90ba430fa946363a02c830cc8d3'

          home=(root/'docs/index.html').read_text()
          first=home.split('<article class="card"',1)[1].split('</article>',1)[0]
          assert 'CDF: Certified Discovery Federation' in first

          subject=(root/'docs/cs.LO_Logic_in_Computer_Science/index.html').read_text()
          first_subject=subject.split('<article class="card"',1)[1].split('</article>',1)[0]
          assert 'CDF: Certified Discovery Federation' in first_subject

          files=[
            f'docs/{pub_id}/index.html',
            f'docs/{pub_id}/source.html',
            f'docs/{pub_id}/source.tex',
            f'docs/{pub_id}/CDF_Certified_Discovery_Federation_012.pdf',
            f'docs/{pub_id}/CDF_Certified_Discovery_Federation_012_Source_PDF_Proxy_and_ATLAS_Audit.zip',
            f'docs/{pub_id}/CDF_Certified_Discovery_Federation_012_ATLAS_REAUDIT.md',
            f'docs/{pub_id}/cdf_ocean_proxy_v12.py',
          ]
          for f in files:
              assert (root/f).is_file(), f
          print('PASS: CDF 012 is publication card slot #1 with reader, PDF, source, audit, proxy, and source package.')
          PY

      - name: Commit publication
        shell: bash
        run: |
          set -euo pipefail
          rm -rf incoming_publications/cdf_certified_discovery_federation_012 .build/cdf_certified_discovery_federation_012
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m 'Publish CDF Certified Discovery Federation 012 as card 1 [skip ci]'
          git pull --rebase origin main
          git push
