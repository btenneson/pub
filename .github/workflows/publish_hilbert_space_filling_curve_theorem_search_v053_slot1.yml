name: Publish Hilbert Space Filling Curve Theorem Search v0.5.3 in slot 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_hilbert_space_filling_curve_theorem_search_v053_slot1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and PDF verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-pictures fonts-dejavu-core lmodern
          python -m pip install pymupdf==1.26.4

      - name: Compile source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/hilbert_space_filling_curve_theorem_search_v053
          cp incoming_publications/hilbert_space_filling_curve_theorem_search_v053/source.tex .build/hilbert_space_filling_curve_theorem_search_v053/source.tex
          cp incoming_publications/hilbert_space_filling_curve_theorem_search_v053/hilbert2d.dat .build/hilbert_space_filling_curve_theorem_search_v053/hilbert2d.dat
          test "$(wc -c < .build/hilbert_space_filling_curve_theorem_search_v053/source.tex)" -ge 70000
          grep -q '\\end{document}' .build/hilbert_space_filling_curve_theorem_search_v053/source.tex
          cd .build/hilbert_space_filling_curve_theorem_search_v053
          for i in 1 2 3 4; do
            xelatex -interaction=nonstopmode -halt-on-error source.tex
          done
          test -s source.pdf

      - name: Verify paper and stage publication files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz, re
          pdf = Path('.build/hilbert_space_filling_curve_theorem_search_v053/source.pdf')
          doc = fitz.open(pdf)
          assert len(doc) == 31, f'Expected 31 pages, got {len(doc)}'
          p1 = re.sub(r'\s+', ' ', doc[0].get_text()).strip()
          p4 = re.sub(r'\s+', ' ', doc[3].get_text()).strip()
          assert 'Hilbert Space Filling Curve-Style Theorem Search' in p1
          assert 'Version 0.5.3' in p1
          assert 'tested research prototype and forward consequence enumerator' in p4
          assert all(doc[i].get_text().strip() for i in range(len(doc))), 'Unreadable or empty PDF page'
          print('PASS: 31-page Hilbert Space Filling Curve-Style Theorem Search v0.5.3 compiled and verified.')
          PY
          PUB='cs.LO_Logic_in_Computer_Science/hilbert_space_filling_curve_theorem_search_v053'
          mkdir -p "$PUB" "docs/$PUB"
          cp .build/hilbert_space_filling_curve_theorem_search_v053/source.pdf "$PUB/Hilbert_Space_Filling_Curve_Theorem_Search_v0.5.3.pdf"
          cp .build/hilbert_space_filling_curve_theorem_search_v053/source.pdf "docs/$PUB/Hilbert_Space_Filling_Curve_Theorem_Search_v0.5.3.pdf"
          cp .build/hilbert_space_filling_curve_theorem_search_v053/source.tex "docs/$PUB/source.tex"

      - name: Promote publication to card slot 1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, fitz

          root = Path('.')
          pub_id = 'cs.LO_Logic_in_Computer_Science/hilbert_space_filling_curve_theorem_search_v053'
          pdf_name = 'Hilbert_Space_Filling_Curve_Theorem_Search_v0.5.3.pdf'
          archive = root / pub_id / pdf_name
          source = root / 'docs' / pub_id / 'source.tex'
          doc_pdf = root / 'docs' / pub_id / pdf_name
          assert archive.is_file() and archive.stat().st_size > 0
          assert doc_pdf.is_file() and doc_pdf.stat().st_size > 0
          assert source.is_file() and source.stat().st_size >= 70000
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == hashlib.sha256(doc_pdf.read_bytes()).hexdigest()

          doc = fitz.open(archive)
          pages = len(doc)
          assert pages == 31
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          quote = ('The implementation is a tested research prototype and forward consequence enumerator, '
                   'not a decision procedure for ZFC and not yet a production Metamath prover.')
          card_text = (
              'This August 2026 foundational paper develops Hilbert-order scheduling over rule-specific premise '
              'spaces, keeps heterogeneous rules in a tagged coproduct, distinguishes logical validity from '
              'navigation, and shows that Hilbert order changes finite-budget visitation rather than exhaustive '
              'candidate count. It is retained as the original Hilbert-scheduling foundation later extended by '
              'the September generalized-board-game and action-fiber synthesis.'
          )

          cat = root / 'scripts/publications.json'
          data = json.loads(cat.read_text())
          old = [x for x in data['items'] if x.get('id') != pub_id]
          item = {
              'title': 'Hilbert Space Filling Curve-Style Theorem Search — A Mathematical Specification, Constrained-Search Study, and Research Program',
              'kind': 'Foundational research paper',
              'quote': quote,
              'quote_page': 4,
              'card_text': card_text,
              'subject': 'cs.LO_Logic_in_Computer_Science',
              'id': pub_id,
              'href': pub_id + '/',
              'pdf': pub_id + '/' + pdf_name,
              'archive_path': pub_id + '/' + pdf_name,
              'sha256': digest,
              'pages': pages,
              'order': -150,
              'source': pub_id + '/source.html',
              'authors': 'Brian Tenneson',
              'source_file': pub_id + '/source.tex',
              'classification_note': (
                  'Version 0.5.3, August 7, 2026. Foundational Hilbert-scheduling paper for automated theorem '
                  'search: finite arbitrary-dimensional Hilbert traversals, tagged coproduct rule spaces, '
                  'frozen epochs, explicit interruption budgets, negative controls, and experimentally testable '
                  'locality conjectures. Retained as an archival precursor to the later GBG/action-fiber synthesis. '
                  'Subject classification: cs.LO — Logic in Computer Science.'
              )
          }
          data['items'] = [item] + old
          cat.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          search = json.loads((root / 'docs/search-index.json').read_text())
          old_count = int(search['count'])
          expected = old_count + (0 if any(x.get('id') == pub_id for x in search['items']) else 1)
          (root / '.build/hilbert_space_filling_curve_theorem_search_v053/expected_count.txt').write_text(str(expected))

          wrapper = root / 'scripts/build_publications_106.py'
          s = wrapper.read_text()
          s2, n1 = re.subn(
              r'if len\(expanded\["items"\]\) != \d+:',
              f'if len(expanded["items"]) != {expected}:',
              s,
              count=1
          )
          s2, n2 = re.subn(
              r'Expected \d+ cards after restoration',
              f'Expected {expected} cards after restoration',
              s2,
              count=1
          )
          assert n1 == 1 and n2 == 1, 'Could not update expected publication count'
          wrapper.write_text(s2)
          print(f'Catalog expected count: {expected}.')
          PY

      - name: Rebuild publication site and verify slot 1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          docs = root / 'docs'
          pub_id = 'cs.LO_Logic_in_Computer_Science/hilbert_space_filling_curve_theorem_search_v053'
          title = 'Hilbert Space Filling Curve-Style Theorem Search — A Mathematical Specification, Constrained-Search Study, and Research Program'
          expected = int((root / '.build/hilbert_space_filling_curve_theorem_search_v053/expected_count.txt').read_text())

          search = json.loads((docs / 'search-index.json').read_text())
          assert search['count'] == expected, search['count']
          assert search['items'][0]['id'] == pub_id, 'Hilbert paper is not slot #1'
          assert search['items'][0]['pages'] == 31
          assert 'tested research prototype' in search['items'][0]['quote']
          assert 'original Hilbert-scheduling foundation' in search['items'][0].get('card_text', '')

          index = (docs / 'index.html').read_text()
          first_card = index.split('<article class="card"', 1)[1].split('</article>', 1)[0]
          assert title in first_card
          assert 'Hilbert-order scheduling' in first_card

          pub_docs = docs / pub_id
          assert (pub_docs / 'index.html').is_file()
          assert (pub_docs / 'source.html').is_file()
          assert (pub_docs / 'source.tex').is_file()
          assert (pub_docs / 'Hilbert_Space_Filling_Curve_Theorem_Search_v0.5.3.pdf').is_file()
          reader = (pub_docs / 'index.html').read_text()
          assert '/pub/pdf-reader.html?file=' in reader
          assert 'Hilbert_Space_Filling_Curve_Theorem_Search_v0.5.3.pdf' in reader
          assert 'Source' in reader
          print('PASS: Hilbert Space Filling Curve-Style Theorem Search v0.5.3 is slot #1 with reader, PDF, source, and archival card text.')
          PY

      - name: Remove one-time staging payload
        run: rm -rf incoming_publications/hilbert_space_filling_curve_theorem_search_v053

      - name: Commit verified publication and rebuilt library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish Hilbert Space Filling Curve Theorem Search v0.5.3 as card 1 [skip ci]'
            git push
          fi
