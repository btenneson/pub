name: Publish six audited papers at library slots 1-6
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_six_audited_20261105.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-six-audited-20261105
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent PDF checker
        run: python -m pip install --quiet pymupdf==1.26.4
      - name: Publish six cards, regenerate full library, and audit exact PDFs
        run: python scripts/publish_six_audited_20261105.py
      - name: Commit the verified publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs scripts/publications.json incoming_publications
          if git diff --cached --quiet; then
            echo "Publication already present."
            exit 0
          fi
          git commit -m "Publish six audited papers in consecutive slots 1-6 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
