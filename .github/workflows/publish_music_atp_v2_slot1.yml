name: Publish MUSIC of an ATP version 2.0 in library slot 1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_music_atp_v2_slot1.yml'
      - 'scripts/publish_music_atp_v2_slot1.py'
      - 'incoming_publications/music_of_an_atp_v2/source.tex'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-music-atp-v2-slot1
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact manuscript's TeX fonts and PDF audit tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-pictures texlive-science lmodern
          python -m pip install --quiet pymupdf==1.26.4
      - name: Compile, audit, and publish into library slot 1
        run: python scripts/publish_music_atp_v2_slot1.py
      - name: Commit verified PDF and publication catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs scripts/publications.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish MUSIC of an ATP v2.0 at library slot 1 [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No publication changes to commit.'
          fi
