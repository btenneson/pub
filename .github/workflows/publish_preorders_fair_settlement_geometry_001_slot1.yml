name: Publish Preorders and Fair Settlement Geometry 001 in slot 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_preorders_fair_settlement_geometry_001_slot1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and PDF verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install pymupdf==1.26.4

      - name: Reconstruct and compile exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/preorders_and_fair_settlement_geometry_001
          cat incoming_publications/preorders_and_fair_settlement_geometry_001/parts/part* | base64 -d | gzip -d > .build/preorders_and_fair_settlement_geometry_001/source.tex
          test "$(wc -c < .build/preorders_and_fair_settlement_geometry_001/source.tex)" -eq 50756
          test "$(sha256sum .build/preorders_and_fair_settlement_geometry_001/source.tex | awk '{print $1}')" = "b15e4ce2e371695e6da751fc501ef68fff01f1af085f38770b4481fcdf504411"
          grep -q '\\end{document}' .build/preorders_and_fair_settlement_geometry_001/source.tex
          cd .build/preorders_and_fair_settlement_geometry_001
          for i in 1 2 3 4; do
            pdflatex -interaction=nonstopmode -halt-on-error source.tex
          done
          test -s source.pdf

      - name: Remove any interrupted remnants and stage clean publication
        shell: bash
        run: |
          set -euo pipefail
          PUB='cs.LO_Logic_in_Computer_Science/preorders_and_fair_settlement_geometry_001'
          rm -rf "$PUB" "docs/$PUB"
          mkdir -p "$PUB" "docs/$PUB"
          cp .build/preorders_and_fair_settlement_geometry_001/source.pdf "$PUB/Preorders_and_Fair_Settlement_Geometry_001.pdf"
          cp .build/preorders_and_fair_settlement_geometry_001/source.tex "docs/$PUB/source.tex"

      - name: Verify paper and promote catalog entry to slot 1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, fitz

          root = Path('.')
          pub_id = 'cs.LO_Logic_in_Computer_Science/preorders_and_fair_settlement_geometry_001'
          pdf_name = 'Preorders_and_Fair_Settlement_Geometry_001.pdf'
          archive = root / pub_id / pdf_name
          source = root / 'docs' / pub_id / 'source.tex'
          assert archive.is_file() and archive.stat().st_size > 0
          assert source.is_file() and source.stat().st_size == 50756
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'b15e4ce2e371695e6da751fc501ef68fff01f1af085f38770b4481fcdf504411'

          doc = fitz.open(archive)
          pages = len(doc)
          assert pages == 17, f'Expected 17 pages, got {pages}'
          quote = (
              'The proposed empirical program is therefore modest in its logical claim and ambitious in its '
              'measurement claim. It does not provide a probability-one chance of obtaining a correct SAT answer. '
              'It requires correctness on every reported answer and uses unknown on budget exhaustion. What is '
              'probabilistic is the event that an instance drawn from a declared distribution settles within a '
              'declared resource bound.'
          )
          page17 = re.sub(r'\s+', ' ', doc[16].get_text()).strip()
          assert quote in page17, 'SAT card quote not found on PDF page 17'
          assert all(doc[i].get_text().strip() for i in range(pages)), 'Unreadable or empty PDF page'
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()

          cat = root / 'scripts/publications.json'
          data = json.loads(cat.read_text())
          old = [x for x in data['items'] if x.get('id') != pub_id]
          item = {
              'title': 'Preorders and Fair Settlement Geometry — SIC/AMLD Simulation Degrees and a High-Probability Complexity Framework for SAT',
              'kind': 'Research paper',
              'quote': quote,
              'quote_page': 17,
              'subject': 'cs.LO_Logic_in_Computer_Science',
              'id': pub_id,
              'href': pub_id + '/',
              'pdf': pub_id + '/' + pdf_name,
              'archive_path': pub_id + '/' + pdf_name,
              'sha256': digest,
              'pages': pages,
              'order': -110,
              'source': pub_id + '/source.html',
              'authors': 'Brian Tenneson',
              'source_file': pub_id + '/source.tex',
              'classification_note': (
                  'September 2026. Develops the clocked SIC simulation preorder and quotient poset of simulation '
                  'degrees, a scheduled-execution AMLD analogue, fair settlement reductions and fair settlement '
                  'degrees, distribution-relative high-probability settlement, and an exact verifier-gated SAT test '
                  'protocol. Subject classification: cs.LO — Logic in Computer Science.'
              )
          }
          data['items'] = [item] + old
          cat.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          wrapper = root / 'scripts/build_publications_106.py'
          s = wrapper.read_text()
          s2 = re.sub(
              r'if len\(expanded\["items"\]\) != \d+:',
              'if len(expanded["items"]) != 122:',
              s
          )
          s2 = re.sub(
              r'raise SystemExit\(f"Expected \d+ cards after restoration, got \{len\(expanded\[\'items\'\]\)\}"\)',
              'raise SystemExit(f"Expected 122 cards after restoration, got {len(expanded[\'items\'])}")',
              s2
          )
          assert '!= 122' in s2, 'Could not update expected publication count'
          wrapper.write_text(s2)
          PY

      - name: Rebuild publication site and verify slot 1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          docs = root / 'docs'
          pub_id = 'cs.LO_Logic_in_Computer_Science/preorders_and_fair_settlement_geometry_001'
          title = 'Preorders and Fair Settlement Geometry — SIC/AMLD Simulation Degrees and a High-Probability Complexity Framework for SAT'
          quote = (
              'The proposed empirical program is therefore modest in its logical claim and ambitious in its '
              'measurement claim. It does not provide a probability-one chance of obtaining a correct SAT answer. '
              'It requires correctness on every reported answer and uses unknown on budget exhaustion. What is '
              'probabilistic is the event that an instance drawn from a declared distribution settles within a '
              'declared resource bound.'
          )

          search = json.loads((docs / 'search-index.json').read_text())
          assert search['count'] == 122, search['count']
          assert search['items'][0]['id'] == pub_id, 'New publication is not slot #1'
          assert search['items'][0]['quote'] == quote

          index = (docs / 'index.html').read_text()
          assert '122 publications' in index
          first_card = index.split('<article class="card"', 1)[1].split('</article>', 1)[0]
          assert title in first_card
          assert quote in first_card

          pub_docs = docs / pub_id
          assert (pub_docs / 'index.html').is_file()
          assert (pub_docs / 'source.html').is_file()
          assert (pub_docs / 'source.tex').is_file()
          assert (pub_docs / 'Preorders_and_Fair_Settlement_Geometry_001.pdf').is_file()
          reader = (pub_docs / 'index.html').read_text()
          assert '/pub/pdf-reader.html?file=' in reader
          assert 'Preorders_and_Fair_Settlement_Geometry_001.pdf' in reader
          assert 'Source' in reader
          print('PASS: Preorders and Fair Settlement Geometry 001 is slot #1 with sourced SAT quote, reader, PDF, and source.')
          PY

      - name: Remove one-time staging payload
        run: rm -rf incoming_publications/preorders_and_fair_settlement_geometry_001

      - name: Commit verified publication and rebuilt library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish Preorders and Fair Settlement Geometry 001 as card 1 [skip ci]'
            git push
          fi
