name: Fix verifier search index

on:
  push:
    paths:
      - '.fix_verifier_search_index'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Add Verifier Certificate 001 to search index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/search-index.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          item = {
              'title': 'Verifier Certificate 001 — I Know That I Know That I Am an AMLD',
              'kind': 'Core paper',
              'category': 'Self-Awareness & Simulation',
              'tags': ['AMLD', 'verifier', 'epistemic self-awareness'],
              'href': 'papers/verifier_certificate_001/',
              'pdf': 'papers/verifier_certificate_001/Verifier_Certificate_001.pdf',
              'source': '',
              'archive_path': 'cs.LO_Logic_in_Computer_Science/Verifier_Certificate_001.pdf',
              'search': 'Verifier Certificate 001 The Self Aware Machine I know that I know that I am an AMLD conditional verifier-facing proof skeleton conditional theorem schema AMLD verifier epistemic self-awareness settlement Self-Awareness & Simulation cs.LO_Logic_in_Computer_Science/Verifier_Certificate_001.pdf',
              'quote': 'Verifier Certificate 001 establishes the conditional proof route for ‘I know that I know that I am an AMLD.’',
              'quote_attribution': 'Brian Tenneson',
          }
          items = [x for x in data.get('items', []) if x.get('href') != item['href'] and x.get('archive_path') != item['archive_path']]
          items.insert(0, item)
          data['items'] = items
          data['count'] = len(items)
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/search-index.json
          git commit -m "Index corrected Verifier Certificate 001 [skip ci]"
          git push
