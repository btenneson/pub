name: Publish Universal Proof-Horizon v1.2 audited edition in slot 1

on:
  push:
    branches: [main]
    paths:
      - 'incoming_publications/universal_proof_horizon_operator_v1_2/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern zip
          python -m pip install pymupdf==1.26.4

      - name: Reconstruct audited source and compile canonical PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/uph
          cat incoming_publications/universal_proof_horizon_operator_v1_2/source.b64_* > .build/uph/source.tex.gz.b64
          base64 -d .build/uph/source.tex.gz.b64 | gzip -d > .build/uph/Universal_Proof_Horizon_Tenneson_v1_2_Final_Audited.tex
          test "$(wc -c < .build/uph/Universal_Proof_Horizon_Tenneson_v1_2_Final_Audited.tex)" -eq 59584
          test "$(sha256sum .build/uph/Universal_Proof_Horizon_Tenneson_v1_2_Final_Audited.tex | cut -d' ' -f1)" = "eacab4eb5075ffcb549814db4ad354efea6290f7250ae9a6b460ea5d693c388a"
          grep -q '\\end{document}' .build/uph/Universal_Proof_Horizon_Tenneson_v1_2_Final_Audited.tex
          cd .build/uph
          pdflatex -interaction=nonstopmode -halt-on-error Universal_Proof_Horizon_Tenneson_v1_2_Final_Audited.tex
          pdflatex -interaction=nonstopmode -halt-on-error Universal_Proof_Horizon_Tenneson_v1_2_Final_Audited.tex
          test -s Universal_Proof_Horizon_Tenneson_v1_2_Final_Audited.pdf
          zip -q Universal_Proof_Horizon_Tenneson_v1_2_Final_Audited_Source_and_PDF.zip             Universal_Proof_Horizon_Tenneson_v1_2_Final_Audited.tex             Universal_Proof_Horizon_Tenneson_v1_2_Final_Audited.pdf

      - name: Validate the compiled document
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import fitz, re, hashlib
          from pathlib import Path
          p=Path('.build/uph/Universal_Proof_Horizon_Tenneson_v1_2_Final_Audited.pdf')
          doc=fitz.open(p)
          assert len(doc)==39, len(doc)
          text=' '.join(page.get_text() for page in doc)
          assert 'The Universal Proof-Horizon Operator' in text
          assert 'Version 1.2' in doc[0].get_text()
          quote='proof recovery is universal on theorems, while termination on non-theorems is not guaranteed.'
          page4=re.sub(r'\s+',' ',doc[3].get_text()).strip()
          assert quote in page4
          assert 'Final Mathematical Audit Edition' in doc[0].get_text()
          print('PASS: 39-page Version 1.2 audited PDF compiled and key text verified.')
          print('PDF SHA256:', hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Stage publication files
        shell: bash
        run: |
          set -euo pipefail
          PUB='cs.LO_Logic_in_Computer_Science/universal_proof_horizon_operator_v1_2'
          DOCS='docs/cs.LO_Logic_in_Computer_Science/universal_proof_horizon_operator_v1_2'
          PDF='Universal_Proof_Horizon_Tenneson_v1_2_Final_Audited.pdf'
          ZIP='Universal_Proof_Horizon_Tenneson_v1_2_Final_Audited_Source_and_PDF.zip'
          mkdir -p "$PUB" "$DOCS"
          cp ".build/uph/$PDF" "$PUB/$PDF"
          cp ".build/uph/$PDF" "$DOCS/$PDF"
          cp .build/uph/Universal_Proof_Horizon_Tenneson_v1_2_Final_Audited.tex "$DOCS/source.tex"
          cp ".build/uph/$ZIP" "$DOCS/$ZIP"

      - name: Ensure source-package links and current catalog size
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('scripts/build_publications.py')
          s=p.read_text()
          if "if x.get('source_package')" not in s:
              needle="if x.get('source'):result+='<a href=\"'+url(x['source'])+'\">Source</a>'"
              repl=needle+"\n if x.get('source_package'):result+='<a href=\"'+url(x['source_package'])+'\" download>Download Source + PDF ZIP</a>'"
              assert needle in s
              s=s.replace(needle,repl)
              p.write_text(s)
          p=Path('scripts/build_publications_106.py')
          s=p.read_text()
          s=re.sub(r'if len\(expanded\["items"\]\) != \d+:', 'if len(expanded["items"]) != 132:', s)
          s=re.sub(r'Expected \d+ cards after restoration', 'Expected 132 cards after restoration', s)
          p.write_text(s)
          PY

      - name: Insert definitive audited edition as publication card 1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, fitz
          root=Path('.')
          pub_id='cs.LO_Logic_in_Computer_Science/universal_proof_horizon_operator_v1_2'
          pdf_name='Universal_Proof_Horizon_Tenneson_v1_2_Final_Audited.pdf'
          zip_name='Universal_Proof_Horizon_Tenneson_v1_2_Final_Audited_Source_and_PDF.zip'
          pdf=root/pub_id/pdf_name
          doc_pdf=root/'docs'/pub_id/pdf_name
          tex=root/'docs'/pub_id/'source.tex'
          package=root/'docs'/pub_id/zip_name
          assert pdf.is_file() and doc_pdf.is_file() and tex.is_file() and package.is_file()
          digest=hashlib.sha256(pdf.read_bytes()).hexdigest()
          assert digest == hashlib.sha256(doc_pdf.read_bytes()).hexdigest()
          doc=fitz.open(pdf)
          assert len(doc)==39
          quote='proof recovery is universal on theorems, while termination on non-theorems is not guaranteed.'
          card_text=(
            'Final mathematically audited edition of the Universal Proof-Horizon paper first released as Version 1.0 on August 3, 2026. '
            'This is a definitive revision of the same paper rather than a new research architecture: Predator and Automated Logical Deciders were already present in the first edition, and Version 1.2 preserves that original MIU-to-ZFC-to-Predator-to-ALD research arc. '
            'The revision tightens a conjectural formulation and, more importantly, makes the central theorem substantially more precise: for a fixed effective proof presentation and an effectively proper total computable proof cost, one partial computable operator returns a canonical minimum-cost proof for every theorem in the enumerated theory and diverges when no proof exists. '
            'The final audit replaces ambiguous shortest-proof language with minimum-cost language, makes effective properness explicit, separates sentence indices from Gödel codes, repairs the uniformity parameters, sharpens the line-count/finite-branching boundary, states the ZFC undecidability application with its consistency qualification, and retains the corrected HaloProof and verifier-centered ATP architecture. '
            'The result has an unusually broad foundational form because it applies uniformly to effective proof presentations rather than to one theorem prover or one formal theory, while its failure to halt on non-theorems marks the Church–Gödel–Rosser boundary instead of pretending to cross it. '
            'The manuscript deliberately does not claim historical priority for recursive enumerability, does not claim a decision procedure for ZFC, and does not use superlative labels for the theorem; its contribution is the exact operator theorem, its audited boundary conditions, and the synthesis connecting formal proof recovery to practical proof-search navigation.'
          )
          data_path=root/'scripts/publications.json'
          data=json.loads(data_path.read_text())
          kept=[x for x in data['items'] if x.get('id') != pub_id]
          orders=[x.get('order') for x in kept if isinstance(x.get('order'),int)]
          new_order=(min(orders)-10) if orders else -10
          item={
            'title':'The Universal Proof-Horizon Operator — From MIU and the nth Well-Formed Formula to ZFC, Predator, and Automated Logical Deciders',
            'kind':'Core paper',
            'quote':quote,
            'quote_page':4,
            'card_text':card_text,
            'status':'FINAL MATHEMATICAL AUDIT EDITION — Version 1.2. Supersedes the earlier public editions of the same paper; Predator and Automated Logical Deciders were already present in Version 1.0.',
            'subject':'cs.LO_Logic_in_Computer_Science',
            'id':pub_id,
            'href':pub_id+'/',
            'pdf':pub_id+'/'+pdf_name,
            'archive_path':pub_id+'/'+pdf_name,
            'sha256':digest,
            'sha256_tex':hashlib.sha256(tex.read_bytes()).hexdigest(),
            'sha256_source_package':hashlib.sha256(package.read_bytes()).hexdigest(),
            'pages':39,
            'order':new_order,
            'source':pub_id+'/source.html',
            'source_file':pub_id+'/source.tex',
            'source_package':pub_id+'/'+zip_name,
            'authors':'Brian Tenneson',
            'classification_note':(
              'Final Mathematical Audit Edition, September 27, 2026. Definitive audited revision of the Universal Proof-Horizon paper first released as Version 1.0 on August 3, 2026. '
              'It preserves the original Predator and Automated Logical Decider architecture while tightening the theorem statement, effective-properness/minimality hypotheses, coding and uniformity details, finite-branching boundary, ZFC consistency qualification, HaloProof benchmark, and presentation. '
              'Subject classification: cs.LO — Logic in Computer Science.'
            )
          }
          data['items']=[item]+kept
          data_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          print('Inserted v1.2 with order',new_order)
          PY

      - name: Rebuild and audit publication site
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py
          python - <<'PY'
          from pathlib import Path
          import json
          pub_id='cs.LO_Logic_in_Computer_Science/universal_proof_horizon_operator_v1_2'
          search=json.loads(Path('docs/search-index.json').read_text())
          assert search['count']==132, search['count']
          assert search['items'][0]['id']==pub_id, search['items'][0]['id']
          home=Path('docs/index.html').read_text()
          first=home.split('<article class="card"',1)[1].split('</article>',1)[0]
          assert 'Universal Proof-Horizon Operator' in first
          assert 'Final mathematically audited edition' in first
          assert 'Predator and Automated Logical Deciders were already present in the first edition' in first
          reader=(Path('docs')/pub_id/'index.html').read_text()
          assert 'Download PDF' in reader
          assert 'Download Source + PDF ZIP' in reader
          assert (Path('docs')/pub_id/'source.tex').is_file()
          assert (Path('docs')/pub_id/'Universal_Proof_Horizon_Tenneson_v1_2_Final_Audited_Source_and_PDF.zip').is_file()
          print('PASS: v1.2 is publication slot #1; 132 rendered cards; PDF/source/ZIP links verified.')
          PY

      - name: Remove one-time staging and workflow
        shell: bash
        run: |
          rm -rf incoming_publications/universal_proof_horizon_operator_v1_2
          rm -f .github/workflows/publish_universal_proof_horizon_v1_2_slot1.yml

      - name: Commit publication
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish Universal Proof-Horizon v1.2 audited edition as card 1 [skip ci]'
            git push
          fi
