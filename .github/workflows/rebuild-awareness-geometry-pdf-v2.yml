name: Rebuild Awareness Geometry PDF v2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore exact LaTeX source
        shell: bash
        run: |
          mkdir -p docs/papers/awareness_geometry_hyperfinite_omniscience
          awk '/awareness_geometry.tex.gz.b64 <<'"'"'EOF'"'"'/{flag=1;next} flag && /^EOF$/{exit} flag{print}' .github/workflows/rebuild-awareness-geometry-pdf.yml > /tmp/awareness_geometry.tex.gz.b64
          base64 -d /tmp/awareness_geometry.tex.gz.b64 | gzip -d > docs/papers/awareness_geometry_hyperfinite_omniscience/Awareness_Geometry_Hyperfinite_Omniscience.tex
      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Awareness_Geometry_Hyperfinite_Omniscience.tex
          working_directory: docs/papers/awareness_geometry_hyperfinite_omniscience
      - name: Commit source and PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/papers/awareness_geometry_hyperfinite_omniscience/Awareness_Geometry_Hyperfinite_Omniscience.tex docs/papers/awareness_geometry_hyperfinite_omniscience/Awareness_Geometry_Hyperfinite_Omniscience.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build awareness geometry PDF [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
