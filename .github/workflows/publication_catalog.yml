name: Validate subject publication catalog
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/publications.json'
      - 'scripts/publication_aliases.json'
      - 'scripts/build_publications.py'
      - 'scripts/build_publications_106.py'
      - 'scripts/audit_subject_catalog.py'
      - 'scripts/audit_subject_catalog_106.py'
      - '.github/workflows/publication_catalog.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/publications.json'
      - 'scripts/publication_aliases.json'
      - 'scripts/build_publications.py'
      - 'scripts/build_publications_106.py'
      - 'scripts/audit_subject_catalog.py'
      - 'scripts/audit_subject_catalog_106.py'
      - '.github/workflows/publication_catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf==1.26.4
      - name: Build 106-card publication catalog
        run: python scripts/build_publications_106.py
      - name: Audit readers, documents, quotes, aliases, and redirects
        run: python scripts/audit_subject_catalog_106.py
      - name: Check committed pages match the reviewed catalog
        run: git diff --exit-code -- docs
