name: Publish immutable DATA MIND Quicksand Volume I in slot 1

on:
  push:
    branches: [main]
    paths:
      - 'DATA_MIND_Volume_I_Quicksand_Published_Preprint.pdf'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-quicksand-volume-i
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF verifier
        run: python -m pip install pymupdf==1.26.4
      - name: Verify original PDF SHA-256 and publish in slot 1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_quicksand_volume_i.py
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py
      - name: Commit PDF and catalog/reader updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/publications.json docs
          git rm -f --ignore-unmatch DATA_MIND_Volume_I_Quicksand_Published_Preprint.pdf
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
          else
            git commit -m 'Publish DATA MIND Quicksand Volume I as verified PDF in library slot 1 [skip ci]'
            git push
          fi
