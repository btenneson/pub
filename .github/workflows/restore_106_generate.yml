name: Generate restored 106-card publication site
on:
  push:
    branches: [restore-106-publication-contexts]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf==1.26.4
      - run: python scripts/build_publications_106.py
      - run: python scripts/audit_subject_catalog_106.py
      - name: Commit generated publication pages
        run: |
          if git diff --quiet -- docs; then
            echo "Generated docs already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Generate restored 106-card publication site"
          git push
