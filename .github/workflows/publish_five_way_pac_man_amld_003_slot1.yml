name: Publish Five-Way Pac-Man AMLD 003 in slot 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_five_way_pac_man_amld_003_slot1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and PDF verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install pymupdf==1.26.4

      - name: Reconstruct and compile exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/five_way_pac_man_amld_003
          cat incoming_publications/five_way_pac_man_amld_003/parts/part* | base64 -d | gzip -d > .build/five_way_pac_man_amld_003/source.tex
          test "$(wc -c < .build/five_way_pac_man_amld_003/source.tex)" -eq 41393
          test "$(sha256sum .build/five_way_pac_man_amld_003/source.tex | awk '{print $1}')" = "42117ceb6ea571ec12af552d54dbc02e52d5709c23da4f65c8a75e9adb49345a"
          grep -q '\\end{document}' .build/five_way_pac_man_amld_003/source.tex
          cd .build/five_way_pac_man_amld_003
          for i in 1 2 3 4; do
            pdflatex -interaction=nonstopmode -halt-on-error source.tex
          done
          test -s source.pdf

      - name: Stage publication under cs.LO
        shell: bash
        run: |
          set -euo pipefail
          PUB='cs.LO_Logic_in_Computer_Science/five_way_pac_man_amld_003'
          mkdir -p "$PUB" "docs/$PUB"
          cp .build/five_way_pac_man_amld_003/source.pdf "$PUB/Five_Way_Pac_Man_AMLD_003.pdf"
          cp .build/five_way_pac_man_amld_003/source.tex "docs/$PUB/source.tex"

      - name: Verify paper and promote catalog entry to slot 1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, fitz

          root = Path('.')
          pub_id = 'cs.LO_Logic_in_Computer_Science/five_way_pac_man_amld_003'
          pdf_name = 'Five_Way_Pac_Man_AMLD_003.pdf'
          archive = root / pub_id / pdf_name
          source = root / 'docs' / pub_id / 'source.tex'
          assert archive.is_file() and archive.stat().st_size > 0
          assert source.is_file() and source.stat().st_size == 41393
          assert hashlib.sha256(source.read_bytes()).hexdigest() == '42117ceb6ea571ec12af552d54dbc02e52d5709c23da4f65c8a75e9adb49345a'

          doc = fitz.open(archive)
          pages = len(doc)
          assert pages == 17, f'Expected 17 pages, got {pages}'
          quote = (
              'The formal object is not an arcade game but a typed, inference-rule-governed, weighted directed graph '
              'of complete AMLD states. Each accepted transition activates one Pioneer at a time; five families of '
              'settlement states play the role of exit classes; and the shared BANK can alter the locally available '
              'routes of several Pioneers even when only one Pioneer moves.'
          )
          page2 = re.sub(r'\s+', ' ', doc[1].get_text()).strip()
          assert quote in page2, 'Long card quote not found on PDF page 2'
          assert all(doc[i].get_text().strip() for i in range(pages)), 'Unreadable or empty PDF page'
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()

          card_text = (
              'Five-Way Pac-Man turns the five-role AMLD architecture into a weighted cooperative settlement graph '
              'with prover, refuter, dependence, independence, and contradiction Pioneers sharing a conservative BANK. '
              'It defines joint and role-restricted settlement horizons, proves a Bellman characterization and '
              'scheduling-regret identity, formalizes BANK-enabled cross-Pioneer detours, and shows how a globally '
              'optimal step may worsen one Pioneer\'s local route while shortening the AMLD\'s route to settlement. '
              'The Pac-Man picture is mnemonic; the mathematics is a rule-governed shortest-settlement control model.'
          )

          cat = root / 'scripts/publications.json'
          data = json.loads(cat.read_text())
          old = [x for x in data['items'] if x.get('id') != pub_id]
          item = {
              'title': 'Five-Way Pac-Man — Cooperative Search Geometry for Automated Metalogical Deciders',
              'kind': 'Core paper',
              'quote': quote,
              'quote_page': 2,
              'card_text': card_text,
              'subject': 'cs.LO_Logic_in_Computer_Science',
              'id': pub_id,
              'href': pub_id + '/',
              'pdf': pub_id + '/' + pdf_name,
              'archive_path': pub_id + '/' + pdf_name,
              'sha256': digest,
              'pages': pages,
              'order': -10,
              'source': pub_id + '/source.html',
              'authors': 'Brian Tenneson',
              'source_file': pub_id + '/source.tex',
              'classification_note': (
                  'Research Revision 003, September 19, 2026. Five-Pioneer AMLD state-space theory with '
                  'certificate-backed settlement, conservative BANK simulation, Bellman settlement horizons, '
                  'cross-Pioneer detours, and scheduling-regret geometry. Subject classification: cs.LO — Logic '
                  'in Computer Science.'
              )
          }
          data['items'] = [item] + old
          cat.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          wrapper = root / 'scripts/build_publications_106.py'
          s = wrapper.read_text()
          s2 = re.sub(
              r'if len\(expanded\["items"\]\) != \d+:',
              'if len(expanded["items"]) != 121:',
              s
          )
          s2 = re.sub(
              r'raise SystemExit\(f"Expected \d+ cards after restoration, got \{len\(expanded\[\'items\'\]\)\}"\)',
              'raise SystemExit(f"Expected 121 cards after restoration, got {len(expanded[\'items\'])}")',
              s2
          )
          assert '!= 121' in s2, 'Could not update expected publication count'
          wrapper.write_text(s2)
          PY

      - name: Rebuild publication site and verify slot 1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          docs = root / 'docs'
          pub_id = 'cs.LO_Logic_in_Computer_Science/five_way_pac_man_amld_003'
          title = 'Five-Way Pac-Man — Cooperative Search Geometry for Automated Metalogical Deciders'
          quote = (
              'The formal object is not an arcade game but a typed, inference-rule-governed, weighted directed graph '
              'of complete AMLD states. Each accepted transition activates one Pioneer at a time; five families of '
              'settlement states play the role of exit classes; and the shared BANK can alter the locally available '
              'routes of several Pioneers even when only one Pioneer moves.'
          )
          card_text = (
              'Five-Way Pac-Man turns the five-role AMLD architecture into a weighted cooperative settlement graph '
              'with prover, refuter, dependence, independence, and contradiction Pioneers sharing a conservative BANK. '
              'It defines joint and role-restricted settlement horizons, proves a Bellman characterization and '
              'scheduling-regret identity, formalizes BANK-enabled cross-Pioneer detours, and shows how a globally '
              'optimal step may worsen one Pioneer\'s local route while shortening the AMLD\'s route to settlement. '
              'The Pac-Man picture is mnemonic; the mathematics is a rule-governed shortest-settlement control model.'
          )

          search = json.loads((docs / 'search-index.json').read_text())
          assert search['count'] == 121, search['count']
          assert search['items'][0]['id'] == pub_id, 'New publication is not slot #1'
          assert search['items'][0]['quote'] == quote
          assert search['items'][0]['card_text'] == card_text

          index = (docs / 'index.html').read_text()
          assert '121 publications' in index
          first_card = index.split('<article class="card"', 1)[1].split('</article>', 1)[0]
          assert title in first_card
          assert quote in first_card
          assert card_text in first_card

          pub_docs = docs / pub_id
          assert (pub_docs / 'index.html').is_file()
          assert (pub_docs / 'source.html').is_file()
          assert (pub_docs / 'source.tex').is_file()
          assert (pub_docs / 'Five_Way_Pac_Man_AMLD_003.pdf').is_file()
          reader = (pub_docs / 'index.html').read_text()
          assert '/pub/pdf-reader.html?file=' in reader
          assert 'Five_Way_Pac_Man_AMLD_003.pdf' in reader
          assert 'Source' in reader
          print('PASS: Five-Way Pac-Man AMLD 003 is slot #1 with long quote, reader, PDF, and source.')
          PY

      - name: Remove one-time staging payload
        run: rm -rf incoming_publications/five_way_pac_man_amld_003

      - name: Commit verified publication and rebuilt library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish Five-Way Pac-Man AMLD 003 as card 1 [skip ci]'
            git push
          fi
