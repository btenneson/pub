name: Finalize authored publication quotations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quote-all-authored-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install PDF text utility
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Extract and select representative quotations
        shell: bash
        run: |
          python - <<'PY'
          import json, re, subprocess
          from difflib import SequenceMatcher
          from pathlib import Path
          from urllib.parse import unquote

          idx=json.loads(Path('docs/search-index.json').read_text(encoding='utf-8'))
          excluded={
              'papers/external_theorem_proving_survey_2404_09939v3/',
              'pub.experimental/Ternary_Logic_and_Independence.pdf',
              'pub.experimental/Ternary_Logic_and_Logic_with_Independence.pdf',
          }

          def extract(path):
              if not path.exists() or not path.is_file(): return ''
              if path.suffix.lower()=='.pdf':
                  try:
                      p=subprocess.run(['pdftotext','-f','1','-l','40','-layout',str(path),'-'],capture_output=True,text=True,timeout=75)
                      return p.stdout
                  except Exception:
                      return ''
              try: return path.read_text(encoding='utf-8',errors='ignore')
              except Exception: return ''

          def clean_text(t):
              t=t.replace('\ufeff',' ').replace('\u00ad','').replace('ﬁ','fi').replace('ﬂ','fl')
              t=re.sub(r'([A-Za-z])-[ \t]*\n[ \t]*([a-z])',r'\1\2',t)
              t=t.replace('\x15','-')
              return t

          def paragraph_records(t):
              t=clean_text(t).replace('\f','\n\n')
              lines=t.splitlines()
              counts={}
              for raw in lines:
                  s=re.sub(r'\s+',' ',raw).strip()
                  if 4<=len(s)<=120: counts[s]=counts.get(s,0)+1
              repeated={s for s,n in counts.items() if n>=3}
              recs=[]; cur=[]; heading=''
              def flush():
                  nonlocal cur
                  if cur:
                      p=re.sub(r'\s+',' ',' '.join(cur)).strip()
                      if p: recs.append((heading,p))
                      cur=[]
              for raw in lines:
                  s=re.sub(r'\s+',' ',raw).strip()
                  if not s:
                      flush(); continue
                  low=s.casefold()
                  if s in repeated: continue
                  if re.fullmatch(r'[-–—]?\s*\d{1,4}\s*[-–—]?',s): continue
                  if 'copyright ©' in low or 'copyright (c)' in low: continue
                  if re.search(r'https?://|www\.|\S+@\S+',s): continue
                  if re.fullmatch(r'(brian\s+tenneson|currently unaffiliated|m\.?s\.?[,]?\s*applied data science|m\.?a\.?[,]?\s*mathematics)',s,re.I): continue
                  if re.search(r'\.{4,}\s*\d+\s*$',s): continue
                  # Short standalone lines without sentence punctuation are headings.
                  if len(s)<=85 and not re.search(r'[.!?][”\"]?$',s) and len(s.split())<=11:
                      flush(); heading=s.casefold().strip(' :.-0123456789')
                      continue
                  cur.append(s)
              flush()
              return recs

          banned_fragments=(
              'statement regarding academic integrity','large language models (llms) were utilized',
              'searches included combinations of','citation search should focus','i used the following code',
              'import numpy','import pandas','def ','organized as follows','the remainder of this paper',
              'table of contents','suggested citation','all rights reserved','research status:',
          )
          meta_prefixes=(
              'copyright','version ','keywords','references','acknowledg','contact','author','prepared for',
              'research brief for','draft ','date:','figure ','table ','definition ','theorem ','lemma ',
              'proposition ','corollary ','proof.','scope and claim status','scientific-status note',
          )
          key_weights={
              'proof':5,'theorem':4,'search':5,'verif':5,'certificate':5,'settlement':5,'settle':5,
              'machine':4,'algorithm':4,'model':3,'system':3,'learning':3,'data':2,'result':3,'analysis':2,
              'control':3,'distance':3,'simulation':3,'conjecture':4,'formal':3,'prediction':2,'performance':2,
              'clinical':2,'treatment':2,'patient':1,'dose':2,'concentration':2,'statistics':2,'regression':3,
              'classification':2,'risk':2,'objective':2,'discovery':4,'induction':3,'logic':3,'mathemat':3,
              'experiment':3,'evidence':2,'policy':3,'structure':3,'optimal':3,'framework':3,'creativity':4,
              'premise':3,'inference':3,'halting':3,'density':2,'depth':2,'surjection':2,'function':1,
          }
          heading_boost={
              'abstract':22,'executive summary':20,'summary':17,'research objective':17,'core proposal':17,
              'purpose':16,'overview':14,'introduction':12,'conclusion':17,'conclusions':17,'results':15,
              'discussion':12,'interpretation':13,'main result':18,
          }

          def normalize_words(s):
              return [w.casefold() for w in re.findall(r'[A-Za-z]{4,}',s)]

          def strip_label(s):
              s=re.sub(r'^\s*(?:\d+(?:\.\d+)*\s+)?(?:abstract|purpose|core proposal|executive summary|summary|overview|introduction|experimental setting)\s*[:.—-]*\s*','',s,flags=re.I)
              s=re.sub(r'^\s*\d+(?:\.\d+)*\s+','',s)
              return s.strip(' “”"')

          def sentences(p):
              parts=re.split(r'(?<=[.!?][”\"]?)\s+(?=[A-Z“\"(])',p)
              return [strip_label(x) for x in parts if strip_label(x)]

          def usable(s,title):
              if len(s)<70 or len(s)>340: return False
              low=s.casefold()
              if not re.search(r'[.!?][”\"]?$',s): return False
              if low.startswith(meta_prefixes): return False
              if any(x in low for x in banned_fragments): return False
              if re.search(r'https?://|www\.|\S+@\S+',s): return False
              if re.search(r'\b(?:doi|isbn)\b',low): return False
              if re.match(r'^\(?\d+(?:\.\d+)+(?:\)|\s)',s): return False
              if s.count('=')>2 or sum(c in '{}[]' for c in s)>6: return False
              if sum(c.isalpha() for c in s)<max(48,int(len(s)*0.60)): return False
              # Reject title/subtitle masquerading as a sentence.
              ratio=SequenceMatcher(None,re.sub(r'\W+',' ',low),re.sub(r'\W+',' ',title.casefold())).ratio()
              tw=set(normalize_words(title)); sw=set(normalize_words(s))
              overlap=(len(tw & sw)/len(tw)) if tw else 0
              if ratio>0.62 or (overlap>0.72 and len(s)<max(150,2*len(title))): return False
              return True

          def choose(text,title):
              recs=paragraph_records(text)
              title_words=set(normalize_words(title))
              cand=[]
              for pi,(heading,p) in enumerate(recs):
                  hb=0
                  for k,v in heading_boost.items():
                      if heading==k or heading.startswith(k+' '): hb=max(hb,v)
                  for si,s in enumerate(sentences(p)):
                      if not usable(s,title): continue
                      low=s.casefold(); score=float(hb)
                      score += sum(v for k,v in key_weights.items() if k in low)
                      score += 1.3*sum(1 for w in title_words if w in low)
                      if any(x in low for x in ['we show','we prove','we find','this paper','this work','the result','the central','the key','the goal','the purpose','the practical','the machine','the model','the analysis','the experiment','we treat','we define','we propose','the results suggest']): score+=5
                      if any(x in low for x in ['therefore','thus','however','rather than','not merely','precisely','exactly','in other words','the point is','the distinction']): score+=2
                      if 95<=len(s)<=270: score+=4
                      if pi<18: score+=max(0,4-pi/5)
                      score-=1.5*len(re.findall(r'\[[0-9,;\- ]+\]',s))
                      cand.append((score,-abs(len(s)-185),-pi,-si,s))
              if not cand: return ''
              cand.sort(reverse=True)
              return cand[0][-1]

          def polish(s):
              # Only repair extraction artifacts; do not rewrite the author's wording.
              reps={
                  'signi cant':'significant','signi ficant':'significant',' nding':' finding',' ndings':' findings',
                  'veri ed':'verified','speci c':'specific','classi cation':'classification','coef cient':'coefficient',
                  'con dence':'confidence','in nite':'infinite','de nition':'definition',' rst ':' first ',
                  ' e ect':' effect',' e ective':' effective','di erent':'different','su cient':'sufficient',
              }
              for a,b in reps.items(): s=s.replace(a,b)
              return re.sub(r'\s+',' ',s).strip()

          def attribution(text):
              head=re.sub(r'\s+',' ',clean_text(text)[:5000]).casefold()
              explicit=[
                  r'collaborat(?:ed|ion).*chatgpt',r'developed.*chatgpt',r'assist(?:ed|ance).*chatgpt',
                  r'assist(?:ed|ance).*openai',r'research.*assisted by openai',r'chatgpt.*collaborat',
              ]
              return 'Brian Tenneson and ChatGPT' if any(re.search(p,head) for p in explicit) else 'Brian Tenneson'

          extra={}; failures=[]
          for item in idx['items']:
              href=item.get('href','')
              if href in excluded or item.get('quote'): continue
              rel=unquote(item.get('archive_path') or item.get('href') or '')
              path=Path(rel) if rel else Path('/nonexistent')
              text=extract(path)
              q=polish(choose(text,item.get('title','')))
              if not q:
                  failures.append((item.get('title',''),rel))
                  continue
              extra[href]={'quote':q,'quote_attribution':attribution(text)}

          if failures:
              raise SystemExit('NO_CLEAN_QUOTE '+repr(failures))
          Path('scripts/feature_quotes_full.json').write_text(json.dumps(extra,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('NEW_QUOTES',len(extra),'TOTAL',9+len(extra))
          for href,v in extra.items(): print('QUOTE',href,'|',v['quote_attribution'],'|',v['quote'])
          PY
      - name: Wire quotation metadata into all card types
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_library_homepage_v3.py')
          s=p.read_text(encoding='utf-8')
          marker='\n\ndef experimental_title(path: Path) -> str:\n'
          loader='''\n\n# Additional curated quotations for the authored publication library.\nFEATURE_QUOTES_FILE = HERE / "feature_quotes_full.json"\nif FEATURE_QUOTES_FILE.exists():\n    FEATURE_QUOTES.update(json.loads(FEATURE_QUOTES_FILE.read_text(encoding="utf-8")))\n'''
          if 'FEATURE_QUOTES_FILE = HERE / "feature_quotes_full.json"' not in s:
              if marker not in s: raise SystemExit('quote loader insertion marker missing')
              s=s.replace(marker,loader+marker,1)
          old='''    for item in items:\n        feature = FEATURE_QUOTES.get(str(item.get("href") or ""))\n        if feature:\n'''
          new='''    for item in items:\n        href = str(item.get("href") or "")\n        feature = FEATURE_QUOTES.get(href)\n        if feature is None and href.startswith(EXPERIMENTAL_GITHUB):\n            feature = FEATURE_QUOTES.get(href[len(EXPERIMENTAL_GITHUB):])\n        if feature:\n'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'href.startswith(EXPERIMENTAL_GITHUB)' not in s:
              raise SystemExit('quote matching patch marker missing')
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile scripts/build_library_homepage_v3.py
      - name: Rebuild and validate 70 authored cards
        shell: bash
        run: |
          python scripts/build_library_homepage_v3.py
          python scripts/fix_experimental_page_links.py
          python - <<'PY'
          import json,re
          d=json.load(open('docs/search-index.json',encoding='utf-8'))
          excluded={
              'papers/external_theorem_proving_survey_2404_09939v3/',
              'pub.experimental/Ternary_Logic_and_Logic_with_Independence.pdf',
          }
          assert d['count']==72==len(d['items'])
          quoted=[x for x in d['items'] if x.get('quote')]
          assert len(quoted)==70, len(quoted)
          for x in d['items']:
              if x['href'] in excluded:
                  assert not x.get('quote'), x['title']
              else:
                  q=x.get('quote','')
                  assert q, x['title']
                  assert 55 <= len(q) <= 340, (x['title'],q)
                  assert x.get('quote_attribution') in {'Brian Tenneson','Brian Tenneson and ChatGPT'}
                  assert 'Statement regarding academic integrity' not in q
                  assert 'import numpy' not in q
          print('VALIDATED_72_TOTAL_70_QUOTED_2_EXTERNAL')
          print('EXTERNAL', [x['title'] for x in d['items'] if x['href'] in excluded])
          PY
      - name: Commit rollout and remove temporary machinery
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .quote-all-authored-candidates.json
          rm -f .github/workflows/quote-all-authored-candidates.yml
          rm -f .github/workflows/quote-all-authored-apply.yml
          rm -f .github/workflows/quote-all-authored-finalize.yml
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} + || true
          git add -A
          git commit -m 'Add representative quotations to authored publication library'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
