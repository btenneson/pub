name: Finalize authored publication quotations
# QC preview 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quote-all-authored-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install PDF text utility
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Preview exact representative quotations
        run: python scripts/_quote_rollout_temp.py
