name: Finalize authored publication quotations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quote-all-authored-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install PDF text utility
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Generate, apply, and validate authored quotations
        run: python scripts/_quote_rollout_temp.py --apply
      - name: Commit durable quotation metadata and generated homepage
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} + || true
          git add docs/index.html docs/search-index.json scripts/build_library_homepage_v3.py scripts/feature_quotes_full.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add representative quotations to authored publication library'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
