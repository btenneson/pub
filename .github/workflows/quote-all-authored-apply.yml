name: Apply quotations to authored library

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quote-all-authored-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install PDF text utility
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Generate exact representative quotations
        shell: bash
        run: |
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          from urllib.parse import unquote

          root=Path('.')
          idx=json.loads(Path('docs/search-index.json').read_text(encoding='utf-8'))
          excluded={
              'papers/external_theorem_proving_survey_2404_09939v3/',
              'pub.experimental/Ternary_Logic_and_Logic_with_Independence.pdf',
          }

          def extract(path):
              if not path.exists() or not path.is_file(): return ''
              if path.suffix.lower()=='.pdf':
                  try:
                      p=subprocess.run(['pdftotext','-f','1','-l','16','-layout',str(path),'-'],capture_output=True,text=True,timeout=60)
                      return p.stdout
                  except Exception:
                      return ''
              try: return path.read_text(encoding='utf-8',errors='ignore')
              except Exception: return ''

          def clean_raw(t):
              t=t.replace('\ufeff',' ').replace('\u00ad','')
              t=t.replace('ﬁ','fi').replace('ﬂ','fl')
              # Repair ordinary end-of-line word hyphenation from PDF extraction.
              t=re.sub(r'([A-Za-z])-[ \t]*\n[ \t]*([a-z])',r'\1\2',t)
              return t

          def paragraphs(t):
              t=clean_raw(t).replace('\f','\n\n')
              lines=t.splitlines()
              out=[]; cur=[]
              def flush():
                  nonlocal cur
                  if cur:
                      p=' '.join(cur)
                      p=re.sub(r'\s+',' ',p).strip()
                      if p: out.append(p)
                      cur=[]
              for line in lines:
                  s=re.sub(r'\s+',' ',line).strip()
                  if not s:
                      flush(); continue
                  low=s.casefold()
                  if re.fullmatch(r'[-–—]?\s*\d{1,4}\s*[-–—]?',s): continue
                  if 'copyright ©' in low or 'copyright (c)' in low: continue
                  if re.search(r'https?://|www\.|\S+@\S+',s): continue
                  if re.fullmatch(r'(brian\s+tenneson|tenneson(?:,?\s+version\s*\S+)?|currently unaffiliated|m\.?s\.?[,]?\s*applied data science|m\.?a\.?[,]?\s*mathematics)',s,re.I): continue
                  if re.search(r'\.{4,}\s*\d+\s*$',s): continue
                  cur.append(s)
              flush()
              return out

          meta_starts=(
              'copyright','version ','keywords','contents','table of contents','references','acknowledg','suggested citation',
              'contact','author','prepared for','research brief for','draft ','date:','abstract:','figure ','table ','definition ',
              'theorem ','lemma ','proposition ','corollary ','proof.','scope and claim status','scientific-status note'
          )
          insight_words={
              'proof':5,'theorem':4,'search':5,'verify':5,'verification':5,'certificate':5,'settlement':5,'settle':5,
              'machine':4,'algorithm':4,'model':3,'system':3,'learning':3,'data':2,'result':3,'analysis':2,'control':3,
              'distance':3,'simulation':3,'conjecture':4,'formal':3,'prediction':2,'performance':2,'clinical':2,
              'patient':1,'sport':1,'player':1,'dose':2,'concentration':2,'statistics':2,'regression':2,'network':2,
              'classification':2,'risk':2,'objective':2,'discovery':4,'induction':3,'logic':3,'mathematics':3,
              'experiment':3,'evidence':2,'policy':3,'structure':3,'optimal':3,'framework':3,'creativity':4,'creative':4,
              'premise':3,'inference':3,'halting':3,'density':2,'depth':2,'surjection':2,'function':1,'simulation':3
          }

          def split_sentences(p):
              # Most source prose has conventional sentence endings; keep abbreviations conservative.
              return [x.strip(' \t\n“”\"') for x in re.split(r'(?<=[.!?])\s+(?=[A-Z“\"(])',p) if x.strip()]

          def usable(s):
              if len(s)<68 or len(s)>360: return False
              low=s.casefold()
              if low.startswith(meta_starts): return False
              if re.search(r'https?://|www\.|\S+@\S+',s): return False
              if re.search(r'\b(pp?\.|doi|isbn)\b',low): return False
              if sum(c.isalpha() for c in s)<max(45,int(len(s)*0.60)): return False
              if s.count('|')>1 or s.count('=')>3 or sum(c in '{}[]' for c in s)>8: return False
              if re.search(r'\.{3,}|_{2,}|\\begin|\\end|\$\$|\bfigure\s+\d|\btable\s+\d',low): return False
              # Avoid sentences contaminated by page/header material.
              if re.search(r'\b(?:version|august|july|june|may|april|march|february|january)\s+\d{1,2}\b',low): return False
              return True

          def choose(text,title):
              ps=paragraphs(text)
              title_words={w.casefold() for w in re.findall(r'[A-Za-z]{5,}',title) if w.casefold() not in {'with','from','using','their','about','automated','version'}}
              candidates=[]
              section_boost=0
              for pi,p in enumerate(ps):
                  pl=p.casefold().strip(' :.-')
                  if pl in {'abstract','executive summary','summary','research objective','core proposal','purpose','overview','introduction'}:
                      section_boost={'abstract':18,'executive summary':17,'summary':14,'research objective':16,'core proposal':16,'purpose':14,'overview':12,'introduction':10}[pl]
                      continue
                  # Let a heading boost decay over the next several paragraphs.
                  local_boost=max(0,section_boost)
                  if section_boost: section_boost=max(0,section_boost-3)
                  for si,s in enumerate(split_sentences(p)):
                      if not usable(s): continue
                      low=s.casefold()
                      score=float(local_boost)
                      score += sum(w for k,w in insight_words.items() if k in low)
                      overlap=sum(1 for w in title_words if w in low)
                      score += 2.5*overlap
                      if any(x in low for x in ['we show','we prove','this paper','this work','the result','the central','the key','the goal','the purpose','the practical','the machine','the model','the analysis','the experiment','we treat','we define','we propose']): score+=4
                      if any(x in low for x in ['therefore','thus','however','rather than','not merely','precisely','exactly','in other words','the point is','the distinction']): score+=2
                      if 100<=len(s)<=270: score+=3
                      if pi<12: score+=max(0,4-pi/4)
                      if any(x in low for x in ['organized as follows','the remainder of','next section','section 1','section 2','section 3']): score-=8
                      score-=1.5*len(re.findall(r'\[[0-9,;\- ]+\]',s))
                      candidates.append((score,-abs(len(s)-190),-pi,-si,s))
              if candidates:
                  candidates.sort(reverse=True)
                  return candidates[0][-1]
              # Conservative fallback: first clean prose paragraph trimmed to one sentence-length block.
              for p in ps:
                  if 80<=len(p)<=320 and usable(p): return p
              for p in ps:
                  for s in split_sentences(p):
                      if len(s)>=55 and sum(c.isalpha() for c in s)>40: return s[:350].strip()
              return ''

          def attribution(text):
              head=re.sub(r'\s+',' ',clean_raw(text)[:3500]).casefold()
              explicit=[
                  r'collaborat(?:ed|ion).*chatgpt',r'developed.*chatgpt',r'assist(?:ed|ance).*chatgpt',
                  r'assist(?:ed|ance).*openai',r'research.*assisted by openai',r'chatgpt.*collaborat',
              ]
              return 'Brian Tenneson and ChatGPT' if any(re.search(p,head) for p in explicit) else 'Brian Tenneson'

          extra={}
          failures=[]
          for item in idx['items']:
              href=item.get('href','')
              if href in excluded or item.get('quote'): continue
              ap=unquote(item.get('archive_path') or '')
              path=root/ap if ap else Path('/nonexistent')
              text=extract(path)
              q=choose(text,item.get('title',''))
              if not q:
                  failures.append((item.get('title',''),ap))
                  continue
              extra[href]={'quote':q,'quote_attribution':attribution(text)}

          if failures:
              raise SystemExit('Could not obtain quotations for: '+repr(failures))
          Path('scripts/feature_quotes_full.json').write_text(json.dumps(extra,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('new quotation records:',len(extra))
          print('expected total quoted:',9+len(extra))
          for href,v in extra.items():
              print(href,'|',v['quote_attribution'],'|',v['quote'])
          PY
      - name: Teach homepage builder to load full quotation file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_library_homepage_v3.py')
          s=p.read_text(encoding='utf-8')
          marker='\n\ndef experimental_title(path: Path) -> str:\n'
          loader='''\n\n# Additional curated quotations for the authored publication library.\n# Kept in a data file so quotation metadata can grow without obscuring the\n# homepage ordering and rendering logic.\nFEATURE_QUOTES_FILE = HERE / "feature_quotes_full.json"\nif FEATURE_QUOTES_FILE.exists():\n    FEATURE_QUOTES.update(json.loads(FEATURE_QUOTES_FILE.read_text(encoding="utf-8")))\n'''
          if 'FEATURE_QUOTES_FILE = HERE / "feature_quotes_full.json"' not in s:
              if marker not in s: raise SystemExit('builder insertion marker not found')
              s=s.replace(marker,loader+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile scripts/build_library_homepage_v3.py
      - name: Rebuild and validate integrated catalogue
        shell: bash
        run: |
          python scripts/build_library_homepage_v3.py
          python scripts/fix_experimental_page_links.py
          python - <<'PY'
          import json
          d=json.load(open('docs/search-index.json',encoding='utf-8'))
          excluded={
              'papers/external_theorem_proving_survey_2404_09939v3/',
              'pub.experimental/Ternary_Logic_and_Logic_with_Independence.pdf',
          }
          assert d['count']==72==len(d['items'])
          quoted=[x for x in d['items'] if x.get('quote')]
          assert len(quoted)==70, len(quoted)
          for x in d['items']:
              if x['href'] in excluded:
                  assert not x.get('quote'), x['title']
              else:
                  assert x.get('quote'), x['title']
                  assert x.get('quote_attribution') in {'Brian Tenneson','Brian Tenneson and ChatGPT'}
          print('catalogue items:',d['count'])
          print('quoted authored items:',len(quoted))
          print('excluded external items:',[x['title'] for x in d['items'] if x['href'] in excluded])
          PY
      - name: Remove temporary audit machinery and commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .quote-all-authored-candidates.json
          rm -f .github/workflows/quote-all-authored-candidates.yml
          rm -f .github/workflows/quote-all-authored-apply.yml
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} + || true
          git add -A
          git commit -m 'Add representative quotations to authored library'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
