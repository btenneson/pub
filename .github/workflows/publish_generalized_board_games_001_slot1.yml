name: Publish Generalized Board Games 001 in slot 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_generalized_board_games_001_slot1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and PDF verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install pymupdf==1.26.4

      - name: Reconstruct and compile audited source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/generalized_board_games_001
          cat incoming_publications/generalized_board_games_001/source.tex.gz.b64.part* | base64 -d | gzip -d > .build/generalized_board_games_001/source.tex
          test "$(wc -c < .build/generalized_board_games_001/source.tex)" -eq 30062
          test "$(sha256sum .build/generalized_board_games_001/source.tex | awk '{print $1}')" = "ea7c9d2909e0cae90dbfb15dccb515fe486cd5c9fe6af4797dc777be77ea9dd6"
          grep -q '\\end{document}' .build/generalized_board_games_001/source.tex
          cd .build/generalized_board_games_001
          for i in 1 2 3 4; do
            pdflatex -interaction=nonstopmode -halt-on-error source.tex
          done
          test -s source.pdf

      - name: Verify paper and stage publication files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz, re
          pdf = Path('.build/generalized_board_games_001/source.pdf')
          doc = fitz.open(pdf)
          assert len(doc) == 13, f'Expected 13 pages, got {len(doc)}'
          p1 = re.sub(r'\s+', ' ', doc[0].get_text()).strip()
          assert 'Generalized Board Games' in p1
          quote = 'Tic-tac-toe supplies transparency; chess supplies scale; both instantiate the same xyz proof-theoretic architecture.'
          assert quote in p1, 'Card quote not found on page 1'
          assert all(doc[i].get_text().strip() for i in range(len(doc))), 'Unreadable or empty PDF page'
          print('PASS: 13-page GBG paper compiled; title and quote verified.')
          PY
          PUB='cs.LO_Logic_in_Computer_Science/generalized_board_games_tic_tac_toe_chess_001'
          DOCS="docs/$PUB"
          mkdir -p "$PUB" "$DOCS"
          cp .build/generalized_board_games_001/source.pdf "$PUB/Generalized_Board_Games_From_Tic_Tac_Toe_to_Chess_001.pdf"
          cp .build/generalized_board_games_001/source.pdf "$DOCS/Generalized_Board_Games_From_Tic_Tac_Toe_to_Chess_001.pdf"
          cp .build/generalized_board_games_001/source.tex "$DOCS/source.tex"

      - name: Promote publication to card slot 1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, fitz

          root = Path('.')
          pub_id = 'cs.LO_Logic_in_Computer_Science/generalized_board_games_tic_tac_toe_chess_001'
          pdf_name = 'Generalized_Board_Games_From_Tic_Tac_Toe_to_Chess_001.pdf'
          archive = root / pub_id / pdf_name
          source = root / 'docs' / pub_id / 'source.tex'
          doc_pdf = root / 'docs' / pub_id / pdf_name
          assert archive.is_file() and archive.stat().st_size > 0
          assert doc_pdf.is_file() and doc_pdf.stat().st_size > 0
          assert source.is_file() and source.stat().st_size == 30062
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'ea7c9d2909e0cae90dbfb15dccb515fe486cd5c9fe6af4797dc777be77ea9dd6'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == hashlib.sha256(doc_pdf.read_bytes()).hexdigest()

          doc = fitz.open(archive)
          pages = len(doc)
          assert pages == 13
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          quote = 'Tic-tac-toe supplies transparency; chess supplies scale; both instantiate the same xyz proof-theoretic architecture.'
          card_text = (
              'Generalized board games such as tic-tac-toe and chess are concrete examples of the xyz formal systems '
              'used throughout the entire corpus. This paper makes that connection explicit: rule-complete game states '
              'serve as well-formed formal objects, legal moves become partial inference rules, finite reachability becomes '
              'theoremhood, and legal histories become match-proofs. Tic-tac-toe provides the small exact model while '
              'chess demonstrates the same architecture at large combinatorial scale.'
          )

          cat = root / 'scripts/publications.json'
          data = json.loads(cat.read_text())
          old = [x for x in data['items'] if x.get('id') != pub_id]
          item = {
              'title': 'Generalized Board Games — From Tic-Tac-Toe to Chess as xyz Formal Systems',
              'kind': 'Core paper',
              'quote': quote,
              'quote_page': 1,
              'card_text': card_text,
              'subject': 'cs.LO_Logic_in_Computer_Science',
              'id': pub_id,
              'href': pub_id + '/',
              'pdf': pub_id + '/' + pdf_name,
              'archive_path': pub_id + '/' + pdf_name,
              'sha256': digest,
              'pages': pages,
              'order': -120,
              'source': pub_id + '/source.html',
              'authors': 'Brian Tenneson',
              'source_file': pub_id + '/source.tex',
              'classification_note': (
                  'Research paper, September 22, 2026. Generalized board games as concrete xyz formal systems; '
                  'tic-tac-toe precedes chess as the exact finite example, followed by chess as the large-scale example. '
                  'Subject classification: cs.LO — Logic in Computer Science.'
              )
          }
          data['items'] = [item] + old
          cat.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          search = json.loads((root / 'docs/search-index.json').read_text())
          old_count = int(search['count'])
          expected = old_count + 1
          (root / '.build/generalized_board_games_001/expected_count.txt').write_text(str(expected))

          wrapper = root / 'scripts/build_publications_106.py'
          s = wrapper.read_text()
          s2, n1 = re.subn(
              r'if len\(expanded\["items"\]\) != \d+:',
              f'if len(expanded["items"]) != {expected}:',
              s,
              count=1
          )
          s2, n2 = re.subn(
              r'Expected \d+ cards after restoration',
              f'Expected {expected} cards after restoration',
              s2,
              count=1
          )
          assert n1 == 1 and n2 == 1, 'Could not update expected publication count'
          wrapper.write_text(s2)
          print(f'Catalog will grow from {old_count} to {expected} cards.')
          PY

      - name: Rebuild publication site and verify slot 1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          docs = root / 'docs'
          pub_id = 'cs.LO_Logic_in_Computer_Science/generalized_board_games_tic_tac_toe_chess_001'
          title = 'Generalized Board Games — From Tic-Tac-Toe to Chess as xyz Formal Systems'
          quote = 'Tic-tac-toe supplies transparency; chess supplies scale; both instantiate the same xyz proof-theoretic architecture.'
          required_card_phrase = 'Generalized board games such as tic-tac-toe and chess are concrete examples of the xyz formal systems used throughout the entire corpus.'
          expected = int((root / '.build/generalized_board_games_001/expected_count.txt').read_text())

          search = json.loads((docs / 'search-index.json').read_text())
          assert search['count'] == expected, search['count']
          assert search['items'][0]['id'] == pub_id, 'GBG publication is not slot #1'
          assert search['items'][0]['quote'] == quote
          assert required_card_phrase in search['items'][0].get('card_text', '')

          index = (docs / 'index.html').read_text()
          first_card = index.split('<article class="card"', 1)[1].split('</article>', 1)[0]
          assert title in first_card
          assert quote in first_card
          assert required_card_phrase in first_card

          pub_docs = docs / pub_id
          assert (pub_docs / 'index.html').is_file()
          assert (pub_docs / 'source.html').is_file()
          assert (pub_docs / 'source.tex').is_file()
          assert (pub_docs / 'Generalized_Board_Games_From_Tic_Tac_Toe_to_Chess_001.pdf').is_file()
          reader = (pub_docs / 'index.html').read_text()
          assert '/pub/pdf-reader.html?file=' in reader
          assert 'Generalized_Board_Games_From_Tic_Tac_Toe_to_Chess_001.pdf' in reader
          assert 'Source' in reader
          print('PASS: Generalized Board Games 001 is slot #1 with requested corpus-language card, reader, PDF, and source.')
          PY

      - name: Remove one-time staging payload
        run: rm -rf incoming_publications/generalized_board_games_001

      - name: Commit verified publication and rebuilt library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish Generalized Board Games 001 as card 1 [skip ci]'
            git push
          fi
