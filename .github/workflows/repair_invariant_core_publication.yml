name: Restore Invariant Core publication

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair_invariant_core_publication.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reconstruct exact Invariant Core LaTeX source from historical chunks
        shell: bash
        run: |
          mkdir -p .build/invariant_core_source 'documents and their sources'
          git show 021f5be0dbe3c89a29be85915615d521adcd08d6:.build/invariant_core_source/part00.b64 > .build/invariant_core_source/part00.b64
          git show c75779d58f5fe8f6cc53498b4fc9b9053de6cb34:.build/invariant_core_source/part01.b64 > .build/invariant_core_source/part01.b64
          git show 214663732966498dc4b40d401db555b92142694c:.build/invariant_core_source/part02.b64 > .build/invariant_core_source/part02.b64
          git show 14ba8786e67aa8a361465903b88d4432a416faf9:.build/invariant_core_source/part03.b64 > .build/invariant_core_source/part03.b64
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib
          parts=sorted(Path('.build/invariant_core_source').glob('part*.b64'))
          if len(parts)!=4: raise SystemExit(f'expected 4 chunks, found {len(parts)}')
          data=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          staged=hashlib.sha256(data).hexdigest()
          known='bdf890ff9bc332b5dac315017e9ce5dae96c5726b210ee94554eec2de49f594e'
          if staged==known:
              bad=br'\src{\emph{Trading Theorem 001}, p.~5.}'
              good=br'\src{\emph{Trading Theorem 001}, p.~2.}'
              if data.count(bad)<1: raise SystemExit('known staging correction target not found')
              data=data.replace(bad,good,1)
          expected='f26fd877d92b3c6b0323d47d7726e11d0976bf1eddb9637ea0ac91531d350e57'
          got=hashlib.sha256(data).hexdigest()
          if got!=expected: raise SystemExit(f'checksum mismatch after staging repair: {got}')
          out=Path('documents and their sources/The_Invariant_Core_and_the_Geometry_of_Settlement.tex')
          out.write_bytes(data)
          print('restored exact source:',got)
          PY

      - name: Compile restored paper and install archive/reader copies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern cm-super
          SOURCE='documents and their sources/The_Invariant_Core_and_the_Geometry_of_Settlement.tex'
          OUT='The_Invariant_Core_and_the_Geometry_of_Settlement.pdf'
          mkdir -p build/invariant-core cs.LO_Logic_in_Computer_Science docs/papers/invariant_core_geometry_settlement
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build/invariant-core "$SOURCE"
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build/invariant-core "$SOURCE"
          test -s "build/invariant-core/$OUT"
          cp "build/invariant-core/$OUT" "cs.LO_Logic_in_Computer_Science/$OUT"
          cp "build/invariant-core/$OUT" "docs/papers/invariant_core_geometry_settlement/$OUT"
          sha256sum "$SOURCE" | awk '{print $1}' > cs.LO_Logic_in_Computer_Science/The_Invariant_Core_and_the_Geometry_of_Settlement.source.sha256
          python - <<'PY'
          from pathlib import Path
          import html
          src=Path('documents and their sources/The_Invariant_Core_and_the_Geometry_of_Settlement.tex').read_text(encoding='utf-8')
          out=Path('docs/papers/invariant_core_geometry_settlement/source.html')
          out.write_text('<!doctype html><meta charset="utf-8"><title>The Invariant Core — source</title><p><a href="./">← Back to article</a></p><h1>LaTeX source</h1><pre>'+html.escape(src)+'</pre>\n',encoding='utf-8')
          PY

      - name: Repair Invariant Core catalogue entry without disturbing Story card 1
        run: python scripts/repair_invariant_core_card.py

      - name: Validate restored publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=Path('cs.LO_Logic_in_Computer_Science/The_Invariant_Core_and_the_Geometry_of_Settlement.pdf')
          r=Path('docs/papers/invariant_core_geometry_settlement/The_Invariant_Core_and_the_Geometry_of_Settlement.pdf')
          s=Path('documents and their sources/The_Invariant_Core_and_the_Geometry_of_Settlement.tex')
          sh=Path('docs/papers/invariant_core_geometry_settlement/source.html')
          assert a.is_file() and r.is_file() and s.is_file() and sh.is_file()
          assert a.read_bytes()==r.read_bytes()
          d=json.load(open('docs/search-index.json',encoding='utf-8'))
          assert d['items'][0]['title']=='The Gedanbedai of Wake Island'
          inv=next(x for x in d['items'] if x.get('title')=='The Invariant Core and the Geometry of Settlement')
          assert inv['archive_path']==str(a)
          assert inv.get('pdf') and inv.get('source') and inv.get('quote')
          print('card 1:',d['items'][0]['title'])
          print('Invariant Core restored:',a.stat().st_size,'bytes')
          PY

      - name: Commit restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'documents and their sources/The_Invariant_Core_and_the_Geometry_of_Settlement.tex' \
                  cs.LO_Logic_in_Computer_Science/The_Invariant_Core_and_the_Geometry_of_Settlement.pdf \
                  cs.LO_Logic_in_Computer_Science/The_Invariant_Core_and_the_Geometry_of_Settlement.source.sha256 \
                  docs/papers/invariant_core_geometry_settlement/The_Invariant_Core_and_the_Geometry_of_Settlement.pdf \
                  docs/papers/invariant_core_geometry_settlement/source.html \
                  docs/index.html docs/search-index.json
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'Restore Invariant Core source PDF and catalogue entry'
            git push
          fi
