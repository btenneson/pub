name: Rebuild Awareness Geometry PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'Build awareness geometry PDF') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact LaTeX source
        shell: bash
        run: |
          mkdir -p docs/papers/awareness_geometry_hyperfinite_omniscience
          cat > /tmp/awareness_geometry.tex.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/awareness_geometry.tex.gz.b64 | gzip -d > docs/papers/awareness_geometry_hyperfinite_omniscience/Awareness_Geometry_Hyperfinite_Omniscience.tex
      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Awareness_Geometry_Hyperfinite_Omniscience.tex
          working_directory: docs/papers/awareness_geometry_hyperfinite_omniscience
      - name: Commit exact source and built PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/papers/awareness_geometry_hyperfinite_omniscience/Awareness_Geometry_Hyperfinite_Omniscience.tex docs/papers/awareness_geometry_hyperfinite_omniscience/Awareness_Geometry_Hyperfinite_Omniscience.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build awareness geometry PDF"
            git push
          fi
