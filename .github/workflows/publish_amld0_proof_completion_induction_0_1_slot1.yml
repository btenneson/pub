name: Publish AMLD0 frozen-prefix experiment in slot 1
on:
  push:
    branches: [main]
    paths:
      - 'incoming_publications/amld0_proof_completion_induction_0_1/source.tex'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-amld0-proof-completion-0-1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source and publish audited PDF in slot 1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended lmodern
          python -m pip install -q pymupdf==1.26.4
          mkdir -p .build/amld0_proof_completion_induction_0_1
          cp incoming_publications/amld0_proof_completion_induction_0_1/source.tex .build/amld0_proof_completion_induction_0_1/AMLD0_Proof_Completion_Induction_45_2_Experiment_0_1.tex
          (cd .build/amld0_proof_completion_induction_0_1 && pdflatex -interaction=nonstopmode -halt-on-error AMLD0_Proof_Completion_Induction_45_2_Experiment_0_1.tex >/dev/null && pdflatex -interaction=nonstopmode -halt-on-error AMLD0_Proof_Completion_Induction_45_2_Experiment_0_1.tex >/dev/null)
          python - <<'PY'
          from pathlib import Path
          import fitz,hashlib,json,re,shutil,zipfile
          rel="cs.LO_Logic_in_Computer_Science/amld0_frozen_prefix_proof_completion_depths_45_2_0_1"
          name="AMLD0_Proof_Completion_Induction_45_2_Experiment_0_1"
          source=Path("incoming_publications/amld0_proof_completion_induction_0_1/source.tex")
          pdf=Path(".build/amld0_proof_completion_induction_0_1")/(name+".pdf")
          raw=pdf.read_bytes()
          doc=fitz.open(stream=raw,filetype="pdf")
          assert len(doc)==7, f"Expected 7 pages, found {len(doc)}"
          assert all(p.get_text().strip() for p in doc)
          assert "This was not a valid blind test" in re.sub(r"\s+"," ",doc[0].get_text())
          tex=source.read_bytes()
          assert hashlib.sha256(tex).hexdigest()=="0d642e448e7bc9c5c612852cc9a10431d97d802a7073765941135f6fcd1c2b84", "Source hash mismatch"
          dest=Path("docs")/rel
          archive=Path(rel)
          dest.mkdir(parents=True,exist_ok=True)
          archive.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(pdf,dest/(name+".pdf"))
          shutil.copyfile(pdf,archive/(name+".pdf"))
          shutil.copyfile(source,dest/"source.tex")
          with zipfile.ZipFile(dest/(name+"_Publication_Package.zip"),"w",compression=zipfile.ZIP_DEFLATED) as z:
              z.write(pdf,name+".pdf")
              z.write(source,name+".tex")
          hash_pdf=hashlib.sha256(raw).hexdigest()
          catalog=Path("scripts/publications.json")
          data=json.loads(catalog.read_text(encoding="utf-8"))
          rest=[x for x in data["items"] if x.get("id")!=rel]
          order=min([x.get("order") for x in rest if isinstance(x.get("order"),int)]+[0])-1
          item={"title":"A Frozen-Prefix Proof-Completion Experiment — Induction on Proof Lines in Depths of a Simulation 45.2",
          "kind":"Research note","subject":"cs.LO_Logic_in_Computer_Science","id":rel,
          "href":rel+"/","pdf":rel+"/"+name+".pdf","archive_path":rel+"/"+name+".pdf",
          "source":rel+"/source.html","source_file":rel+"/source.tex",
          "source_package":rel+"/"+name+"_Publication_Package.zip",
          "sha256":hash_pdf,"sha256_tex":hashlib.sha256(tex).hexdigest(),"pages":7,"order":order,
          "authors":"Research direction and source theorem: Brian Tenneson; technical drafting and in-chat proof: DATA MIND / ChatGPT",
          "quote":"This was not a valid blind test","quote_page":1,"quote_attribution":"Research note 0.1 · page 1",
          "card_quote":"A completed proof is a mathematical result; a blind discovery is a separate experimental claim.",
          "card_quote_attribution":"Editorial publication-card quotation · October 2026","quote_also_on_card":True,
          "card_text":"An in-chat AMLD+0-structured experiment completed a frozen partial proof of induction on proof lines. The candidate argument was mathematically sound and followed the original method. The original ending had already been exposed in the conversation, so independent blind discovery or authenticated AMLD+0 machine certification was not established.",
          "status":"MATHEMATICAL PROOF-COMPLETION DEMONSTRATION — October 17, 2026; mathematical proof reviewed, but authentic blind discovery and independent AMLD+0 settlement not established.",
          "classification_note":"Seven-page Research Note 0.1. Frozen-prefix source comparison, hypothesis-scope audit, and limitations. No authenticated external prover run or machine-verifier acceptance receipt."}
          data["items"]=[item]+rest
          catalog.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          assert (dest/"source.tex").read_bytes()==tex
          assert (archive/(name+".pdf")).read_bytes()==raw
          print("Publication staged:",rel,"PDF sha256:",hash_pdf,"order",order)
          PY
          python scripts/build_publications_106.py
          python scripts/audit_subject_catalog_106.py
          python - <<'PY'
          import json
          from pathlib import Path
          rel="cs.LO_Logic_in_Computer_Science/amld0_frozen_prefix_proof_completion_depths_45_2_0_1"
          quote="A completed proof is a mathematical result; a blind discovery is a separate experimental claim."
          c=json.loads(Path("docs/search-index.json").read_text())
          assert c["items"][0]["id"]==rel,"Not first in published search index"
          first=Path("docs/index.html").read_text().split('<article class="card"',1)[1].split("</article>",1)[0]
          assert quote in first,"Card quote missing"
          assert "Download PDF" in first and "Download Source + PDF ZIP" in first
          assert (Path("docs")/rel/"source.html").is_file()
          print("PASS first card, attribution, PDF/source/ZIP links, reader, search index")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/publications.json docs cs.LO_Logic_in_Computer_Science/amld0_frozen_prefix_proof_completion_depths_45_2_0_1
          if ! git diff --cached --quiet; then git commit -m 'Publish AMLD0 frozen-prefix experiment as library slot 1'; git push origin HEAD:main; fi
