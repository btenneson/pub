name: Audit publication links - manual safe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-publication-links-manual-safe
  cancel-in-progress: false

jobs:
  audit-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run audit without modifying repository
        run: |
          mkdir -p build
          python scripts/publication_link_audit_repair.py \
            --network \
            --report build/LINK_AUDIT.md \
            --manifest build/link-audit-final.json || true
          python scripts/audit_publication_library.py || true

      - name: Protect publication count
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('docs/search-index.json').read_text(encoding='utf-8'))
          n=len(data.get('items', []))
          declared=data.get('count')
          print(f'Publication index count: declared={declared}, actual={n}')
          if n < 102:
              raise SystemExit(f'Publication index regression: expected at least 102, found {n}')
          PY
