name: Validate NSA trading reader path - manual safe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate public reader files
        shell: bash
        run: |
          test -s docs/cs.LO_Logic_in_Computer_Science/nsa_and_trading_speedup/index.html
          test -s docs/cs.LO_Logic_in_Computer_Science/nsa_and_trading_speedup/fulltext-00.txt
          test -s docs/cs.LO_Logic_in_Computer_Science/nsa_and_trading_speedup/fulltext-01.txt
          test -s docs/cs.LO_Logic_in_Computer_Science/nsa_and_trading_speedup/fulltext-02.txt

      - name: Validate publication count
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('docs/search-index.json').read_text(encoding='utf-8'))
          n=len(data.get('items', []))
          print(f'Publication index count: {n}')
          if n < 102:
              raise SystemExit(f'Publication index regression: expected at least 102, found {n}')
          nsa=next(x for x in data['items'] if x['title']=='Nonstandard Analysis and Certified Presentation Trading as Sources of Proof-Search Speedups')
          print('NSA card href:', nsa.get('href'))
          print('NSA archive path:', nsa.get('archive_path'))
          PY
