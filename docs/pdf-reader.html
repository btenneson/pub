<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF reader</title><style>*{box-sizing:border-box}body{margin:0;background:#3f454b;color:#111;font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.toolbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:center;gap:.45rem;flex-wrap:wrap;padding:.5rem;background:#f6f7f8;border-bottom:1px solid #c9ced3}.toolbar button,.toolbar a{font:inherit;padding:.45rem .65rem;border:1px solid #aeb5bc;border-radius:7px;background:white;color:#17212b;text-decoration:none;cursor:pointer}.toolbar button:disabled{opacity:.45}.page-info{min-width:7.5rem;text-align:center}.stage{min-height:calc(100vh - 58px);display:flex;justify-content:center;align-items:flex-start;padding:18px}.stage canvas{display:block;max-width:100%;height:auto;background:white;box-shadow:0 2px 14px #0007}.status{max-width:48rem;margin:3rem auto;padding:1rem;background:white;border-radius:8px}.status[hidden]{display:none}@media(max-width:560px){.toolbar{gap:.3rem;padding:.4rem}.toolbar button,.toolbar a{padding:.42rem .55rem}.stage{padding:8px}}@media(prefers-color-scheme:dark){.toolbar{background:#20262c;border-color:#46505a}.toolbar button,.toolbar a{background:#303941;color:#f3f6f8;border-color:#65717c}.page-info{color:#f3f6f8}} </style></head><body><div class="toolbar"><button id="prev" type="button" aria-label="Previous page">‹ Prev</button><span class="page-info" id="pageInfo">Loading…</span><button id="next" type="button" aria-label="Next page">Next ›</button><button id="zoomOut" type="button" aria-label="Zoom out">−</button><button id="zoomIn" type="button" aria-label="Zoom in">+</button><a id="openPdf" target="_blank" rel="noopener">Open PDF</a></div><div class="stage"><canvas id="page"></canvas><div class="status" id="status" hidden></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script><script src="/pub/pdf-reader.js"></script></body></html>
